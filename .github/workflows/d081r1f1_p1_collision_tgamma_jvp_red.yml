name: d081r1f1-p1-collision-tgamma-jvp-red

on:
  push:
    branches:
      - research/d081r1f1-p1-collision-tgamma-jvp-red-20260905-r1
    paths:
      - .github/workflows/d081r1f1_p1_collision_tgamma_jvp_red.yml

permissions:
  contents: write
  actions: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger and frozen P1 authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 8c6fcf68186040313b6fd7407ff027205cfa1df8 HEAD
          test "$(git hash-object docs/audit/D081R1F1_P1_ELECTRON_COLLISION_TGAMMA_JVP_CONTRACT_2026-09-05.md)" = ff568c9193de5e9f2fecb07c1694df3bf4ea5549
          test "$(git hash-object native/rabbit_cpu/src/f10_electron_action_tgamma_jvp_red_tests.rs)" = 93a7b248217be5c21dc95a8986d59dbf1412fa1f
          test "$(git hash-object native/rabbit_cpu/src/lib.rs)" = 4ee830c065c4623bdc5486a83701d9f39c4a8ce1
          test "$(git hash-object native/rabbit_cpu/src/f10_electron_action.rs)" = f1c25926100ae6904a95b180ac50a2f05cdcfeaf
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_tangent.rs)" = 8d731d9f88076375b73ac4eca2a6ac54e98e66c6
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_kinematics.rs)" = 88717ed6206cae78599e805de79cf1b3f046443a
          test "$(git hash-object docs/audit/artifacts/d081r1f1/p0ab_adversarial_repair_green_receipt.json)" = 1206d9c9c73b4ab7166939cad6b5c8a038532e7e
          test "$(git hash-object docs/audit/artifacts/d081r1f1/p0ab_clean_final_replay_receipt.json)" = d549e270b20b6c9972e1dcf62a232f019621896e
          test "$(git hash-object scripts/audit/_d080b_tgamma_collision.py)" = 78489c43f3046db09d8ba2d96070124ed7b0aa91
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test ! -e native/rabbit_cpu/src/f10_electron_action/tgamma_jvp.rs
          ! grep -Fq 'pub(crate) mod tgamma_jvp;' native/rabbit_cpu/src/f10_electron_action.rs
          test ! -e docs/audit/artifacts/d081r1f1/p1_collision_tgamma_jvp_red_receipt.json

      - name: Install exact Rust and refreshed offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9932329475/zip > /tmp/vendor.zip
          echo '2fa7b64275f5ec435b8dab3b9876dce79227bb1d12a5da552f67059e6a240640  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          echo '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f  /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz' | sha256sum -c -
          tar -xzf /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz -C /tmp/vendor-expanded
          test "$(find /tmp/vendor-expanded/vendor -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r1"\n[source.d081r1]\ndirectory="/tmp/vendor-expanded/vendor"\n[net]\noffline=true\n' > native/rabbit_cpu/.cargo/config.toml

      - name: Execute expected absent-child-module RED
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          cargo +1.94.1 metadata --locked --offline --format-version 1 >/tmp/p1-red-metadata.json
          set +e
          cargo +1.94.1 test --locked --offline \
            f10_electron_action_tgamma_jvp_red_tests --no-run \
            2>&1 | tee /tmp/p1-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "${status}" -ne 0
          grep -F 'error[E0432]' /tmp/p1-red.log
          grep -F 'f10_electron_action::tgamma_jvp' /tmp/p1-red.log
          mapfile -t error_codes < <(grep -Eo 'error\[E[0-9]+\]' /tmp/p1-red.log | sort -u)
          test "${#error_codes[@]}" -eq 1
          test "${error_codes[0]}" = 'error[E0432]'
          ! grep -Fq 'error[E0282]' /tmp/p1-red.log
          test -z "$(git -C ../.. status --short --untracked-files=no)"

      - name: Publish durable P1 RED receipt only
        shell: bash
        run: |
          set -euo pipefail
          receipt='docs/audit/artifacts/d081r1f1/p1_collision_tgamma_jvp_red_receipt.json'
          mkdir -p "$(dirname "${receipt}")"
          export RECEIPT="${receipt}"
          export TRIGGER_TREE="$(git rev-parse HEAD^{tree})"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def blob(path: str) -> str:
              return subprocess.check_output(['git', 'hash-object', path], text=True).strip()

          payload = {
              'schema': 'rabbit.d081r1f1.p1_collision_tgamma_jvp_red_receipt.v1',
              'classification': 'PASS_EXPECTED_ABSENT_ELECTRON_COLLISION_TGAMMA_JVP_CHILD_MODULE_RED',
              'trigger_head': os.environ['GITHUB_SHA'],
              'trigger_tree': os.environ['TRIGGER_TREE'],
              'exact_base_commit': '8c6fcf68186040313b6fd7407ff027205cfa1df8',
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'prior_invalid_red_workflow_run_id': '33912116263',
              'prior_invalid_red_classification': 'INVALID_RED_WITNESS_DUE_TO_CASCADING_E0282',
              'contract_blob': blob('docs/audit/D081R1F1_P1_ELECTRON_COLLISION_TGAMMA_JVP_CONTRACT_2026-09-05.md'),
              'red_test_blob': blob('native/rabbit_cpu/src/f10_electron_action_tgamma_jvp_red_tests.rs'),
              'module_registry_blob': blob('native/rabbit_cpu/src/lib.rs'),
              'primal_electron_action_blob': blob('native/rabbit_cpu/src/f10_electron_action.rs'),
              'p0a_repaired_source_blob': blob('native/rabbit_cpu/src/f10_tgamma_tangent.rs'),
              'p0b_repaired_source_blob': blob('native/rabbit_cpu/src/f10_tgamma_kinematics.rs'),
              'd080b_source_blob': blob('scripts/audit/_d080b_tgamma_collision.py'),
              'comparator_blob': blob('src/rabbit/decoupling/_independent_noqke.py'),
              'cargo_lock_blob': blob('native/rabbit_cpu/Cargo.lock'),
              'observed_unique_compiler_error_codes': ['E0432'],
              'observed_compiler_error': 'E0432 unresolved import crate::f10_electron_action::tgamma_jvp',
              'production_child_module_present': False,
              'production_source_changed': False,
              'retained_or_holdout_state_accessed': False,
              'runtime': {
                  'rust': '1.94.1',
                  'vendor_artifact_id': 9932329475,
                  'vendor_package_directories': 174,
                  'vendor_tar_sha256': '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f',
              },
              'claim_ceiling': 'expected absent-child-module compiler RED for order-8 fixed-branch electron collision-action T_gamma JVP only; no production collision JVP, packed-RHS thermal column, retained state, solver, trajectory, endpoint, N_eff, performance, publication readiness, merge, or G-F10 movement',
          }
          Path(os.environ['RECEIPT']).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${receipt}"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "${receipt}"
          git commit -m 'test(d081r1f1): publish P1 collision thermal-JVP RED receipt'
          git fetch origin research/d081r1f1-p1-collision-tgamma-jvp-red-20260905-r1
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push origin HEAD:research/d081r1f1-p1-collision-tgamma-jvp-red-20260905-r1
