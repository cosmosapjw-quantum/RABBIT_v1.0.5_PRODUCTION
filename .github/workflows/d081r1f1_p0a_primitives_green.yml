name: d081r1f1-p0a-primitives-green

on:
  push:
    branches:
      - research/d081r1f1-p0a-tgamma-primitives-20260904
    paths:
      - .github/workflows/d081r1f1_p0a_primitives_green.yml
      - native/rabbit_cpu/src/f10_tgamma_tangent.rs
      - native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs
      - native/rabbit_cpu/src/lib.rs
      - scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py

permissions:
  contents: write
  actions: read

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger and RED authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor adf1b6599fd9b239d06ef5ab8cc23e556708b7a1 HEAD
          test "$(git hash-object docs/audit/D081R1F1_RUST_TGAMMA_PACKED_RHS_JVP_CONTRACT_2026-09-04.md)" = 58eeaf38b9f4edd4c60a01d22d2e101a33b71812
          test "$(git hash-object docs/audit/artifacts/d081r1f1/vendor_refresh_receipt.json)" = c023e9d0ae84651cdcc9b458f6ac8a02219a29b0
          test "$(git hash-object docs/audit/artifacts/d081r1f1/p0a_primitives_red_receipt.json)" = 5c5745c840b39a39b06221ec59906a2e50cd136f
          test "$(git hash-object scripts/audit/_d080_tgamma_primitives.py)" = c585d5865fd68a90a04a76ab540b8437fba8cfce
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test -f native/rabbit_cpu/src/f10_tgamma_tangent.rs
          test ! -e docs/audit/artifacts/d081r1f1/p0a_primitives_green_receipt.json

      - name: Generate deterministic Python primitive oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/d081r1f1-p0a-green-venv
          /tmp/d081r1f1-p0a-green-venv/bin/python -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            numpy==2.4.4 scipy==1.17.1
          PY=/tmp/d081r1f1-p0a-green-venv/bin/python
          GEN=scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py
          "$PY" "$GEN" --output /tmp/p0a-green-a.json
          "$PY" "$GEN" --output /tmp/p0a-green-b.json
          cmp /tmp/p0a-green-a.json /tmp/p0a-green-b.json
          echo '3e0941c8649895c0ee3c1c2e98abd949a1d2fafbf0d7dcf1ff39f41825ce0fa7  /tmp/p0a-green-a.json' | sha256sum -c -
          echo '3e0941c8649895c0ee3c1c2e98abd949a1d2fafbf0d7dcf1ff39f41825ce0fa7  /tmp/p0a-green-b.json' | sha256sum -c -

      - name: Install exact Rust and refreshed offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9932329475/zip > /tmp/vendor.zip
          echo '2fa7b64275f5ec435b8dab3b9876dce79227bb1d12a5da552f67059e6a240640  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          echo '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f  /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz' | sha256sum -c -
          tar -xzf /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz -C /tmp/vendor-expanded
          test "$(find /tmp/vendor-expanded/vendor -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r1"\n[source.d081r1]\ndirectory="/tmp/vendor-expanded/vendor"\n[net]\noffline=true\n' > native/rabbit_cpu/.cargo/config.toml

      - name: Format, execute P0A GREEN, and run inherited regressions
        shell: bash
        working-directory: native/rabbit_cpu
        env:
          D081R1F1_P0A_ORACLE: /tmp/p0a-green-a.json
        run: |
          set -euo pipefail
          source_path='native/rabbit_cpu/src/f10_tgamma_tangent.rs'
          test_path='native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs'
          cargo +1.94.1 fmt --all
          mapfile -t format_changed < <(git -C ../.. diff --name-only)
          printf 'format_changed=%s\n' "${format_changed[*]-}"
          test "${#format_changed[@]}" -le 2
          for path in "${format_changed[@]}"; do
            case "${path}" in
              "${source_path}"|"${test_path}") ;;
              *) echo "unexpected rustfmt path: ${path}" >&2; exit 1 ;;
            esac
          done
          cargo +1.94.1 metadata --locked --offline --format-version 1 > /tmp/p0a-green-metadata.json
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --offline f10_tgamma_tangent_tests -- --nocapture 2>&1 | tee /tmp/p0a-green-test.log
          grep -F 'test result: ok. 3 passed; 0 failed' /tmp/p0a-green-test.log
          cargo +1.94.1 test --locked --offline f10_packed_rhs_jvp_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_packed_rhs_preflight_tests::tests -- --nocapture
          cargo +1.94.1 clippy --all-targets --all-features --locked --offline -- -D warnings

      - name: Publish formatted source and durable P0A GREEN receipt
        shell: bash
        run: |
          set -euo pipefail
          source_path='native/rabbit_cpu/src/f10_tgamma_tangent.rs'
          test_path='native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs'
          receipt='docs/audit/artifacts/d081r1f1/p0a_primitives_green_receipt.json'
          mkdir -p "$(dirname "${receipt}")"
          git add "${source_path}" "${test_path}"
          tested_tree="$(git write-tree)"
          export TESTED_TREE="${tested_tree}"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          def blob(path: str) -> str:
              return subprocess.check_output(['git', 'hash-object', path], text=True).strip()

          fixture = Path('/tmp/p0a-green-a.json')
          payload = {
              'schema': 'rabbit.d081r1f1.p0a_primitives_green_receipt.v1',
              'classification': 'PASS_WITH_MOVING_HALF_LINE_AND_QED_OFF_EOS_TGAMMA_PRIMITIVES_SCOPE',
              'trigger_head': os.environ['GITHUB_SHA'],
              'tested_source_tree': os.environ['TESTED_TREE'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'source_blob': blob('native/rabbit_cpu/src/f10_tgamma_tangent.rs'),
              'test_blob': blob('native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs'),
              'oracle_generator_blob': blob('scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py'),
              'oracle_sha256': hashlib.sha256(fixture.read_bytes()).hexdigest(),
              'vendor_artifact_id': 9932329475,
              'vendor_archive_sha256': '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f',
              'rust_version': '1.94.1',
              'numpy_version': '2.4.4',
              'scipy_version': '1.17.1',
              'focused_tests': {'passed': 3, 'failed': 0},
              'release_check': 'PASS',
              'strict_clippy': 'PASS',
              'inherited_zero_jvp_regression': 'PASS',
              'inherited_packed_rhs_preflight': 'PASS',
              'claim_ceiling': 'moving electron half-line quadrature and QED-off electromagnetic EOS T_gamma tangents only; no finite-mass collision kinematic tangent, collision JVP, packed-RHS T_gamma column, retained state, solver, trajectory, or G-F10 movement',
          }
          Path('docs/audit/artifacts/d081r1f1/p0a_primitives_green_receipt.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git add "${receipt}"
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -ge 1
          test "${#staged[@]}" -le 3
          for path in "${staged[@]}"; do
            case "${path}" in
              "${source_path}"|"${test_path}"|"${receipt}") ;;
              *) echo "unexpected staged path: ${path}" >&2; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(d081r1f1): publish P0A thermal-primitives GREEN receipt'
          git fetch origin research/d081r1f1-p0a-tgamma-primitives-20260904
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push origin HEAD:research/d081r1f1-p0a-tgamma-primitives-20260904
