name: d081r0-rust-source-export

on:
  push:
    branches:
      - research/d081r0-rust-offline-semantic-admission-20260902
    paths:
      - .github/workflows/d081r0_source_export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify frozen D-080F predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 901a62350b19cf43c17dffe45e96e8b94e4c7ca1)" = \
            "901a62350b19cf43c17dffe45e96e8b94e4c7ca1"
          test "$(git rev-parse HEAD:native/rabbit_cpu/Cargo.toml)" = "30bc4826c7a7676b5fb5c8610273eb7586551ad8"
          test "$(git rev-parse HEAD:native/rabbit_cpu/Cargo.lock)" = "a1b5035da5c20712d1a2a4ab077da255ff94a014"
          test "$(git rev-parse HEAD:native/rabbit_cpu/rust-toolchain.toml)" = "b1dd491cdce6f8b98cfe02f6807980c0dfe48784"

      - name: Produce exact source and oracle bundle
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/d081r0-source
          rm -rf "$root"
          mkdir -p "$root/repo"
          cp -a native/rabbit_cpu "$root/repo/native-rabbit_cpu"
          mkdir -p "$root/repo/python-oracle"
          cp scripts/audit/_d079_rhs_jvp.py "$root/repo/python-oracle/"
          cp scripts/audit/_d080c_tgamma_rhs.py "$root/repo/python-oracle/"
          cp scripts/audit/_d080e_prepared_jvp.py "$root/repo/python-oracle/"
          cp scripts/audit/_d080e_prepared_jvp_core.py "$root/repo/python-oracle/"
          cp scripts/audit/_d080f_action_metric.py "$root/repo/python-oracle/"
          cp docs/audit/artifacts/d080f/research_receipt.json "$root/repo/python-oracle/"
          cp docs/audit/artifacts/d080f/retained_order60_base_rhs.npy "$root/repo/python-oracle/"
          cp docs/audit/artifacts/d080f/retained_order60_probe_directions.npy "$root/repo/python-oracle/"
          cp docs/audit/artifacts/d080f/retained_order60_static_jacobian.npy "$root/repo/python-oracle/"
          git rev-parse HEAD > "$root/EXPORT_HEAD"
          git rev-parse HEAD^{tree} > "$root/EXPORT_TREE"
          (
            cd "$root"
            find EXPORT_HEAD EXPORT_TREE repo -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$root/d081r0-rust-source-and-oracle.tar.gz" -C "$root" \
            EXPORT_HEAD EXPORT_TREE SHA256SUMS repo
          test -s "$root/d081r0-rust-source-and-oracle.tar.gz"
          sha256sum "$root/d081r0-rust-source-and-oracle.tar.gz"

      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d081r0-rust-source-and-oracle
          path: /tmp/d081r0-source/d081r0-rust-source-and-oracle.tar.gz
          if-no-files-found: error
          retention-days: 2
