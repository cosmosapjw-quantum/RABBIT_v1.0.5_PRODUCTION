name: fix-d081r1c-rustfmt

on:
  push:
    branches:
      - research/d081r1c-kernel-primitives-20260902

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1c-kernel-primitives-20260902
          fetch-depth: 1

      - name: Apply the exact rustfmt diff reported by the admission run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/rabbit_cpu/src/f10_kernel_primitives.rs")
          text = path.read_text(encoding="utf-8")
          old = (
              "\n\n"
              "for species in F10Species::ALL {\n"
              "    let partner = species.cp_partner();\n"
              "    assert_ne!(partner, species);\n"
              "    assert_eq!(partner.cp_partner(), species);\n"
              "    assert_eq!(F10Species::from_name(species.name()).unwrap(), species);\n"
              "}\n"
          )
          new = (
              "\n"
              "        for species in F10Species::ALL {\n"
              "            let partner = species.cp_partner();\n"
              "            assert_ne!(partner, species);\n"
              "            assert_eq!(partner.cp_partner(), species);\n"
              "            assert_eq!(F10Species::from_name(species.name()).unwrap(), species);\n"
              "        }\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one unformatted block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          rm .github/workflows/fix_d081r1c_rustfmt.yml
          git diff --check

      - name: Commit the formatting-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(d081r1c): apply exact rustfmt indentation"
          git push origin HEAD:research/d081r1c-kernel-primitives-20260902
