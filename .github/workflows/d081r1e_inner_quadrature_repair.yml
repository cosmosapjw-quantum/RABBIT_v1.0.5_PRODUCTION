name: d081r1e-inner-quadrature-repair

on:
  push:
    branches:
      - research/d081r1e-retained-packed-rhs-20260903
    paths:
      - .github/workflows/d081r1e_inner_quadrature_repair.yml
      - .github/scripts/d081r1e_apply_inner_quadrature.py
      - native/rabbit_cpu/tests/fixtures/d081r1/generate_f10_inner_quadrature_case.py

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1e-retained-packed-rhs-20260903
          fetch-depth: 0

      - name: Verify predecessor and frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b0ce566f942ced1b13f73b2da26e83b3ac3b64fa HEAD
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object scripts/audit/_trajectory_core.py)" = 465a73f0ce40f7149bebdc2d67103f388e2344d9
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          echo "14062bd9efed6b3385b89d3342d5611641e4fa5e7b96746aadc75ceb44a73e92  native/rabbit_cpu/tests/fixtures/d081r1/retained_packed_rhs_case.json" | sha256sum -c -

      - name: Install exact Python and Rust tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/d081r1e-inner-venv
          /tmp/d081r1e-inner-venv/bin/python -m pip install \
            --disable-pip-version-check --only-binary=:all: numpy==2.4.4
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"

      - name: Recover exact offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9838506413/zip > /tmp/vendor.zip
          echo "391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a  /tmp/vendor.zip" | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          vendor_dir="$(find /tmp/vendor-outer -type d -name vendor -print -quit)"
          if [[ -z "${vendor_dir}" ]]; then
            archive="$(find /tmp/vendor-outer -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' -o -name '*.zip' \) -print -quit)"
            case "${archive}" in
              *.tar.gz|*.tgz) tar -xzf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar.xz) tar -xJf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar) tar -xf "${archive}" -C /tmp/vendor-expanded ;;
              *.zip) unzip -q "${archive}" -d /tmp/vendor-expanded ;;
              *) echo "no supported vendor archive" >&2; exit 1 ;;
            esac
            vendor_dir="$(find /tmp/vendor-expanded -type d -name vendor -print -quit)"
          fi
          test -n "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r0"\n[source.d081r0]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml

      - name: Generate exact NumPy inner-rule fixture twice
        shell: bash
        run: |
          set -euo pipefail
          PY=/tmp/d081r1e-inner-venv/bin/python
          GEN=native/rabbit_cpu/tests/fixtures/d081r1/generate_f10_inner_quadrature_case.py
          OUT=native/rabbit_cpu/tests/fixtures/d081r1/f10_inner_quadrature_case.json
          "$PY" "$GEN" --output /tmp/inner-a.json
          "$PY" "$GEN" --output /tmp/inner-b.json
          cmp /tmp/inner-a.json /tmp/inner-b.json
          cp /tmp/inner-a.json "$OUT"
          sha256sum /tmp/inner-a.json /tmp/inner-b.json "$OUT"

      - name: Add and verify the substantive RED test
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/d081r1e_apply_inner_quadrature.py --phase red
          cd native/rabbit_cpu
          cargo +1.94.1 fmt --all
          set +e
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_preflight_tests::tests::f10_inner_gl12_gl48_rules_match_frozen_numpy_binary64_operator \
            -- --nocapture > /tmp/d081r1e-inner-red.log 2>&1
          status=$?
          set -e
          cat /tmp/d081r1e-inner-red.log
          if [[ "$status" -eq 0 ]]; then
            echo ALREADY_EXACT > /tmp/d081r1e-inner-decision
            echo 'F10 inner quadrature was already bitwise identical.'
          else
            grep -q 'f10_inner_gl12_gl48_rules_match_frozen_numpy_binary64_operator' /tmp/d081r1e-inner-red.log
            grep -q 'FAILED' /tmp/d081r1e-inner-red.log
            echo PATCH_REQUIRED > /tmp/d081r1e-inner-decision
            echo 'D-081R1E F10 inner-quadrature RED witness: PASS'
          fi

      - name: Apply the minimal GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          decision="$(cat /tmp/d081r1e-inner-decision)"
          python3 .github/scripts/d081r1e_apply_inner_quadrature.py \
            --phase green --inner-decision "$decision"
          cd native/rabbit_cpu
          cargo +1.94.1 fmt --all

      - name: Verify the isolated repair before commit
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          cargo +1.94.1 metadata --locked --offline --format-version 1 >/tmp/d081r1e-inner-metadata.json
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_preflight_tests::tests -- --nocapture
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_tests::tests::collision_chart_hubble_and_thermodynamic_mutations_are_killed \
            -- --nocapture
          cargo +1.94.1 clippy --all-targets --all-features \
            --locked --offline -- -D warnings

      - name: Commit the verified finite-dimensional identity repair
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed=%s\n' "${changed[*]-}"
          allowed='^(native/rabbit_cpu/src/f10_action_kinematics.rs|native/rabbit_cpu/src/f10_packed_rhs_preflight_tests.rs|native/rabbit_cpu/src/f10_packed_rhs_tests.rs|native/rabbit_cpu/tests/fixtures/d081r1/f10_inner_quadrature_case.json)$'
          test "${#changed[@]}" -ge 3
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]]
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            native/rabbit_cpu/src/f10_action_kinematics.rs \
            native/rabbit_cpu/src/f10_packed_rhs_preflight_tests.rs \
            native/rabbit_cpu/src/f10_packed_rhs_tests.rs \
            native/rabbit_cpu/tests/fixtures/d081r1/f10_inner_quadrature_case.json
          git diff --cached --check
          git commit -m 'fix(d081r1e): preserve exact F10 inner quadrature identity'
          git fetch origin research/d081r1e-retained-packed-rhs-20260903
          test "$(git rev-parse origin/research/d081r1e-retained-packed-rhs-20260903)" = "$GITHUB_SHA"
          git push origin HEAD:research/d081r1e-retained-packed-rhs-20260903
