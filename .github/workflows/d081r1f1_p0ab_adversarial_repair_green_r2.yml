name: d081r1f1-p0ab-adversarial-repair-green-r2

on:
  push:
    branches:
      - research/d081r1f1-p0ab-adversarial-audit-repair-20260904-r1
    paths:
      - .github/workflows/d081r1f1_p0ab_adversarial_repair_green_r2.yml
      - scripts/audit/d081r1f1_apply_p0ab_adversarial_repair.py
      - scripts/audit/d081r1f1_apply_p0ab_margin_test_amendment.py
      - scripts/audit/d081r1f1_p0b_tgamma_kinematics_oracle.py
      - docs/audit/D081R1F1_P0AB_MARGIN_TEST_AMENDMENT_2026-09-04.md

permissions:
  contents: write
  actions: read

jobs:
  green-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger, RED receipt, amendment, and authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 5af9b1af30dec0a4dddcd24080aa9804d4f99636 HEAD
          test -f docs/audit/D081R1F1_P0AB_MARGIN_TEST_AMENDMENT_2026-09-04.md
          test -f scripts/audit/d081r1f1_apply_p0ab_margin_test_amendment.py
          test "$(git hash-object docs/audit/D081R1F1_P0AB_ADVERSARIAL_REPAIR_CONTRACT_2026-09-04.md)" = 876ad9a7cc2d8edacc37d4f6abbadcbc91410d13
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_adversarial_repair_tests.rs)" = 3a979bcf63ebd204c9cef55b9c7838b8a4c561bf
          test "$(git hash-object docs/audit/D081R1F1_RUST_TGAMMA_PACKED_RHS_JVP_CONTRACT_2026-09-04.md)" = 58eeaf38b9f4edd4c60a01d22d2e101a33b71812
          test "$(git hash-object scripts/audit/_d080_tgamma_primitives.py)" = c585d5865fd68a90a04a76ab540b8437fba8cfce
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test ! -e docs/audit/artifacts/d081r1f1/p0ab_adversarial_repair_green_receipt.json

      - name: Generate deterministic P0A and P0B Python oracles
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/d081r1f1-p0ab-r2-venv
          /tmp/d081r1f1-p0ab-r2-venv/bin/python -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            numpy==2.4.4 scipy==1.17.1
          PY=/tmp/d081r1f1-p0ab-r2-venv/bin/python
          "$PY" scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py --output /tmp/p0a-a.json
          "$PY" scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py --output /tmp/p0a-b.json
          cmp /tmp/p0a-a.json /tmp/p0a-b.json
          echo '3e0941c8649895c0ee3c1c2e98abd949a1d2fafbf0d7dcf1ff39f41825ce0fa7  /tmp/p0a-a.json' | sha256sum -c -
          "$PY" scripts/audit/d081r1f1_p0b_tgamma_kinematics_oracle.py --output /tmp/p0b-a.json
          "$PY" scripts/audit/d081r1f1_p0b_tgamma_kinematics_oracle.py --output /tmp/p0b-b.json
          cmp /tmp/p0b-a.json /tmp/p0b-b.json
          sha256sum /tmp/p0b-a.json /tmp/p0b-b.json

      - name: Install exact Rust and refreshed offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9932329475/zip > /tmp/vendor.zip
          echo '2fa7b64275f5ec435b8dab3b9876dce79227bb1d12a5da552f67059e6a240640  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          echo '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f  /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz' | sha256sum -c -
          tar -xzf /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz -C /tmp/vendor-expanded
          test "$(find /tmp/vendor-expanded/vendor -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r1"\n[source.d081r1]\ndirectory="/tmp/vendor-expanded/vendor"\n[net]\noffline=true\n' > native/rabbit_cpu/.cargo/config.toml

      - name: Apply bounded production and test-oracle repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit/d081r1f1_apply_p0ab_adversarial_repair.py
          python3 scripts/audit/d081r1f1_apply_p0ab_margin_test_amendment.py
          cd native/rabbit_cpu
          cargo +1.94.1 fmt --all
          cd ../..
          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]-}"
          test "${#changed[@]}" -eq 3
          for path in "${changed[@]}"; do
            case "${path}" in
              native/rabbit_cpu/src/f10_tgamma_tangent.rs|\
              native/rabbit_cpu/src/f10_tgamma_kinematics.rs|\
              native/rabbit_cpu/src/f10_tgamma_adversarial_repair_tests.rs) ;;
              *) echo "unexpected repair path: ${path}" >&2; exit 1 ;;
            esac
          done

      - name: Execute repaired P0A/P0B gates and inherited regressions
        shell: bash
        working-directory: native/rabbit_cpu
        env:
          D081R1F1_P0A_ORACLE: /tmp/p0a-a.json
          D081R1F1_P0B_ORACLE: /tmp/p0b-a.json
        run: |
          set -euo pipefail
          cargo +1.94.1 metadata --locked --offline --format-version 1 >/tmp/p0ab-r2-metadata.json
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --offline f10_tgamma_adversarial_repair_tests -- --nocapture 2>&1 | tee /tmp/p0ab-r2-tests.log
          grep -F 'test result: ok. 2 passed; 0 failed; 1 ignored' /tmp/p0ab-r2-tests.log
          cargo +1.94.1 test --locked --offline \
            f10_tgamma_adversarial_repair_tests::direct_python_d080a_basis_and_kinematic_arrays_match \
            -- --ignored --exact --nocapture
          cargo +1.94.1 test --locked --offline f10_tgamma_tangent_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_tgamma_kinematic_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_packed_rhs_jvp_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_packed_rhs_preflight_tests::tests -- --nocapture
          cargo +1.94.1 clippy --all-targets --all-features --locked --offline -- -D warnings

      - name: Publish verified source and durable GREEN receipt
        shell: bash
        run: |
          set -euo pipefail
          source_a='native/rabbit_cpu/src/f10_tgamma_tangent.rs'
          source_b='native/rabbit_cpu/src/f10_tgamma_kinematics.rs'
          test_path='native/rabbit_cpu/src/f10_tgamma_adversarial_repair_tests.rs'
          receipt='docs/audit/artifacts/d081r1f1/p0ab_adversarial_repair_green_receipt.json'
          git add "${source_a}" "${source_b}" "${test_path}"
          tested_tree="$(git write-tree)"
          export TESTED_TREE="${tested_tree}"
          export RECEIPT="${receipt}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def blob(path: str) -> str:
              return subprocess.check_output(['git', 'hash-object', path], text=True).strip()

          payload = {
              'schema': 'rabbit.d081r1f1.p0ab_adversarial_repair_green_receipt.v2',
              'classification': 'PASS_WITH_EXACT_DISCRETE_EOS_AND_DIRECT_P0B_ORACLE_INVARIANT_SCOPE',
              'trigger_head': os.environ['GITHUB_SHA'],
              'tested_source_tree': os.environ['TESTED_TREE'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'base_integration_commit': '9929596e1cf0351aba6e8e2b501ced89d1c80fb1',
              'red_receipt_commit': '5af9b1af30dec0a4dddcd24080aa9804d4f99636',
              'first_failed_green_run_id': '33879599975',
              'margin_test_amendment': 'TEST_ORACLE_OPERATION_GRAPH_CORRECTION_NO_THRESHOLD_CHANGE',
              'contract_blob': blob('docs/audit/D081R1F1_P0AB_ADVERSARIAL_REPAIR_CONTRACT_2026-09-04.md'),
              'amendment_blob': blob('docs/audit/D081R1F1_P0AB_MARGIN_TEST_AMENDMENT_2026-09-04.md'),
              'repair_test_blob': blob('native/rabbit_cpu/src/f10_tgamma_adversarial_repair_tests.rs'),
              'tgamma_source_blob': blob('native/rabbit_cpu/src/f10_tgamma_tangent.rs'),
              'kinematic_source_blob': blob('native/rabbit_cpu/src/f10_tgamma_kinematics.rs'),
              'repair_driver_blob': blob('scripts/audit/d081r1f1_apply_p0ab_adversarial_repair.py'),
              'margin_amendment_driver_blob': blob('scripts/audit/d081r1f1_apply_p0ab_margin_test_amendment.py'),
              'p0b_oracle_generator_blob': blob('scripts/audit/d081r1f1_p0b_tgamma_kinematics_oracle.py'),
              'p0a_oracle_sha256': hashlib.sha256(Path('/tmp/p0a-a.json').read_bytes()).hexdigest(),
              'p0b_oracle_sha256': hashlib.sha256(Path('/tmp/p0b-a.json').read_bytes()).hexdigest(),
              'runtime': {
                  'rust': '1.94.1', 'python': '3.12.3',
                  'numpy': '2.4.4', 'scipy': '1.17.1',
                  'vendor_artifact_id': 9932329475,
                  'vendor_tar_sha256': '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f',
                  'vendor_package_directories': 174,
              },
              'gates': {
                  'exact_discrete_eos_derivative': 'PASS',
                  'continuum_reference_preserved': 'PASS',
                  'direct_python_d080a_p0b_parity': 'PASS',
                  'normalized_branch_margins': 'PASS',
                  'energy_and_mass_shell_tangent_invariants': 'PASS',
                  'minkowski_dot_tangent_invariants': 'PASS',
                  'p0a_focused_regression': 'PASS',
                  'p0b_focused_regression': 'PASS',
                  'r1f0_zero_jvp_regression': 'PASS',
                  'packed_rhs_preflight': 'PASS',
                  'release_check': 'PASS',
                  'strict_clippy': 'PASS',
              },
              'retained_or_holdout_state_accessed': False,
              'claim_ceiling': 'corrected P0A/P0B primitive semantics and direct-oracle/invariant validation only; no collision-action or packed-RHS T_gamma JVP, retained state, solver, trajectory, endpoint, N_eff, performance, publication readiness, merge, or G-F10 movement',
          }
          Path(os.environ['RECEIPT']).parent.mkdir(parents=True, exist_ok=True)
          Path(os.environ['RECEIPT']).write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git add "${receipt}"
          git diff --cached --check
          rm -rf native/rabbit_cpu/.cargo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(d081r1f1): publish adversarial P0A/P0B repair GREEN receipt'
          git fetch origin research/d081r1f1-p0ab-adversarial-audit-repair-20260904-r1
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push origin HEAD:research/d081r1f1-p0ab-adversarial-audit-repair-20260904-r1
