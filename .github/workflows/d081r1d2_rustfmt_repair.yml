name: d081r1d2-rustfmt-repair

on:
  push:
    branches:
      - research/d081r1d2-self-action-20260903

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d2-self-action-20260903
          fetch-depth: 2

      - name: Install exact formatter
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt

      - name: Apply only the canonical Rust formatting repair
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          cargo +1.94.1 fmt --all
          cd ../..
          rm .github/workflows/d081r1d2_rustfmt_repair.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/d081r1d2_rustfmt_repair.yml\nnative/rabbit_cpu/src/f10_self_action.rs'

      - name: Commit the bounded layout-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(d081r1d2): apply canonical Rust formatting"
          git push origin HEAD:research/d081r1d2-self-action-20260903
