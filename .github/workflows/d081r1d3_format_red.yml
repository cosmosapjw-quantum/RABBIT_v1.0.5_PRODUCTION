name: d081r1d3-format-red

on:
  push:
    branches:
      - research/d081r1d3-electron-action-20260903
    paths:
      - .github/workflows/d081r1d3_format_red.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d3-electron-action-20260903
          fetch-depth: 2

      - name: Apply exact Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          (cd native/rabbit_cpu && cargo +1.94.1 fmt --all)
          git diff --check
          changed="$(git diff --name-only | sort)"
          allowed=$'native/rabbit_cpu/src/f10_electron_action_tests.rs'
          test "${changed}" = "${allowed}"

      - name: Commit formatting-only RED repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/rabbit_cpu/src/f10_electron_action_tests.rs
          git diff --cached --check
          git commit -m "style(d081r1d3): format RED electron-action tests"
          git push origin HEAD:research/d081r1d3-electron-action-20260903
