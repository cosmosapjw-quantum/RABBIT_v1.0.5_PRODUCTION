name: d081r1d4-combined-action

on:
  push:
    branches:
      - research/d081r1d4-combined-action-20260903

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d4-combined-action-20260903
          fetch-depth: 0

      - name: Verify frozen authorities and predecessor
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a604cc7af832c799687d29ba05765972f7ba0c9d HEAD
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/tests/fixtures/d081r1/full_collision_action_case.json)" = c94d2e72a1f8300b7c20c9c793417a5c4a5fa302
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014

      - name: Apply the bounded definition repair when needed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("native/rabbit_cpu/src/f10_combined_action.rs")
          source = source_path.read_text(encoding="utf-8")
          old_signature = "    let scale = native_total\n"
          new_signature = "fn relative_max_difference(\n"
          if old_signature in source:
              start = source.index("fn symmetry_residuals(\n")
              end = source.index("\npub(crate) fn assemble_combined_action(\n", start)
              replacement = '''fn relative_max_difference(
                  left: &[f64],
                  right: &[f64],
              ) -> Result<f64, F10CombinedActionError> {
                  if left.is_empty() || left.len() != right.len() {
                      return Err(F10CombinedActionError::InvalidInput);
                  }
                  let left_scale = left
                      .iter()
                      .map(|value| value.abs())
                      .fold(f64::MIN_POSITIVE, f64::max);
                  let right_scale = right
                      .iter()
                      .map(|value| value.abs())
                      .fold(f64::MIN_POSITIVE, f64::max);
                  let difference = left
                      .iter()
                      .zip(right)
                      .map(|(left_value, right_value)| (left_value - right_value).abs())
                      .fold(0.0_f64, f64::max);
                  let residual = difference / left_scale.max(right_scale).max(f64::MIN_POSITIVE);
                  if residual.is_finite() {
                      Ok(residual)
                  } else {
                      Err(F10CombinedActionError::NonFiniteOutput)
                  }
              }

              fn symmetry_residuals(
                  native_total: &[f64],
                  order: usize,
              ) -> Result<(f64, f64), F10CombinedActionError> {
                  if order == 0 || native_total.len() != SPECIES_COUNT * order {
                      return Err(F10CombinedActionError::InvalidInput);
                  }

                  let mut charge_conjugation = 0.0_f64;
                  for pair in 0..PAIR_COUNT {
                      let particle_start = (2 * pair) * order;
                      let antiparticle_start = particle_start + order;
                      charge_conjugation = charge_conjugation.max(relative_max_difference(
                          &native_total[particle_start..particle_start + order],
                          &native_total[antiparticle_start..antiparticle_start + order],
                      )?);
                  }

                  let mut mu_pair = Vec::with_capacity(order);
                  let mut tau_pair = Vec::with_capacity(order);
                  for node in 0..order {
                      mu_pair.push(
                          0.5 * (native_total[2 * order + node] + native_total[3 * order + node]),
                      );
                      tau_pair.push(
                          0.5 * (native_total[4 * order + node] + native_total[5 * order + node]),
                      );
                  }
                  let mu_tau = relative_max_difference(&mu_pair, &tau_pair)?;
                  Ok((charge_conjugation, mu_tau))
              }
'''
              source_path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")
          elif new_signature not in source:
              raise SystemExit("neither old nor repaired symmetry definition is present")

          test_path = Path("native/rabbit_cpu/src/f10_combined_action_tests.rs")
          tests = test_path.read_text(encoding="utf-8")
          old_start = '        let expected_total = bit_array(&thermal_case["arrays"]["total_native"]);\n'
          new_signature = "        let self_scale = maximum_absolute(&thermal.self_action.native);\n"
          if old_start in tests:
              start = tests.index(old_start)
              end_marker = "    }\n\n    #[test]\n    fn component_failures_propagate_without_a_partial_result()"
              end = tests.index(end_marker, start)
              replacement = '''        let self_scale = maximum_absolute(&thermal.self_action.native);
                  let electron_scale = maximum_absolute(&thermal.electron_action.native);
                  assert!(
                      scaled_difference(
                          &thermal.self_action.native,
                          &thermal.native_total,
                          electron_scale,
                      ) > 0.5
                  );
                  assert!(
                      scaled_difference(
                          &thermal.electron_action.native,
                          &thermal.native_total,
                          self_scale,
                      ) > 0.5
                  );
                  let wrong_sign: Vec<_> = thermal
                      .self_action
                      .native
                      .iter()
                      .zip(&thermal.electron_action.native)
                      .map(|(self_value, electron_value)| self_value - electron_value)
                      .collect();
                  assert!(
                      scaled_difference(
                          &wrong_sign,
                          &thermal.native_total,
                          self_scale.max(electron_scale),
                      ) > 0.5
                  );
'''
              test_path.write_text(tests[:start] + replacement + tests[end:], encoding="utf-8")
          elif new_signature not in tests:
              raise SystemExit("neither old nor repaired component mutation definition is present")
          PY

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy

      - name: Recover exact offline vendor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9838506413/zip > /tmp/vendor.zip
          echo "391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a  /tmp/vendor.zip" | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          vendor_dir="$(find /tmp/vendor-outer -type d -name vendor -print -quit)"
          if [[ -z "${vendor_dir}" ]]; then
            archive="$(find /tmp/vendor-outer -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' -o -name '*.zip' \) -print -quit)"
            case "${archive}" in
              *.tar.gz|*.tgz) tar -xzf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar.xz) tar -xJf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar) tar -xf "${archive}" -C /tmp/vendor-expanded ;;
              *.zip) unzip -q "${archive}" -d /tmp/vendor-expanded ;;
            esac
            vendor_dir="$(find /tmp/vendor-expanded -type d -name vendor -print -quit)"
          fi
          test -n "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r0"\n[source.d081r0]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml

      - name: Run exact offline combined-action admission
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          cargo +1.94.1 metadata --locked --offline --format-version 1 >/tmp/metadata.json
          cargo +1.94.1 fmt --all
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --offline f10_combined_action_tests::tests -- --nocapture | tee /tmp/d081r1d4-tests.log
          grep -Eq '4 passed; 0 failed' /tmp/d081r1d4-tests.log
          cargo +1.94.1 clippy --all-targets --all-features --locked --offline -- -D warnings

      - name: Commit bounded definition repair when present
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only -- native/rabbit_cpu/src/f10_combined_action.rs native/rabbit_cpu/src/f10_combined_action_tests.rs | sort)"
          if [[ -z "${changed}" ]]; then
            exit 0
          fi
          expected="$(printf '%s\n' native/rabbit_cpu/src/f10_combined_action.rs native/rabbit_cpu/src/f10_combined_action_tests.rs)"
          test "${changed}" = "${expected}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/rabbit_cpu/src/f10_combined_action.rs native/rabbit_cpu/src/f10_combined_action_tests.rs
          git diff --cached --check
          git commit -m "fix(d081r1d4): match frozen symmetry and component metrics"
          git push origin HEAD:research/d081r1d4-combined-action-20260903
