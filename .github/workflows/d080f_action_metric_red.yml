name: d080f-action-metric

on:
  push:
    branches:
      - research/d080f-retained-full-jacobian-build-20260902
    paths:
      - .github/workflows/d080f_action_metric_red.yml
      - scripts/audit/_d080f_action_metric.py
      - tests/test_d080f_action_metric.py

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install focused test dependencies
        run: python3 -m pip install --disable-pip-version-check numpy==2.5.2 pytest==9.1.1
      - name: Run cancellation-aware metric specification
        env:
          PYTHONPATH: src:.
        run: python3 -m pytest -q tests/test_d080f_action_metric.py
