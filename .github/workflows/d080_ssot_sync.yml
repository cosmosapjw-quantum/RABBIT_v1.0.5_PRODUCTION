name: d080-ssot-sync

on:
  push:
    branches:
      - research/d080-tgamma-kinematic-tangent-20260902
    paths:
      - .github/workflows/d080_ssot_sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d080-tgamma-kinematic-tangent-20260902
          fetch-depth: 0

      - name: Install harness dependency
        run: python3 -m pip install --disable-pip-version-check "pytest>=7.0"

      - name: Insert D-080 records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          frozen_path = Path(".agent-harness/context/FROZEN_DECISIONS.md")
          frozen = frozen_path.read_text(encoding="utf-8")
          if "| D-080 |" in frozen:
              raise SystemExit("D-080 already exists in FROZEN_DECISIONS.md")
          anchor = "| D-079 | **Validate the frozen private comparator spectral complementary-log-log event-JVP and complete static-RHS JVP as a pre-output derivative block, while retaining `G-F10-INDEPENDENT-FLRW` at FAIL.**"
          index = frozen.find(anchor)
          if index < 0:
              raise SystemExit("D-079 frozen-decision anchor not found")
          line_end = frozen.find("\n", index)
          if line_end < 0:
              line_end = len(frozen)
          row = """| D-080 | **Admit only the D-080A smooth fixed-support `T_gamma` moving-quadrature, elastic-kinematics, mapped-basis, and QED-off electromagnetic-EOS tangent as a partial static derivative result; retain D-079 and keep `G-F10-INDEPENDENT-FLRW` at FAIL.** The trajectory state is `(c_e,c_mu,c_tau,T_gamma,elapsed_time)` while `T_cm=T_start exp(-N)` is explicit in the independent variable, so this node opens one physical `T_gamma` state column and records the elapsed-time input column as structurally zero; it does not invent a `T_cm` state column. | `docs/audit/BD624_D080A_TGAMMA_KINEMATIC_TANGENT_2026-09-02.md`; final deterministic receipt `docs/audit/artifacts/d080a/research_receipt.json`; workflow run `33531260148`; comparator blob `de44feee0aa484abe26976c7dc34c579643005b5`; four focused tests; Wolfram symbolic residual receipt; moving-kinematics and EOS best residuals `3.682855771233863e-11` and `1.5358912625172127e-09`; unchanged support over the declared epsilon ladder; support/Kallen margins positive; three load-bearing moving-measure/energy mutations killed. | Static research primitives, one elastic fixed-support configuration, deterministic plots/receipts, and method admission only. No collision-action `T_gamma` column, full RHS column, square Jacobian, BDF/JFNK integration, trajectory, endpoint, performance, gate movement, public runtime, QKE, inference, or publication authority. No production or private-comparator source is modified. | D-080B must assemble the complete static `T_gamma` collision-action column on prospectively pinned equilibrium, thermal-split, and retained-stiff fixtures, including moving kinematics, matrix elements, blocking, interpolation, multiplicities and exchange ledgers. It must pass same-support ladders, first-law closure and the full mutation set before any full-RHS or solver node opens. A support-mask change is a non-differentiable state, not a tolerance-adjustment opportunity. |"""
          frozen_path.write_text(
              frozen[: line_end + 1] + row + "\n" + frozen[line_end + 1 :],
              encoding="utf-8",
          )

          log_path = Path("docs/harness/DECISION_LOG.md")
          lines = log_path.read_text(encoding="utf-8").splitlines()
          if any("Record D-080:" in line for line in lines):
              raise SystemExit("D-080 already exists in DECISION_LOG.md")
          separator = next(i for i, line in enumerate(lines) if line.startswith("|---"))
          log_row = """| 2026-09-02 | Record D-080: admit only the smooth fixed-support `T_gamma` moving-quadrature, elastic-kinematics, mapped-basis and QED-off electromagnetic-EOS tangent as a partial static derivative result; keep the independent-FLRW gate at FAIL. | The actual state layout contains `T_gamma` and elapsed time but not `T_cm`; the comparator's electron half-line rule moves its nodes and weights with `T_gamma`, so frozen kinematics would differentiate the wrong numerical operator. Exact object pins, RED-first tests, Wolfram residuals, second-order finite-difference ladders, positive support margins and mutation kills support the narrow result. | Rejected: a frozen-event `T_gamma` derivative; inventing a `T_cm` state column; interpreting one elastic state as all-event or all-regime authority; widening tolerances across a support change; assembling a solver Jacobian or running BDF before the collision and full-RHS columns pass multi-state admission. | D-080 remains incomplete. D-080B must assemble and certify the complete static `T_gamma` collision-action column with equilibrium, thermal-split and retained-stiff fixtures, first-law/exchange ledgers and the full mutation battery. No gate, endpoint, performance, production or publication claim moves. |"""
          lines.insert(separator + 1, log_row)
          log_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Rebuild context projections
        run: |
          set -euo pipefail
          python3 .agent-harness/scripts/build_context_pack.py
          python3 .agent-harness/scripts/build_status_board.py

      - name: Pre-commit verification
        shell: bash
        run: |
          set -euo pipefail
          python3 .agent-harness/scripts/validate_harness.py
          python3 -m pytest -q .agent-harness/tests
          python3 .agent-harness/scripts/check_ssot_consistency.py
          python3 .agent-harness/scripts/check_chronology.py --help >/dev/null
          git diff --check

      - name: Commit records and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^)"
          rm .github/workflows/d080_ssot_sync.yml
          expected="$(cat <<'EOF'
          .agent-harness/context/CONTEXT_INDEX.json
          .agent-harness/context/FROZEN_DECISIONS.md
          .agent-harness/generated/CONTEXT_PACK.md
          docs/harness/DECISION_LOG.md
          EOF
          )"
          actual="$(git diff --name-only "$base" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected final changed paths.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          git diff --check "$base"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "records(d080): synchronize partial static admission"

      - name: Exact-tree verification and push
        shell: bash
        run: |
          set -euo pipefail
          python3 .agent-harness/scripts/validate_harness.py
          python3 -m pytest -q .agent-harness/tests
          python3 .agent-harness/scripts/check_ssot_consistency.py
          python3 .agent-harness/scripts/check_chronology.py --help >/dev/null
          python3 .agent-harness/scripts/build_context_pack.py
          python3 .agent-harness/scripts/build_status_board.py
          git diff --exit-code -- ':!.agent-harness/generated/CONTEXT_PACK.md' ':!.agent-harness/context/CONTEXT_INDEX.json'
          git show HEAD:.agent-harness/generated/CONTEXT_PACK.md | diff <(sed '4d' -) <(sed '4d' .agent-harness/generated/CONTEXT_PACK.md)
          git diff --check
          git checkout -- .agent-harness/context/CONTEXT_INDEX.json .agent-harness/generated/CONTEXT_PACK.md
          test -z "$(git status --porcelain)"
          git push origin HEAD:research/d080-tgamma-kinematic-tangent-20260902
