name: d081r1d3-null-family-metrology-repair

on:
  push:
    branches:
      - research/d081r1d3-electron-action-20260903
    paths:
      - .github/workflows/d081r1d3_null_family_metrology_repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d3-electron-action-20260903
          fetch-depth: 2

      - name: Bind analytic-null family energies to a nonzero physical scale
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 484dd453ebeed226311ce826fa51a964bf8501c5
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/rabbit_cpu/src/f10_electron_action_tests.rs")
          text = path.read_text(encoding="utf-8")

          anchor = "\nfn assert_hybrid_close(\n"
          function_lines = [
              "fn oracle_bath_energy_scale(value: &Value) -> f64 {",
              "    value[\"cases\"]",
              "        .as_array()",
              "        .expect(\"fixture cases\")",
              "        .iter()",
              "        .flat_map(|case| {",
              "            case[\"bath_energy_by_family\"]",
              "                .as_object()",
              "                .expect(\"bath-energy family map\")",
              "                .values()",
              "                .map(bits)",
              "                .collect::<Vec<_>>()",
              "        })",
              "        .map(f64::abs)",
              "        .fold(f64::MIN_POSITIVE, f64::max)",
              "}",
              "",
              "fn assert_hybrid_close(",
          ]
          replacement = "\n" + "\n".join(function_lines)
          if text.count(anchor) != 1:
              raise SystemExit(f"unexpected assertion anchor count: {text.count(anchor)}")
          text = text.replace(anchor, replacement, 1)

          anchor = "        let family_scale = oracle_family_scale(&full);\n"
          replacement = (
              anchor
              + "        let bath_energy_scale = oracle_bath_energy_scale(&metrology);\n"
              + "        assert!(bath_energy_scale.is_finite() && bath_energy_scale > 0.0);\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"unexpected family-scale anchor count: {text.count(anchor)}")
          text = text.replace(anchor, replacement, 1)

          old = (
              "                    result.bath_energy_by_family[index]\n"
              "                        .abs()\n"
              "                        .max(bits(&component[\"bath_energy_by_family\"][family_name]).abs())\n"
              "                        .max(f64::MIN_POSITIVE),\n"
          )
          new = "                    bath_energy_scale,\n"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected null-family scale block count: {text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          (cd native/rabbit_cpu && cargo +1.94.1 fmt --all)
          rm .github/workflows/d081r1d3_null_family_metrology_repair.yml
          test "$(git diff --name-only)" = "native/rabbit_cpu/src/f10_electron_action_tests.rs"
          git diff --check

      - name: Commit and push bounded metrology repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/rabbit_cpu/src/f10_electron_action_tests.rs
          git diff --cached --check
          git commit -m "test(d081r1d3): scale null family ledgers by thermal envelope"
          git push origin HEAD:research/d081r1d3-electron-action-20260903
