name: d081r1f1-p0-primitives-red

on:
  push:
    branches:
      - research/d081r1f1-rust-tgamma-jvp-20260904
    paths:
      - .github/workflows/d081r1f1_p0_primitives_red.yml
      - native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs

permissions:
  contents: write
  actions: read

jobs:
  primitive-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_BRANCH: research/d081r1f1-rust-tgamma-jvp-20260904
      CONTRACT: docs/audit/D081R1F1_RUST_TGAMMA_PACKED_RHS_JVP_CONTRACT_2026-09-04.md
      EXPECTED_CONTRACT_BLOB: 58eeaf38b9f4edd4c60a01d22d2e101a33b71812
      EXPECTED_TEST_BLOB: be06a20e5da2eaa8826120a2fb7e4862c3ac9b54
      RECEIPT: docs/audit/artifacts/d081r1f1/p0_primitives_red_receipt.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger and frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          git merge-base --is-ancestor a9bc5b244ab7f2b120af43a9849fdfac6283c496 HEAD
          test "$(git hash-object "${CONTRACT}")" = "${EXPECTED_CONTRACT_BLOB}"
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs)" = "${EXPECTED_TEST_BLOB}"
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test ! -e native/rabbit_cpu/src/f10_tgamma_tangent.rs
          test ! -e "${RECEIPT}"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"

      - name: Recover exact offline Rust vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9838506413/zip > /tmp/vendor.zip
          echo '391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          vendor_dir="$(find /tmp/vendor-outer -type d -name vendor -print -quit)"
          if [[ -z "${vendor_dir}" ]]; then
            archive="$(find /tmp/vendor-outer -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' -o -name '*.zip' \) -print -quit)"
            case "${archive}" in
              *.tar.gz|*.tgz) tar -xzf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar.xz) tar -xJf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar) tar -xf "${archive}" -C /tmp/vendor-expanded ;;
              *.zip) unzip -q "${archive}" -d /tmp/vendor-expanded ;;
              *) echo 'no supported vendor archive' >&2; exit 1 ;;
            esac
            vendor_dir="$(find /tmp/vendor-expanded -type d -name vendor -print -quit)"
          fi
          test -n "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r0"\n[source.d081r0]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml

      - name: Prove the primitive module is absent through the real test
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          cp src/lib.rs /tmp/d081r1f1-p0-lib.rs.before
          cat >> src/lib.rs <<'RUST'

          #[cfg(test)]
          mod f10_tgamma_tangent_tests;
          RUST
          set +e
          cargo +1.94.1 test --locked --offline f10_tgamma_tangent_tests --no-run 2>&1 | tee /tmp/d081r1f1-p0-primitives-red.log
          status=${PIPESTATUS[0]}
          set -e
          cp /tmp/d081r1f1-p0-lib.rs.before src/lib.rs
          test "${status}" -ne 0
          grep -F 'error[E0432]' /tmp/d081r1f1-p0-primitives-red.log
          grep -F 'crate::f10_tgamma_tangent' /tmp/d081r1f1-p0-primitives-red.log
          cmp src/lib.rs /tmp/d081r1f1-p0-lib.rs.before
          git -C ../.. diff --exit-code -- native/rabbit_cpu/src/lib.rs
          echo 'D081R1F1_EXPECTED_PRIMITIVE_MODULE_RED_CONFIRMED'

      - name: Publish durable primitive RED receipt
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          mkdir -p "$(dirname "${RECEIPT}")"
          export CONTRACT_BLOB="$(git hash-object "${CONTRACT}")"
          export TRIGGER_TREE="$(git rev-parse HEAD^{tree})"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          log = Path('/tmp/d081r1f1-p0-primitives-red.log')
          text = log.read_text(encoding='utf-8', errors='replace')
          required = ('error[E0432]', 'crate::f10_tgamma_tangent')
          if not all(token in text for token in required):
              raise SystemExit('expected primitive RED compiler evidence is incomplete')
          payload = {
              'schema': 'rabbit.d081r1f1.p0_primitives_red.v1',
              'classification': 'PASS_EXPECTED_ABSENT_TGAMMA_PRIMITIVE_MODULE_RED',
              'trigger_head': os.environ['GITHUB_SHA'],
              'trigger_tree': os.environ['TRIGGER_TREE'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'contract_blob': os.environ['CONTRACT_BLOB'],
              'test_blob': os.environ['EXPECTED_TEST_BLOB'],
              'r1f0_parent': 'c29b6d26599da0bead66482373d8ec2cdc8f06c4',
              'cargo_lock_blob': 'a1b5035da5c20712d1a2a4ab077da255ff94a014',
              'rust': '1.94.1',
              'offline_vendor_artifact': 9838506413,
              'offline_vendor_zip_sha256': '391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a',
              'offline_vendor_packages': 174,
              'expected_error_code': 'E0432',
              'missing_module': 'f10_tgamma_tangent',
              'compiler_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest(),
              'temporary_module_registration_restored': True,
              'production_source_committed': False,
              'retained_or_holdout_state_accessed': False,
              'claim_ceiling': 'primitive-level RED only; no Rust thermal tangent implementation, numerical equivalence, retained state, solver, trajectory, or F10 gate movement claim',
          }
          Path(os.environ['RECEIPT']).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${RECEIPT}"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "${RECEIPT}"
          git commit -m 'test(d081r1f1): publish thermal primitive RED receipt'
          git push origin HEAD:${EXPECTED_BRANCH}
