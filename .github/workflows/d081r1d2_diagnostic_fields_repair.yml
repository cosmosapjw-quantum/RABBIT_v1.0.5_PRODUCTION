name: d081r1d2-diagnostic-fields-repair

on:
  push:
    branches:
      - research/d081r1d2-self-action-20260903
    paths:
      - .github/workflows/d081r1d2_diagnostic_fields_repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d2-self-action-20260903
          fetch-depth: 0

      - name: Bind self-action diagnostics to the frozen oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/rabbit_cpu/src/f10_self_action_tests.rs")
          text = path.read_text(encoding="utf-8")
          needle = '''            assert_moment_close(
                result.event_energy_residual,
                bits(&case["diagnostics"]["self_event_energy_residual"]),
                result.event_energy_absolute.max(1.0),
            );
'''
          replacement = needle + '''            assert_eq!(
                result.whole_reaction_domain_rejections,
                usize::try_from(
                    case["whole_reaction_domain_rejections"]
                        .as_u64()
                        .expect("whole-reaction domain rejection count"),
                )
                .expect("rejection count fits usize"),
            );
            assert_eq!(
                result.matrix_roundoff_corrections,
                usize::try_from(
                    case["matrix_roundoff_corrections"]
                        .as_u64()
                        .expect("matrix roundoff correction count"),
                )
                .expect("correction count fits usize"),
            );
            let expected_largest_correction =
                bits(&case["largest_matrix_roundoff_correction_bits"]);
            assert_moment_close(
                result.largest_matrix_roundoff_correction,
                expected_largest_correction,
                result
                    .largest_matrix_roundoff_correction
                    .abs()
                    .max(expected_largest_correction.abs())
                    .max(f64::MIN_POSITIVE),
            );
'''
          if text.count(needle) != 1:
              raise SystemExit("expected exactly one event-energy assertion block")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          (cd native/rabbit_cpu && cargo +1.94.1 fmt --all)
          git diff --check
          test "$(git diff --name-only)" = "native/rabbit_cpu/src/f10_self_action_tests.rs"

      - name: Commit bounded semantic-lint repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/rabbit_cpu/src/f10_self_action_tests.rs
          git diff --cached --check
          git commit -m "test(d081r1d2): bind self-action diagnostics to oracle"
          git push origin HEAD:research/d081r1d2-self-action-20260903
