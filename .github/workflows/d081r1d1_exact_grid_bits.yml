name: d081r1d1-exact-grid-bits

on:
  push:
    branches:
      - research/d081r1d1-foundations-20260903

permissions:
  contents: read

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d1-foundations-20260903
          fetch-depth: 1
      - name: Emit exact NumPy GL8 mapped binary64 constants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "numpy==2.4.4"
          python3 - <<'PY'
          import numpy as np

          unit_nodes, unit_weights = np.polynomial.legendre.leggauss(8)
          nodes = 4.0 * (1.0 + unit_nodes)
          weights = 4.0 * unit_weights
          print("pub(crate) const EXACT_ORDER8_YMAX8_NODE_BITS: [u64; 8] = [")
          for value in nodes:
              print(f"    0x{int(value.view(np.uint64)):016x}, // {float(value):.17e}")
          print("];")
          print("pub(crate) const EXACT_ORDER8_YMAX8_WEIGHT_BITS: [u64; 8] = [")
          for value in weights:
              print(f"    0x{int(value.view(np.uint64)):016x}, // {float(value):.17e}")
          print("];")
          PY
