name: d081r1f1-p0ab-clean-final-replay

on:
  push:
    branches:
      - research/d081r1f1-p0ab-clean-replay-20260905-r1
    paths-ignore:
      - docs/audit/artifacts/d081r1f1/p0ab_clean_final_replay_receipt.json

permissions:
  contents: write
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger and repaired source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 3f8b07bbb2894d7a2ff8667f82646a6285a992ca HEAD
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_tangent.rs)" = 8d731d9f88076375b73ac4eca2a6ac54e98e66c6
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_kinematics.rs)" = 88717ed6206cae78599e805de79cf1b3f046443a
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_adversarial_repair_tests.rs)" = cae0a2ab38d1caae58138acf11fbeb146a6dbaad
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs)" = f2642cf9a699290e2c97a7d6e8a12b980e5f8919
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_kinematic_tests.rs)" = 14db5662106ad432d8236a97beccace85c2f6075
          test "$(git hash-object native/rabbit_cpu/src/lib.rs)" = d212266d3a0f07c543d6d84d04d0db68d9899524
          test "$(git hash-object scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py)" = 3a90ae484a20fd8601c9db307ce5d5202343acca
          test "$(git hash-object scripts/audit/d081r1f1_p0b_tgamma_kinematics_oracle.py)" = 1eb3669a69b14400f1db49a7fcf8ece18dfebb36
          test "$(git hash-object docs/audit/D081R1F1_P0AB_ADVERSARIAL_REPAIR_CONTRACT_2026-09-04.md)" = 876ad9a7cc2d8edacc37d4f6abbadcbc91410d13
          test "$(git hash-object docs/audit/D081R1F1_P0AB_MARGIN_TEST_AMENDMENT_2026-09-04.md)" = 94ea97c69ca0e2c037a2830dd248fad9e2e84637
          test "$(git hash-object docs/audit/artifacts/d081r1f1/p0ab_adversarial_repair_green_receipt.json)" = 1206d9c9c73b4ab7166939cad6b5c8a038532e7e
          test "$(git hash-object scripts/audit/_d080_tgamma_primitives.py)" = c585d5865fd68a90a04a76ab540b8437fba8cfce
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test ! -e docs/audit/artifacts/d081r1f1/p0ab_clean_final_replay_receipt.json

      - name: Generate deterministic P0A and P0B Python oracles
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/d081r1f1-p0ab-clean-venv
          /tmp/d081r1f1-p0ab-clean-venv/bin/python -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            numpy==2.4.4 scipy==1.17.1
          PY=/tmp/d081r1f1-p0ab-clean-venv/bin/python
          "$PY" scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py --output /tmp/p0a-a.json
          "$PY" scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py --output /tmp/p0a-b.json
          cmp /tmp/p0a-a.json /tmp/p0a-b.json
          echo '3e0941c8649895c0ee3c1c2e98abd949a1d2fafbf0d7dcf1ff39f41825ce0fa7  /tmp/p0a-a.json' | sha256sum -c -
          "$PY" scripts/audit/d081r1f1_p0b_tgamma_kinematics_oracle.py --output /tmp/p0b-a.json
          "$PY" scripts/audit/d081r1f1_p0b_tgamma_kinematics_oracle.py --output /tmp/p0b-b.json
          cmp /tmp/p0b-a.json /tmp/p0b-b.json
          echo 'b145b898d4e2160c2fd72c3abc5830f7afaf85b03511b5a0b8ce0b4426c9a32d  /tmp/p0b-a.json' | sha256sum -c -

      - name: Install exact Rust and refreshed offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9932329475/zip > /tmp/vendor.zip
          echo '2fa7b64275f5ec435b8dab3b9876dce79227bb1d12a5da552f67059e6a240640  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          echo '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f  /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz' | sha256sum -c -
          tar -xzf /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz -C /tmp/vendor-expanded
          test "$(find /tmp/vendor-expanded/vendor -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r1"\n[source.d081r1]\ndirectory="/tmp/vendor-expanded/vendor"\n[net]\noffline=true\n' > native/rabbit_cpu/.cargo/config.toml

      - name: Execute clean focused replay without source mutation
        shell: bash
        working-directory: native/rabbit_cpu
        env:
          D081R1F1_P0A_ORACLE: /tmp/p0a-a.json
          D081R1F1_P0B_ORACLE: /tmp/p0b-a.json
        run: |
          set -euo pipefail
          cargo +1.94.1 metadata --locked --offline --format-version 1 >/tmp/p0ab-clean-metadata.json
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --offline f10_tgamma_adversarial_repair_tests -- --nocapture 2>&1 | tee /tmp/p0ab-clean-tests.log
          grep -F 'test result: ok. 2 passed; 0 failed; 1 ignored' /tmp/p0ab-clean-tests.log
          cargo +1.94.1 test --locked --offline \
            f10_tgamma_adversarial_repair_tests::direct_python_d080a_basis_and_kinematic_arrays_match \
            -- --ignored --exact --nocapture
          cargo +1.94.1 test --locked --offline f10_tgamma_tangent_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_tgamma_kinematic_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_packed_rhs_jvp_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_packed_rhs_preflight_tests::tests -- --nocapture
          cargo +1.94.1 clippy --all-targets --all-features --locked --offline -- -D warnings
          test -z "$(git -C ../.. status --short --untracked-files=no)"

      - name: Publish durable clean-replay receipt only
        shell: bash
        run: |
          set -euo pipefail
          receipt='docs/audit/artifacts/d081r1f1/p0ab_clean_final_replay_receipt.json'
          mkdir -p "$(dirname "${receipt}")"
          export RECEIPT="${receipt}"
          export TRIGGER_TREE="$(git rev-parse HEAD^{tree})"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def blob(path: str) -> str:
              return subprocess.check_output(['git', 'hash-object', path], text=True).strip()

          payload = {
              'schema': 'rabbit.d081r1f1.p0ab_clean_final_replay_receipt.v1',
              'classification': 'PASS_CLEAN_FINAL_HEAD_P0A_P0B_REPLAY_SCOPE',
              'trigger_head': os.environ['GITHUB_SHA'],
              'trigger_tree': os.environ['TRIGGER_TREE'],
              'canonical_repair_ancestor': '3f8b07bbb2894d7a2ff8667f82646a6285a992ca',
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'source_blobs': {
                  'tgamma': blob('native/rabbit_cpu/src/f10_tgamma_tangent.rs'),
                  'kinematics': blob('native/rabbit_cpu/src/f10_tgamma_kinematics.rs'),
                  'adversarial_tests': blob('native/rabbit_cpu/src/f10_tgamma_adversarial_repair_tests.rs'),
                  'p0a_tests': blob('native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs'),
                  'p0b_tests': blob('native/rabbit_cpu/src/f10_tgamma_kinematic_tests.rs'),
                  'lib': blob('native/rabbit_cpu/src/lib.rs'),
              },
              'oracle_generator_blobs': {
                  'p0a': blob('scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py'),
                  'p0b': blob('scripts/audit/d081r1f1_p0b_tgamma_kinematics_oracle.py'),
              },
              'oracle_sha256': {
                  'p0a': hashlib.sha256(Path('/tmp/p0a-a.json').read_bytes()).hexdigest(),
                  'p0b': hashlib.sha256(Path('/tmp/p0b-a.json').read_bytes()).hexdigest(),
              },
              'runtime': {
                  'rust': '1.94.1',
                  'python': '3.12.3',
                  'numpy': '2.4.4',
                  'scipy': '1.17.1',
                  'vendor_artifact_id': 9932329475,
                  'vendor_package_directories': 174,
                  'vendor_tar_sha256': '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f',
              },
              'gates': {
                  'no_source_mutation': 'PASS',
                  'deterministic_p0a_oracle': 'PASS',
                  'deterministic_p0b_oracle': 'PASS',
                  'adversarial_repair_tests': 'PASS',
                  'direct_python_d080a_parity': 'PASS',
                  'p0a_focused_tests': 'PASS',
                  'p0b_focused_tests': 'PASS',
                  'r1f0_zero_jvp_regression': 'PASS',
                  'packed_rhs_preflight': 'PASS',
                  'release_check': 'PASS',
                  'strict_clippy': 'PASS',
              },
              'retained_or_holdout_state_accessed': False,
              'claim_ceiling': 'clean exact-SHA replay of repaired P0A/P0B primitives only; no collision-action or packed-RHS T_gamma JVP, retained state, solver, trajectory, endpoint, N_eff, performance, publication readiness, merge, or G-F10 movement',
          }
          Path(os.environ['RECEIPT']).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${receipt}"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "${receipt}"
          git commit -m 'test(d081r1f1): publish clean P0A/P0B final-head replay receipt'
          git fetch origin research/d081r1f1-p0ab-clean-replay-20260905-r1
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push origin HEAD:research/d081r1f1-p0ab-clean-replay-20260905-r1
