name: d081r1e-packed-rhs-green

on:
  push:
    branches:
      - research/d081r1e-retained-packed-rhs-green-20260903
    paths:
      - .github/scripts/d081r1e_apply_green.py
      - .github/workflows/d081r1e_green.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify canonical authorities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 52854d8c207e2fdf07033a0418e0654c93aad603 HEAD
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object scripts/audit/_trajectory_core.py)" = 465a73f0ce40f7149bebdc2d67103f388e2344d9
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          echo 'ce2a64114d85c490f4cd1ba055a7a5331e85dc224a956c15a897621a0476330a  native/rabbit_cpu/tests/fixtures/d081r1/retained_packed_rhs_case.json' | sha256sum -c -
          python3 -m py_compile .github/scripts/d081r1e_apply_green.py

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
          test "$(rustc +1.94.1 --version)" = 'rustc 1.94.1 (e408947bf 2026-03-25)'
          test "$(cargo +1.94.1 --version)" = 'cargo 1.94.1 (29ea6fb6a 2026-03-24)'
          test "$(rustfmt +1.94.1 --version)" = 'rustfmt 1.8.0-stable (e408947bf 2026-03-25)'
          cargo +1.94.1 clippy --version

      - name: Recover exact offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9838506413/zip > /tmp/vendor.zip
          echo '391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          vendor_dir="$(find /tmp/vendor-outer -type d -name vendor -print -quit)"
          if [[ -z "${vendor_dir}" ]]; then
            archive="$(find /tmp/vendor-outer -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' -o -name '*.zip' \) -print -quit)"
            case "${archive}" in
              *.tar.gz|*.tgz) tar -xzf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar.xz) tar -xJf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar) tar -xf "${archive}" -C /tmp/vendor-expanded ;;
              *.zip) unzip -q "${archive}" -d /tmp/vendor-expanded ;;
              *) echo 'no supported vendor archive' >&2; exit 1 ;;
            esac
            vendor_dir="$(find /tmp/vendor-expanded -type d -name vendor -print -quit)"
          fi
          test -n "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r0"\n[source.d081r0]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml

      - name: Apply bounded GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/d081r1e_apply_green.py
          cd native/rabbit_cpu
          cargo +1.94.1 fmt --all
          cd ../..
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            native/rabbit_cpu/src/f10_packed_rhs.rs
            native/rabbit_cpu/src/f10_packed_rhs_preflight_tests.rs
            native/rabbit_cpu/src/f10_packed_rhs_tests.rs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          git diff --check

      - name: Run exact offline admission
        shell: bash
        run: |
          set -euo pipefail
          cd native/rabbit_cpu
          cargo +1.94.1 metadata --locked --offline --format-version 1 > /tmp/d081r1e-metadata.json
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --offline f10_packed_rhs_preflight_tests::tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_packed_rhs_tests::tests -- --nocapture
          cargo +1.94.1 clippy --all-targets --all-features --locked --offline -- -D warnings

      - name: Commit exact GREEN source
        shell: bash
        env:
          TARGET_BRANCH: research/d081r1e-retained-packed-rhs-green-20260903
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            native/rabbit_cpu/src/f10_packed_rhs.rs \
            native/rabbit_cpu/src/f10_packed_rhs_preflight_tests.rs \
            native/rabbit_cpu/src/f10_packed_rhs_tests.rs
          git diff --cached --check
          git commit -m 'feat(d081r1e): admit retained order-60 packed RHS'
          git push origin "HEAD:${TARGET_BRANCH}"
