name: d081r1d3-repair-generator-and-freeze

on:
  push:
    branches:
      - research/d081r1d3-electron-action-20260903
    paths:
      - .github/workflows/d081r1d3_repair_generator_and_freeze.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d3-electron-action-20260903
          fetch-depth: 0

      - name: Apply measured reconstruction roundoff budget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "native/rabbit_cpu/tests/fixtures/d081r1/"
              "generate_electron_collision_action_metrology.py"
          )
          text = path.read_text(encoding="utf-8")
          old = '''    if not np.allclose(
              elastic_native + pair_native, native, rtol=3.0e-15, atol=2.0e-38
          ):
              raise AssertionError("elastic+pair native decomposition failed")
          '''
          new = '''    native_residual = elastic_native + pair_native - native
          native_difference = float(np.max(np.abs(native_residual)))
          native_scale = float(
              max(
                  np.max(np.abs(native)),
                  np.max(np.abs(elastic_native)),
                  np.max(np.abs(pair_native)),
                  np.finfo(np.float64).tiny,
              )
          )
          native_roundoff_budget = 256.0 * np.finfo(np.float64).eps * native_scale
          if native_difference > native_roundoff_budget:
              raise AssertionError(
                  "elastic+pair native decomposition failed: "
                  f"difference={native_difference:.17e}, "
                  f"budget={native_roundoff_budget:.17e}"
              )
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one native decomposition block, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python3 -m py_compile \
            native/rabbit_cpu/tests/fixtures/d081r1/generate_electron_collision_action_metrology.py

      - name: Regenerate and verify electron-only fixture twice
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "numpy==2.4.4" "scipy==1.17.1"
          generator=native/rabbit_cpu/tests/fixtures/d081r1/generate_electron_collision_action_metrology.py
          fixture=native/rabbit_cpu/tests/fixtures/d081r1/electron_collision_action_metrology.json
          python3 "${generator}"
          cp "${fixture}" /tmp/electron-metrology.first.json
          python3 "${generator}"
          cmp /tmp/electron-metrology.first.json "${fixture}"
          python3 -m json.tool "${fixture}" >/dev/null
          git diff --check

      - name: Commit bounded generator repair and fixture
        shell: bash
        run: |
          set -euo pipefail
          generator=native/rabbit_cpu/tests/fixtures/d081r1/generate_electron_collision_action_metrology.py
          fixture=native/rabbit_cpu/tests/fixtures/d081r1/electron_collision_action_metrology.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${generator}" "${fixture}"
          git diff --cached --check
          git commit -m "test(d081r1d3): freeze electron-action component metrology"
          git push origin HEAD:research/d081r1d3-electron-action-20260903
