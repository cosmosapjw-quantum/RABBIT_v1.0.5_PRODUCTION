name: d081r1f1-p0b-kinematics-red

on:
  push:
    branches:
      - research/d081r1f1-p0b-tgamma-kinematics-20260904
    paths:
      - .github/workflows/d081r1f1_p0b_kinematics_red.yml
      - native/rabbit_cpu/src/f10_tgamma_kinematic_tests.rs

permissions:
  contents: write
  actions: read

jobs:
  p0b-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BRANCH: research/d081r1f1-p0b-tgamma-kinematics-20260904
      TEST_PATH: native/rabbit_cpu/src/f10_tgamma_kinematic_tests.rs
      RECEIPT: docs/audit/artifacts/d081r1f1/p0b_kinematics_red_receipt.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger and admitted P0A authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "${BRANCH}"
          git merge-base --is-ancestor f090e71afeaeac9a40174f302feaaea909baaa3b HEAD
          test "$(git hash-object docs/audit/D081R1F1_RUST_TGAMMA_PACKED_RHS_JVP_CONTRACT_2026-09-04.md)" = 58eeaf38b9f4edd4c60a01d22d2e101a33b71812
          test "$(git hash-object docs/audit/artifacts/d081r1f1/p0a_integration_receipt.json)" = 4b1d490084a3150107cc9b451110098a58ae0513
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_tangent.rs)" = 0217768ba62b02d14a3c52ae68208fafc8c8d46c
          test "$(git hash-object "${TEST_PATH}")" = e9c8b6dc2edb2dcdae0f895020b043620849561a
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          ! grep -Fq 'struct F10ElasticTgammaInput' native/rabbit_cpu/src/f10_tgamma_tangent.rs
          ! grep -Fq 'fn evaluate_elastic_tgamma_kinematic_tangent' native/rabbit_cpu/src/f10_tgamma_tangent.rs
          ! grep -Fq 'fn mapped_modal_basis_derivative' native/rabbit_cpu/src/f10_tgamma_tangent.rs
          test ! -e "${RECEIPT}"

      - name: Install exact Rust and refreshed offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          test "$(rustc +1.94.1 --version)" = 'rustc 1.94.1 (e408947bf 2026-03-25)'
          test "$(cargo +1.94.1 --version)" = 'cargo 1.94.1 (29ea6fb6a 2026-03-24)'
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9932329475/zip > /tmp/vendor.zip
          echo '2fa7b64275f5ec435b8dab3b9876dce79227bb1d12a5da552f67059e6a240640  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          echo '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f  /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz' | sha256sum -c -
          tar -xzf /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz -C /tmp/vendor-expanded
          test "$(find /tmp/vendor-expanded/vendor -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r1"\n[source.d081r1]\ndirectory="/tmp/vendor-expanded/vendor"\n[net]\noffline=true\n' > native/rabbit_cpu/.cargo/config.toml

      - name: Prove mapped-basis and kinematic APIs are absent
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          cp src/lib.rs /tmp/d081r1f1-p0b-lib.before
          cat >> src/lib.rs <<'RUST'

          #[cfg(test)]
          mod f10_tgamma_kinematic_tests;
          RUST
          set +e
          cargo +1.94.1 test --locked --offline f10_tgamma_kinematic_tests --no-run 2>&1 | tee /tmp/d081r1f1-p0b-red.log
          status=${PIPESTATUS[0]}
          set -e
          cp /tmp/d081r1f1-p0b-lib.before src/lib.rs
          test "${status}" -ne 0
          grep -F 'error[E0432]' /tmp/d081r1f1-p0b-red.log
          grep -F 'F10ElasticTgammaInput' /tmp/d081r1f1-p0b-red.log
          grep -F 'evaluate_elastic_tgamma_kinematic_tangent' /tmp/d081r1f1-p0b-red.log
          grep -F 'mapped_modal_basis_derivative' /tmp/d081r1f1-p0b-red.log
          cmp src/lib.rs /tmp/d081r1f1-p0b-lib.before
          git -C ../.. diff --exit-code -- native/rabbit_cpu/src/lib.rs
          echo 'D081R1F1_EXPECTED_P0B_KINEMATIC_RED_CONFIRMED'

      - name: Publish durable P0B RED receipt
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          mkdir -p "$(dirname "${RECEIPT}")"
          export TRIGGER_TREE="$(git rev-parse HEAD^{tree})"
          export WORKFLOW_BLOB="$(git hash-object .github/workflows/d081r1f1_p0b_kinematics_red.yml)"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          log = Path('/tmp/d081r1f1-p0b-red.log')
          text = log.read_text(encoding='utf-8', errors='replace')
          required = (
              'error[E0432]',
              'F10ElasticTgammaInput',
              'evaluate_elastic_tgamma_kinematic_tangent',
              'mapped_modal_basis_derivative',
          )
          if not all(token in text for token in required):
              raise SystemExit('expected P0B compiler evidence is incomplete')
          payload = {
              'schema': 'rabbit.d081r1f1.p0b_kinematics_red.v1',
              'classification': 'PASS_EXPECTED_ABSENT_TGAMMA_KINEMATIC_PRIMITIVES_RED',
              'trigger_head': os.environ['GITHUB_SHA'],
              'trigger_tree': os.environ['TRIGGER_TREE'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_blob': os.environ['WORKFLOW_BLOB'],
              'p0a_parent': 'f090e71afeaeac9a40174f302feaaea909baaa3b',
              'contract_blob': '58eeaf38b9f4edd4c60a01d22d2e101a33b71812',
              'p0a_integration_receipt_blob': '4b1d490084a3150107cc9b451110098a58ae0513',
              'p0a_source_blob': '0217768ba62b02d14a3c52ae68208fafc8c8d46c',
              'test_blob': 'e9c8b6dc2edb2dcdae0f895020b043620849561a',
              'cargo_lock_blob': 'a1b5035da5c20712d1a2a4ab077da255ff94a014',
              'rust': '1.94.1',
              'vendor_artifact_id': 9932329475,
              'vendor_zip_sha256': '2fa7b64275f5ec435b8dab3b9876dce79227bb1d12a5da552f67059e6a240640',
              'vendor_archive_sha256': '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f',
              'vendor_packages': 174,
              'missing_items': [
                  'F10ElasticTgammaInput',
                  'evaluate_elastic_tgamma_kinematic_tangent',
                  'mapped_modal_basis_derivative',
              ],
              'compiler_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest(),
              'temporary_module_registration_restored': True,
              'production_kinematic_source_committed': False,
              'retained_or_holdout_state_accessed': False,
              'claim_ceiling': 'P0B primitive-level RED only; no mapped-basis or finite-mass kinematic tangent implementation, collision JVP, packed-RHS T_gamma column, retained state, solver, trajectory, or G-F10 movement',
          }
          Path(os.environ['RECEIPT']).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${RECEIPT}"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "${RECEIPT}"
          git commit -m 'test(d081r1f1): publish P0B kinematic RED receipt'
          git push origin HEAD:${BRANCH}
