name: d081r1f0-retained-symmetry-amendment

on:
  push:
    branches:
      - research/d081r1f0-rust-c-only-jvp-20260904
    paths:
      - .github/workflows/d081r1f0_retained_symmetry_amendment.yml
      - .github/scripts/d081r1f0_apply_retained_symmetry_amendment.py
      - docs/audit/D081R1F0_RETAINED_SYMMETRY_METROLOGY_AMENDMENT_2026-09-04.md

permissions:
  contents: write
  actions: read

jobs:
  amend-and-calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger and frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 29ee91a27536450d0ddce59f4f62b7a8dba0a77f HEAD
          test "$(git hash-object docs/audit/D081R1F0_RUST_C_ONLY_PACKED_RHS_JVP_CONTRACT_2026-09-04.md)" = ac7149fe5d5ec327cdc168d1eba7fe4a68ce3221
          test "$(git hash-object docs/audit/D081R1F0_RETAINED_SYMMETRY_METROLOGY_AMENDMENT_2026-09-04.md)" = 3ea36736e27b88ccd24da95769132d5b42c4500e
          test "$(git hash-object .github/scripts/d081r1f0_apply_retained_symmetry_amendment.py)" = 9183a8a9a22fdf7b44f8a43b36723e51f742584f
          test "$(git hash-object native/rabbit_cpu/src/f10_packed_rhs_jvp_retained_calibration_tests.rs)" = 62f51f9f375eb09c65d56ff73fd70e5a5b0520b4
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object scripts/audit/_d079_tangent_primitives.py)" = 668f3fab76ffc3ad7f29335a79fcd5daf47d429e
          test "$(git hash-object scripts/audit/_d079_collision_jvp.py)" = 591a64702c58a2de265fb88636f186e2d1b7e019
          test "$(git hash-object scripts/audit/_d079_rhs_jvp.py)" = 6bcff2bc5627c0af0ad4df61c908d09e62ffaba5
          test "$(git hash-object native/rabbit_cpu/tests/fixtures/d081r1/generate_rust_c_only_jvp_oracle.py)" = d8366b5386a7f1744fdb9729dba710712cd37eb4
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test ! -e docs/audit/artifacts/d081r1f0/retained_holdout_verification_receipt.json

      - name: Recover exact retained state and runtimes
        shell: bash
        run: |
          set -euo pipefail
          HISTORICAL='78f5b091bd8de99bd8d0b1eddd8a0b7978f5da2b'
          STATE_PATH='.agent-harness/runs/run-20260805-f10-v3-campaign/v3a_r2/domain/state_1200.npz'
          git show "${HISTORICAL}:${STATE_PATH}" > /tmp/d081r1f0_state_1200.npz
          echo 'c0ad51adbd34d4fb8408f566c7bc573ca3d5bbd8c1d1f5d89f50df2e6b5d3380  /tmp/d081r1f0_state_1200.npz' | sha256sum -c -
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/d081r1f0-amendment-venv
          /tmp/d081r1f0-amendment-venv/bin/python -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            numpy==2.4.4 scipy==1.17.1
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"

      - name: Recover exact offline Rust vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9838506413/zip > /tmp/vendor.zip
          echo '391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          vendor_dir="$(find /tmp/vendor-outer -type d -name vendor -print -quit)"
          if [[ -z "${vendor_dir}" ]]; then
            archive="$(find /tmp/vendor-outer -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' -o -name '*.zip' \) -print -quit)"
            case "${archive}" in
              *.tar.gz|*.tgz) tar -xzf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar.xz) tar -xJf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar) tar -xf "${archive}" -C /tmp/vendor-expanded ;;
              *.zip) unzip -q "${archive}" -d /tmp/vendor-expanded ;;
              *) echo 'no supported vendor archive' >&2; exit 1 ;;
            esac
            vendor_dir="$(find /tmp/vendor-expanded -type d -name vendor -print -quit)"
          fi
          test -n "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r0"\n[source.d081r0]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml

      - name: Generate calibration oracle twice
        shell: bash
        run: |
          set -euo pipefail
          PY=/tmp/d081r1f0-amendment-venv/bin/python
          GEN=native/rabbit_cpu/tests/fixtures/d081r1/generate_rust_c_only_jvp_oracle.py
          "$PY" "$GEN" --case retained-calibration \
            --retained /tmp/d081r1f0_state_1200.npz \
            --output /tmp/retained-calibration-a.json
          "$PY" "$GEN" --case retained-calibration \
            --retained /tmp/d081r1f0_state_1200.npz \
            --output /tmp/retained-calibration-b.json
          cmp /tmp/retained-calibration-a.json /tmp/retained-calibration-b.json
          sha256sum /tmp/retained-calibration-a.json /tmp/retained-calibration-b.json

      - name: Apply amendment and format
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/d081r1f0_apply_retained_symmetry_amendment.py
          cd native/rabbit_cpu
          cargo +1.94.1 fmt --all
          cd ../..
          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]-}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'native/rabbit_cpu/src/f10_packed_rhs_jvp_retained_calibration_tests.rs'

      - name: Execute amended calibration and exact regressions
        shell: bash
        working-directory: native/rabbit_cpu
        env:
          D081R1F0_RETAINED_CALIBRATION_FIXTURE: /tmp/retained-calibration-a.json
        run: |
          set -euo pipefail
          cargo +1.94.1 metadata --locked --offline --format-version 1 >/tmp/d081r1f0-amendment-metadata.json
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_jvp_retained_calibration_tests::retained_state1200_c_only_jvp_matches_the_frozen_calibration_oracle \
            -- --exact --nocapture 2>&1 | tee /tmp/d081r1f0-amended-calibration.log
          grep -F 'D081R1F0_MU_TAU_METROLOGY' /tmp/d081r1f0-amended-calibration.log
          grep -F 'D081R1F0_RETAINED_CALIBRATION_PASS' /tmp/d081r1f0-amended-calibration.log
          cargo +1.94.1 test --locked --offline f10_packed_rhs_jvp_order8_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_packed_rhs_preflight_tests::tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_packed_rhs_tests::tests -- --nocapture
          cargo +1.94.1 clippy --all-targets --all-features --locked --offline -- -D warnings

      - name: Publish amended calibration receipt and tested source
        shell: bash
        env:
          RECEIPT: docs/audit/artifacts/d081r1f0/retained_calibration_amended_receipt.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${RECEIPT}")"
          git add native/rabbit_cpu/src/f10_packed_rhs_jvp_retained_calibration_tests.rs
          TESTED_SOURCE_TREE="$(git write-tree)"
          export TESTED_SOURCE_TREE
          /tmp/d081r1f0-amendment-venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          log = Path('/tmp/d081r1f0-amended-calibration.log').read_text(encoding='utf-8')
          metric_line = next(line for line in log.splitlines() if 'D081R1F0_MU_TAU_METROLOGY' in line)
          pass_line = next(line for line in log.splitlines() if 'D081R1F0_RETAINED_CALIBRATION_PASS' in line)

          def fields(line):
              return {
                  key: value
                  for key, value in re.findall(r'([A-Za-z0-9_]+)=([^ ]+)', line)
              }

          metric = fields(metric_line)
          passed = fields(pass_line)
          payload = {
              'schema': 'rabbit.d081r1f0.retained_calibration_amended.v1',
              'classification': 'PASS_WITH_AMENDED_RETAINED_CALIBRATION_C_ONLY_JVP_SCOPE_PHYSICAL_COVARIANCE_HOLDOUT_OPEN',
              'trigger_head': os.environ['GITHUB_SHA'],
              'tested_source_tree_without_receipt': os.environ['TESTED_SOURCE_TREE'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'original_failure_run_id': '33835819255',
              'diagnostic_run_id': '33837198642',
              'original_contract_blob': 'ac7149fe5d5ec327cdc168d1eba7fe4a68ce3221',
              'amendment_blob': '3ea36736e27b88ccd24da95769132d5b42c4500e',
              'amendment_script_blob': '9183a8a9a22fdf7b44f8a43b36723e51f742584f',
              'fixture_sha256': hashlib.sha256(Path('/tmp/retained-calibration-a.json').read_bytes()).hexdigest(),
              'raw_symmetry_metrology': metric,
              'calibration_metrology': passed,
              'legacy_gate': {
                  'metric': 'mu_tau_net_relative',
                  'threshold': 2.0e-9,
                  'rust_pass': metric['legacy_rust_pass'],
                  'python_pass': metric['legacy_python_pass'],
                  'status': 'PRESERVED_REFERENCE_SELF_INCONSISTENT_FAILURE',
              },
              'claim_ceiling': 'amended fixed-state fixed-grid fixed-support spectral-c JVP calibration only; physical mu/tau equivariance remains open until preregistered swapped-direction holdout; no thermal input column, full Jacobian, solver, trajectory, endpoint, N_eff, performance, main integration, publication, or G-F10 movement',
          }
          Path(os.environ['RECEIPT']).write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git add "${RECEIPT}"
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = 'docs/audit/artifacts/d081r1f0/retained_calibration_amended_receipt.json'
          test "${staged[1]}" = 'native/rabbit_cpu/src/f10_packed_rhs_jvp_retained_calibration_tests.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(d081r1f0): admit amended retained calibration metrology'
          git push origin HEAD:research/d081r1f0-rust-c-only-jvp-20260904
