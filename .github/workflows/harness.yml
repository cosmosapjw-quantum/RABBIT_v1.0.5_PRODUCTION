# Runs the harness checkers that already exist.
#
# WHY THIS EXISTS (BD623). Every guarantee the harness makes rested on someone
# choosing to run a command. `.git/hooks/` held only samples, the repository had
# no workflows at all (`actions/workflows` total_count was 0), and
# `pyproject.toml` set `testpaths = ["tests"]`, so `pytest -q` did not collect
# `.agent-harness/tests` -- while D-074 section 6 stated the mutation battery
# "lives in the repository and runs in the suite".
#
# The sharpest consequence was the gate-movement ratchet. It compares the
# working tree against `git show HEAD:`, so it can only ever see a status change
# while that change is UNCOMMITTED. Once committed, the movement is invisible
# forever. A checker with that shape is not a control unless something runs it
# before the commit lands, and nothing did.
#
# This adds no checker. It runs the ones already written.
name: harness

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these jobs read the tree and report. They never write to it.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA, not a moving tag: a tag can be repointed at
      # different code by whoever controls the action's repository.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The validator and the SSOT checker both ask git questions --
          # `merge-base --is-ancestor`, `git show HEAD:`, blob digests at a
          # commit. A shallow clone answers some of them wrongly rather than
          # not at all, which is worse.
          fetch-depth: 0

      - name: Install harness test dependency
        run: python3 -m pip install --disable-pip-version-check "pytest>=7.0"

      - name: Aggregate validator
        run: python3 .agent-harness/scripts/validate_harness.py

      - name: Harness regression suite
        run: python3 -m pytest .agent-harness/tests -q

      - name: Generated artifacts match their inputs
        # The board and the pack are projections of the registries and the
        # shared context. Rebuilding them must be a no-op; if it is not, the
        # committed artifact is not what its inputs render to.
        run: |
          python3 .agent-harness/scripts/build_status_board.py
          python3 .agent-harness/scripts/build_context_pack.py
          # CONTEXT_INDEX.json carries a build timestamp, and CONTEXT_PACK.md
          # echoes it, so both differ on every rebuild by construction. Compare
          # everything else, and compare the pack ignoring only that one line.
          git diff --exit-code -- .agent-harness/generated/STATUS_BOARD.md
          git diff --exit-code -- ':!.agent-harness/generated/CONTEXT_PACK.md' \
                                  ':!.agent-harness/context/CONTEXT_INDEX.json'
          git show HEAD:.agent-harness/generated/CONTEXT_PACK.md \
            | diff <(sed '4d' -) <(sed '4d' .agent-harness/generated/CONTEXT_PACK.md)

  native-r1c:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/rabbit_cpu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Pauli edge certificate regressions
        run: cargo test --locked --lib pauli_edge_step::tests -- --nocapture

      - name: Pauli sweep certificate regressions
        run: |
          cargo test --locked --lib root_certificates_hold_across_legacy_small_step_scales -- --nocapture
          cargo test --locked --lib subnormal_traffic_does_not_dilute_error_fraction -- --nocapture
