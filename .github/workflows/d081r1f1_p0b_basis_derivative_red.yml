name: d081r1f1-p0b-basis-derivative-red

on:
  push:
    branches:
      - research/d081r1f1-rust-tgamma-jvp-20260904
    paths:
      - native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs

permissions:
  contents: read
  actions: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger and frozen P0A predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor f090e71afeaeac9a40174f302feaaea909baaa3b HEAD
          test "$(git hash-object docs/audit/D081R1F1_RUST_TGAMMA_PACKED_RHS_JVP_CONTRACT_2026-09-04.md)" = 58eeaf38b9f4edd4c60a01d22d2e101a33b71812
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_tangent.rs)" = 0217768ba62b02d14a3c52ae68208fafc8c8d46c
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test ! "$(grep -c 'pub(crate) fn mapped_modal_basis_derivative' native/rabbit_cpu/src/f10_tgamma_tangent.rs)" -ne 0

      - name: Install exact Rust and offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9932329475/zip > /tmp/vendor.zip
          echo '2fa7b64275f5ec435b8dab3b9876dce79227bb1d12a5da552f67059e6a240640  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          echo '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f  /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz' | sha256sum -c -
          tar -xzf /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz -C /tmp/vendor-expanded
          test "$(find /tmp/vendor-expanded/vendor -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r1"\n[source.d081r1]\ndirectory="%s"\n[net]\noffline=true\n' /tmp/vendor-expanded/vendor > native/rabbit_cpu/.cargo/config.toml
          cd native/rabbit_cpu
          cargo +1.94.1 metadata --locked --offline --format-version 1 > /tmp/p0b-red-metadata.json

      - name: Verify exact missing-function RED
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          set +e
          cargo +1.94.1 test --locked --offline f10_tgamma_tangent_tests -- --nocapture > /tmp/p0b-red.log 2>&1
          status=$?
          set -e
          cat /tmp/p0b-red.log
          test "${status}" -ne 0
          grep -F 'mapped_modal_basis_derivative' /tmp/p0b-red.log
          grep -E 'unresolved import|no `mapped_modal_basis_derivative`' /tmp/p0b-red.log
