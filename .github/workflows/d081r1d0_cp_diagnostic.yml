name: d081r1d0-cp-diagnostic

on:
  push:
    branches:
      - research/d081r1d-full-action-oracle-20260903

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d-full-action-oracle-20260903
          fetch-depth: 1

      - run: python3 -m pip install --disable-pip-version-check "numpy==2.4.4" "scipy==1.17.1"

      - name: Measure CP residual against absolute null-state scales
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 - <<'PY'
          import numpy as np
          from rabbit.decoupling import _independent_noqke as o

          grid = o.build_independent_grid(order=8, y_max=8.0)
          base = np.stack([-grid.nodes, -grid.nodes, -grid.nodes])
          profile = 0.02 * (1.0 - 2.0 * grid.nodes / 8.0)
          split = np.stack([-grid.nodes, -grid.nodes + profile, -grid.nodes - profile])
          cases = [
              ("equilibrium", base, 2.0, 2.0),
              ("thermal_split", base, 2.0, 2.05),
              ("mu_tau_split", split, 2.0, 2.0),
          ]
          for name, logits, tcm, tg in cases:
              action = o.evaluate_independent_collision_action(
                  grid=grid,
                  pair_cloglog=o.pair_logits_to_cloglog(logits),
                  temperature_cm_mev=tcm,
                  temperature_gamma_mev=tg,
              )
              cp_abs = max(
                  float(np.max(np.abs(action.total[2*i] - action.total[2*i+1])))
                  for i in range(3)
              )
              total_abs = float(np.max(np.abs(action.total)))
              total_l1 = float(np.sum(np.abs(action.total), dtype=np.float64))
              print(name)
              print("  total_max_abs=", format(total_abs, ".17e"))
              print("  total_l1=", format(total_l1, ".17e"))
              print("  cp_abs=", format(cp_abs, ".17e"))
              print("  cp_relative=", format(float(action.diagnostics["charge_conjugation_residual"]), ".17e"))
              print("  mu_tau_relative=", format(float(action.diagnostics["mu_tau_residual"]), ".17e"))
              print("  first_law=", format(float(action.diagnostics["first_law_residual"]), ".17e"))
              print("  qnu=", format(float(action.diagnostics["event_neutrino_energy_transfer"]), ".17e"))
              print("  qem=", format(float(action.electron_bath_energy_transfer), ".17e"))
          PY
