name: d081r1f0-retained-holdout

on:
  push:
    branches:
      - research/d081r1f0-rust-c-only-jvp-20260904
    paths:
      - docs/audit/D081R1F0_RETAINED_HOLDOUT_EXECUTE_2026-09-04

permissions:
  contents: write
  actions: read

jobs:
  retained-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger and frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 7779e152ee1699baf1023f2a6a8e1a10d8aaf6e0 HEAD
          test "$(git hash-object docs/audit/artifacts/d081r1f0/retained_calibration_amended_receipt.json)" = 2ab3b55b83087b67693955c11b866b200bd373ab
          test "$(python3 -c 'import json; print(json.load(open("docs/audit/artifacts/d081r1f0/retained_calibration_amended_receipt.json"))["classification"])')" = PASS_WITH_AMENDED_RETAINED_CALIBRATION_C_ONLY_JVP_SCOPE_PHYSICAL_COVARIANCE_HOLDOUT_OPEN
          test "$(git hash-object docs/audit/D081R1F0_RUST_C_ONLY_PACKED_RHS_JVP_CONTRACT_2026-09-04.md)" = ac7149fe5d5ec327cdc168d1eba7fe4a68ce3221
          test "$(git hash-object docs/audit/D081R1F0_RETAINED_SYMMETRY_METROLOGY_AMENDMENT_2026-09-04.md)" = 3ea36736e27b88ccd24da95769132d5b42c4500e
          test "$(git hash-object native/rabbit_cpu/tests/fixtures/d081r1/generate_rust_c_only_jvp_oracle.py)" = d8366b5386a7f1744fdb9729dba710712cd37eb4
          test "$(git hash-object native/rabbit_cpu/src/f10_packed_rhs_jvp_retained_holdout_tests.rs)" = 4c22df0580062b8a51a614e5ae16109b84c10c67
          test "$(git hash-object native/rabbit_cpu/src/lib.rs)" = ff9c8045172be8ba70b9004b5ca8428568b03f50
          test "$(git hash-object scripts/audit/d081r1f0_symbolic_symmetry_audit.py)" = f908d9b734044532c8a6e7946949a2f58b93a4c7
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object scripts/audit/_d079_tangent_primitives.py)" = 668f3fab76ffc3ad7f29335a79fcd5daf47d429e
          test "$(git hash-object scripts/audit/_d079_collision_jvp.py)" = 591a64702c58a2de265fb88636f186e2d1b7e019
          test "$(git hash-object scripts/audit/_d079_rhs_jvp.py)" = 6bcff2bc5627c0af0ad4df61c908d09e62ffaba5
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          grep -Fx 'mod f10_packed_rhs_jvp_retained_holdout_tests;' native/rabbit_cpu/src/lib.rs
          test ! -e docs/audit/artifacts/d081r1f0/retained_holdout_receipt.json
          test ! -e docs/audit/artifacts/d081r1f0/symbolic_symmetry_audit_receipt.json
          git diff --quiet

      - name: Recover exact retained state and runtimes
        shell: bash
        run: |
          set -euo pipefail
          HISTORICAL='78f5b091bd8de99bd8d0b1eddd8a0b7978f5da2b'
          STATE_PATH='.agent-harness/runs/run-20260805-f10-v3-campaign/v3a_r2/domain/state_1200.npz'
          git show "${HISTORICAL}:${STATE_PATH}" > /tmp/d081r1f0_state_1200.npz
          echo 'c0ad51adbd34d4fb8408f566c7bc573ca3d5bbd8c1d1f5d89f50df2e6b5d3380  /tmp/d081r1f0_state_1200.npz' | sha256sum -c -
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/d081r1f0-holdout-venv
          /tmp/d081r1f0-holdout-venv/bin/python -m pip install \
            --disable-pip-version-check \
            numpy==2.4.4 scipy==1.17.1 sympy==1.14.0 mpmath==1.3.0
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"

      - name: Recover exact offline Rust vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9838506413/zip > /tmp/vendor.zip
          echo '391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          vendor_dir="$(find /tmp/vendor-outer -type d -name vendor -print -quit)"
          if [[ -z "${vendor_dir}" ]]; then
            archive="$(find /tmp/vendor-outer -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' -o -name '*.zip' \) -print -quit)"
            case "${archive}" in
              *.tar.gz|*.tgz) tar -xzf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar.xz) tar -xJf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar) tar -xf "${archive}" -C /tmp/vendor-expanded ;;
              *.zip) unzip -q "${archive}" -d /tmp/vendor-expanded ;;
              *) echo 'no supported vendor archive' >&2; exit 1 ;;
            esac
            vendor_dir="$(find /tmp/vendor-expanded -type d -name vendor -print -quit)"
          fi
          test -n "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r0"\n[source.d081r0]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml

      - name: Run auxiliary SymPy mpmath audit and optional tool probes
        shell: bash
        run: |
          set -euo pipefail
          PY=/tmp/d081r1f0-holdout-venv/bin/python
          "$PY" scripts/audit/d081r1f0_symbolic_symmetry_audit.py \
            --output /tmp/d081r1f0-symbolic-audit.json \
            | tee /tmp/d081r1f0-symbolic-audit.log
          test "$("$PY" -c 'import json; print(json.load(open("/tmp/d081r1f0-symbolic-audit.json"))["classification"])')" = PASS_AUXILIARY_SYMPY_MPMATH_AUDIT

      - name: Generate unseen retained holdout and order-eight fixtures
        shell: bash
        run: |
          set -euo pipefail
          PY=/tmp/d081r1f0-holdout-venv/bin/python
          GEN=native/rabbit_cpu/tests/fixtures/d081r1/generate_rust_c_only_jvp_oracle.py
          "$PY" -m py_compile "$GEN"
          "$PY" "$GEN" --case retained-holdout \
            --retained /tmp/d081r1f0_state_1200.npz \
            --output /tmp/retained-holdout-a.json
          "$PY" "$GEN" --case retained-holdout \
            --retained /tmp/d081r1f0_state_1200.npz \
            --output /tmp/retained-holdout-b.json
          cmp /tmp/retained-holdout-a.json /tmp/retained-holdout-b.json
          test "$("$PY" -c 'import json; print(json.load(open("/tmp/retained-holdout-a.json"))["case"])')" = retained-holdout
          sha256sum /tmp/retained-holdout-a.json /tmp/retained-holdout-b.json
          "$PY" "$GEN" --case order8 --output /tmp/order8.json

      - name: Format and verify the static source substrate
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          target='native/rabbit_cpu/src/f10_packed_rhs_jvp_retained_holdout_tests.rs'
          cargo +1.94.1 fmt --all
          mapfile -t changed < <(git -C ../.. diff --name-only)
          printf 'format_changed=%s\n' "${changed[*]-}"
          test "${#changed[@]}" -le 1
          if [[ "${#changed[@]}" -eq 1 ]]; then
            test "${changed[0]}" = "${target}"
          fi
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 metadata --locked --offline --format-version 1 >/tmp/d081r1f0-holdout-metadata.json
          cargo +1.94.1 check --release --locked --offline

      - name: Execute the preregistered holdout and regressions
        shell: bash
        working-directory: native/rabbit_cpu
        env:
          D081R1F0_RETAINED_HOLDOUT_FIXTURE: /tmp/retained-holdout-a.json
          D081R1F0_RETAINED_HOLDOUT_RECEIPT: ${{ github.workspace }}/docs/audit/artifacts/d081r1f0/retained_holdout_receipt.json
          D081R1F0_ORDER8_FIXTURE: /tmp/order8.json
        run: |
          set -euo pipefail
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_jvp_retained_holdout_tests::retained_state1200_holdout_and_mu_tau_covariance \
            -- --ignored --exact --nocapture 2>&1 | tee /tmp/d081r1f0-retained-holdout.log
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_jvp_order8_tests:: -- --nocapture
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_jvp_tests::zero_c_direction_is_bitwise_zero_without_changing_the_base_rhs \
            -- --exact --nocapture
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_preflight_tests::tests -- --nocapture
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_tests::tests -- --nocapture
          cargo +1.94.1 clippy --all-targets --all-features \
            --locked --offline -- -D warnings

      - name: Publish durable holdout and symbolic receipts
        shell: bash
        env:
          HOLDOUT_RECEIPT: docs/audit/artifacts/d081r1f0/retained_holdout_receipt.json
          SYMBOLIC_RECEIPT: docs/audit/artifacts/d081r1f0/symbolic_symmetry_audit_receipt.json
          TESTED_SOURCE: native/rabbit_cpu/src/f10_packed_rhs_jvp_retained_holdout_tests.rs
          WORKFLOW_PATH: .github/workflows/d081r1f0_retained_holdout.yml
        run: |
          set -euo pipefail
          PY=/tmp/d081r1f0-holdout-venv/bin/python
          mkdir -p "$(dirname "${HOLDOUT_RECEIPT}")"
          cp /tmp/d081r1f0-symbolic-audit.json "${SYMBOLIC_RECEIPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TESTED_SOURCE}"
          export TESTED_SOURCE_TREE_WITHOUT_RECEIPTS="$(git write-tree)"
          export WORKFLOW_BLOB="$(git hash-object "${WORKFLOW_PATH}")"
          "$PY" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          holdout = Path(os.environ['HOLDOUT_RECEIPT'])
          symbolic = Path(os.environ['SYMBOLIC_RECEIPT'])
          fixture = Path('/tmp/retained-holdout-a.json')
          payload = json.loads(holdout.read_text(encoding='utf-8'))
          if payload['classification'] != 'PASS_WITH_RETAINED_STATE1200_C_ONLY_JVP_HOLDOUT_AND_MU_TAU_COVARIANCE_SCOPE':
              raise SystemExit(f"unexpected holdout classification: {payload['classification']}")
          payload.update({
              'trigger_head': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_blob': os.environ['WORKFLOW_BLOB'],
              'tested_source_tree_without_receipts': os.environ['TESTED_SOURCE_TREE_WITHOUT_RECEIPTS'],
              'pre_output_test_blob': '4c22df0580062b8a51a614e5ae16109b84c10c67',
              'module_registry_blob': 'ff9c8045172be8ba70b9004b5ca8428568b03f50',
              'calibration_receipt_blob': '2ab3b55b83087b67693955c11b866b200bd373ab',
              'contract_blob': 'ac7149fe5d5ec327cdc168d1eba7fe4a68ce3221',
              'amendment_blob': '3ea36736e27b88ccd24da95769132d5b42c4500e',
              'generator_blob': 'd8366b5386a7f1744fdb9729dba710712cd37eb4',
              'holdout_fixture_sha256': hashlib.sha256(fixture.read_bytes()).hexdigest(),
              'holdout_test_log_sha256': hashlib.sha256(Path('/tmp/d081r1f0-retained-holdout.log').read_bytes()).hexdigest(),
              'symbolic_receipt_sha256': hashlib.sha256(symbolic.read_bytes()).hexdigest(),
              'holdout_unblinded_after_precommit': True,
              'runtime': {
                  'python': '3.12.3',
                  'numpy': '2.4.4',
                  'scipy': '1.17.1',
                  'sympy': '1.14.0',
                  'mpmath': '1.3.0',
                  'rust': '1.94.1',
                  'offline_vendor_packages': 174,
              },
          })
          holdout.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          symbolic_payload = json.loads(symbolic.read_text(encoding='utf-8'))
          symbolic_payload['ci'] = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'trigger_sha': os.environ['GITHUB_SHA'],
          }
          symbolic.write_text(
              json.dumps(symbolic_payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git add "${HOLDOUT_RECEIPT}" "${SYMBOLIC_RECEIPT}"
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -ge 2
          test "${#staged[@]}" -le 3
          for path in "${staged[@]}"; do
            case "${path}" in
              "${HOLDOUT_RECEIPT}"|"${SYMBOLIC_RECEIPT}"|"${TESTED_SOURCE}") ;;
              *) echo "unexpected staged path: ${path}" >&2; exit 1 ;;
            esac
          done
          git commit -m 'test(d081r1f0): publish retained JVP holdout receipts'
          git push origin HEAD:research/d081r1f0-rust-c-only-jvp-20260904
