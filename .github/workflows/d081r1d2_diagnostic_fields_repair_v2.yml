name: d081r1d2-diagnostic-fields-repair-v2

on:
  push:
    branches:
      - research/d081r1d2-self-action-20260903

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d2-self-action-20260903
          fetch-depth: 2

      - name: Install exact formatter
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt

      - name: Bind diagnostic receipts to the frozen oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/rabbit_cpu/src/f10_self_action_tests.rs")
          text = path.read_text(encoding="utf-8")
          needle = (
              "            assert_moment_close(\n"
              "                result.event_energy_residual,\n"
              "                bits(&case[\"diagnostics\"][\"self_event_energy_residual\"]),\n"
              "                result.event_energy_absolute.max(1.0),\n"
              "            );\n"
          )
          insertion = (
              "            assert_eq!(\n"
              "                result.whole_reaction_domain_rejections,\n"
              "                usize::try_from(\n"
              "                    case[\"whole_reaction_domain_rejections\"]\n"
              "                        .as_u64()\n"
              "                        .expect(\"whole-reaction domain rejection count\"),\n"
              "                )\n"
              "                .expect(\"rejection count fits usize\"),\n"
              "            );\n"
              "            assert_eq!(\n"
              "                result.matrix_roundoff_corrections,\n"
              "                usize::try_from(\n"
              "                    case[\"matrix_roundoff_corrections\"]\n"
              "                        .as_u64()\n"
              "                        .expect(\"matrix roundoff correction count\"),\n"
              "                )\n"
              "                .expect(\"correction count fits usize\"),\n"
              "            );\n"
              "            let expected_largest_correction =\n"
              "                bits(&case[\"largest_matrix_roundoff_correction_bits\"]);\n"
              "            assert_moment_close(\n"
              "                result.largest_matrix_roundoff_correction,\n"
              "                expected_largest_correction,\n"
              "                result\n"
              "                    .largest_matrix_roundoff_correction\n"
              "                    .abs()\n"
              "                    .max(expected_largest_correction.abs())\n"
              "                    .max(f64::MIN_POSITIVE),\n"
              "            );\n"
          )
          if text.count(needle) != 1:
              raise SystemExit(f"expected exactly one insertion point, found {text.count(needle)}")
          path.write_text(text.replace(needle, needle + insertion), encoding="utf-8")
          PY
          (cd native/rabbit_cpu && cargo +1.94.1 fmt --all)
          rm .github/workflows/d081r1d2_diagnostic_fields_repair.yml
          rm .github/workflows/d081r1d2_diagnostic_fields_repair_v2.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/d081r1d2_diagnostic_fields_repair.yml\n.github/workflows/d081r1d2_diagnostic_fields_repair_v2.yml\nnative/rabbit_cpu/src/f10_self_action_tests.rs'

      - name: Commit bounded diagnostic admission repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(d081r1d2): bind self-action diagnostics to oracle"
          git push origin HEAD:research/d081r1d2-self-action-20260903
