name: d081r0-ssot-sync

on:
  push:
    branches:
      - research/d081r0-rust-offline-semantic-admission-20260902
    paths:
      - .github/workflows/d081r0_ssot_sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: research/d081r0-rust-offline-semantic-admission-20260902

      - name: Install harness dependency
        run: python3 -m pip install --disable-pip-version-check "pytest>=7.0"

      - name: Record D-081 in controlling ledgers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          frozen_path = Path('.agent-harness/context/FROZEN_DECISIONS.md')
          frozen = frozen_path.read_text(encoding='utf-8')
          if '| D-081 |' in frozen:
              raise SystemExit('D-081 already exists in FROZEN_DECISIONS.md')
          frozen_row = """| D-081 | **Adopt the Rust-first continuation of the D-077 numerical-equivalence lane and close its prerequisite environment/oracle inventory as D-081R0.** Python D-080F remains the independent source-input-output oracle; Rust becomes the production and performance authority only after a separate static semantic-admission gate. The exact Rust 1.94.1 and frozen `Cargo.lock` offline environment is admitted for bounded native development. The legacy two-bank `IsotropicBoltzmannFlrwSystem` is retained but is not the exact 182-state target; D-081R1 must add a separate three-flavour complementary-log-log `F10ComparatorSystem`. | `docs/audit/BD634_D081R0_RUST_FIRST_TRANSITION_CLOSEOUT_2026-09-02.md`; exact offline workflow `33609470252` and artifact `9838506413`; exact source/input/output workflow `33609886995` and artifact `9838533536`; machine receipts under `docs/audit/artifacts/d081r0/`; design and implementation plan under `docs/superpowers/`. | Records, environment closure, oracle freeze, semantic inventory, and implementation planning only. No production physics or solver source changed; no Rust/Python parity, trajectory, performance, endpoint, `N_eff`, public-production, publication, or gate-grade authority is granted. `G-F10-INDEPENDENT-FLRW` remains FAIL. | Reopen on any mismatch in the frozen Rust toolchain/lock/vendor identities, oracle source/input/output hashes, state ordering/chart/grid, flavour dimensionality, collision catalogue, support/failure semantics, or if Rust performance output is produced before D-081R1 static semantic admission. Matrix-free/JFNK assets remain quarantined unless a later Rust dense-Jacobian experiment is correct but not cost-effective. |"""
          frozen_path.write_text(frozen.rstrip('\n') + '\n' + frozen_row + '\n', encoding='utf-8')

          log_path = Path('docs/harness/DECISION_LOG.md')
          lines = log_path.read_text(encoding='utf-8').splitlines()
          if any('Record D-081:' in line for line in lines):
              raise SystemExit('D-081 already exists in DECISION_LOG.md')
          separator = next(i for i, line in enumerate(lines) if line.startswith('|---'))
          row = """| 2026-09-02 | Record D-081: move the F10 equivalence programme to a Rust-first production lane after D-080F, while retaining Python as the independent scientific oracle. | D-081R0 closes the exact Rust 1.94.1 and `Cargo.lock` offline environment, freezes the D-080F primal source, retained input, base RHS, full Jacobian and directions, and records that the existing folded two-bank Rust system cannot represent the full three-flavour 182-state target. | Rejected: adapting the two-bank system and calling it exact; changing chart or grid; folding `mu/tau`; calling Python from production Rust; running solver/performance experiments before static parity; merging unrelated generic/BASS vendors; opening JFNK before an explicit dense Rust experiment is shown correct but uneconomic. | No scientific gate moves. The next admissible implementation is the separate D-081R1 `F10ComparatorSystem` static semantic-admission plan; only a later D-081R2/R3 may connect the admitted system to existing `OdeSystem`/diffsol and measure performance. |"""
          lines.insert(separator + 1, row)
          log_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Rebuild generated context projections
        run: |
          set -euo pipefail
          python3 .agent-harness/scripts/build_status_board.py
          python3 .agent-harness/scripts/build_context_pack.py

      - name: Preliminary validation
        run: |
          set -euo pipefail
          python3 .agent-harness/scripts/validate_harness.py
          python3 -m pytest .agent-harness/tests -q
          python3 .agent-harness/scripts/check_ssot_consistency.py
          git diff --check

      - name: Commit records and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^)"
          rm .github/workflows/d081r0_ssot_sync.yml
          expected="$(cat <<'EOF'
          .agent-harness/context/CONTEXT_INDEX.json
          .agent-harness/context/FROZEN_DECISIONS.md
          .agent-harness/generated/CONTEXT_PACK.md
          docs/harness/DECISION_LOG.md
          EOF
          )"
          actual="$(git diff --name-only "$base" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected final changed paths.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          git diff --check "$base"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "records(d081): register Rust-first equivalence lane"

      - name: Final exact-tree verification and push
        shell: bash
        run: |
          set -euo pipefail
          python3 .agent-harness/scripts/validate_harness.py
          python3 -m pytest .agent-harness/tests -q
          python3 .agent-harness/scripts/check_ssot_consistency.py
          python3 .agent-harness/scripts/build_status_board.py
          python3 .agent-harness/scripts/build_context_pack.py
          git diff --exit-code -- .agent-harness/generated/STATUS_BOARD.md
          git diff --exit-code -- ':!.agent-harness/generated/CONTEXT_PACK.md' ':!.agent-harness/context/CONTEXT_INDEX.json'
          git show HEAD:.agent-harness/generated/CONTEXT_PACK.md \
            | diff <(sed '4d' -) <(sed '4d' .agent-harness/generated/CONTEXT_PACK.md)
          git checkout -- .agent-harness/context/CONTEXT_INDEX.json .agent-harness/generated/CONTEXT_PACK.md
          test -z "$(git status --porcelain)"
          git push origin HEAD:research/d081r0-rust-offline-semantic-admission-20260902
