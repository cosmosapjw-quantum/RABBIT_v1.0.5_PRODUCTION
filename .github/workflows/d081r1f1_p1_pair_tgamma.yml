name: d081r1f1-p1-pair-and-elastic-prefactors
on:
  push:
    branches: [agent/rabbit-p1-elastic-rate-tangent-20260905-gpt6-r1]
    paths:
      - .github/workflows/d081r1f1_p1_pair_tgamma.yml
      - native/rabbit_cpu/src/f10_elastic_prefactor_tangent.rs
      - native/rabbit_cpu/src/f10_elastic_prefactor_tests.rs
      - native/rabbit_cpu/src/lib.rs
permissions:
  contents: read
  actions: read
jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src:.
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable pair, primitive and behavioral RED authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'agent/rabbit-p1-elastic-rate-tangent-20260905-gpt6-r1'
          git merge-base --is-ancestor 381b05ba269a5db791f80845fd06eb60f9e0d09b HEAD
          test "$(git hash-object native/rabbit_cpu/src/f10_elastic_prefactor_tests.rs)" = "$(git rev-parse 381b05ba269a5db791f80845fd06eb60f9e0d09b:native/rabbit_cpu/src/f10_elastic_prefactor_tests.rs)"
          test "$(git hash-object native/rabbit_cpu/src/f10_electron_action/tgamma_jvp.rs)" = 6a6348d69db951650b3dafd92a651dab4801d578
          test "$(git hash-object native/rabbit_cpu/src/f10_electron_action_tgamma_jvp_red_tests.rs)" = aa1628dfb38d0d26bea699e971271083c907337e
          test "$(git hash-object native/rabbit_cpu/src/f10_kernel_primitives.rs)" = 03b0427820b5802540f6217391fe58ffff437ffc
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_kinematics.rs)" = 88717ed6206cae78599e805de79cf1b3f046443a
          test "$(git hash-object scripts/audit/_d080b_tgamma_collision.py)" = 78489c43f3046db09d8ba2d96070124ed7b0aa91
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test -z "$(git status --porcelain)"
          echo "TESTED_HEAD=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Exact Rust and lock-derived offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = 'rustc 1.94.1 (e408947bf 2026-03-25)'
          test "$(cargo +1.94.1 --version)" = 'cargo 1.94.1 (29ea6fb6a 2026-03-24)'
          mkdir -p /tmp/pair-vendor-outer /tmp/pair-vendor
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9932329475/zip > /tmp/pair-vendor.zip
          echo '2fa7b64275f5ec435b8dab3b9876dce79227bb1d12a5da552f67059e6a240640  /tmp/pair-vendor.zip' | sha256sum -c -
          unzip -q /tmp/pair-vendor.zip -d /tmp/pair-vendor-outer
          echo '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f  /tmp/pair-vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz' | sha256sum -c -
          tar -xzf /tmp/pair-vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz -C /tmp/pair-vendor
          test "$(find /tmp/pair-vendor/vendor -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          test ! -e native/rabbit_cpu/.cargo/config.toml
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="pinned"\n[source.pinned]\ndirectory="/tmp/pair-vendor/vendor"\n[net]\noffline=true\n' > native/rabbit_cpu/.cargo/config.toml
      - name: Deterministic pair and primitive references plus exact product rules
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/pair-python
          /tmp/pair-python/bin/pip install --only-binary=:all: numpy==2.4.4 scipy==1.17.1 mpmath==1.3.0 sympy==1.14.0
          for suffix in a b; do
            /tmp/pair-python/bin/python scripts/audit/d081r1f1_p1_pair_tgamma_oracle.py --output /tmp/pair-${suffix}.json
            /tmp/pair-python/bin/python scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py --output /tmp/p0a-${suffix}.json
            /tmp/pair-python/bin/python scripts/audit/d081r1f1_p0b_tgamma_kinematics_oracle.py --output /tmp/p0b-${suffix}.json
          done
          for name in pair p0a p0b; do cmp /tmp/${name}-a.json /tmp/${name}-b.json; sha256sum /tmp/${name}-a.json; done
          /tmp/pair-python/bin/python - <<'PY'
          import sympy as s
          T=s.symbols('T', positive=True)
          C,K,a,b,c,m=s.symbols('C K a b c m')
          w,p,r,e=[s.Function(n)(T) for n in ('w','p','r','e')]
          dw=C*(s.diff(w,T)*p**2*r/e+2*w*p*s.diff(p,T)*r/e+w*p**2*s.diff(r,T)/e-w*p**2*r*s.diff(e,T)/e**2)
          d12,d34,d14,d23,d13=[s.Function(n)(T) for n in ('d12','d34','d14','d23','d13')]
          dm=K*(a*(s.diff(d12,T)*d34+d12*s.diff(d34,T))+b*(s.diff(d14,T)*d23+d14*s.diff(d23,T))-c*m**2*s.diff(d13,T))
          residuals=[s.simplify(s.diff(C*w*p**2*r/e,T)-dw),s.simplify(s.diff(K*(a*d12*d34+b*d14*d23-c*m**2*d13),T)-dm)]
          assert residuals == [0,0], residuals
          print('SYMPY_EXACT_ELASTIC_PRODUCT_RULES', residuals)
          PY
      - name: Elastic GREEN with unchanged pair and primitive regressions
        shell: bash
        working-directory: native/rabbit_cpu
        env:
          D081R1F1_P1_PAIR_ORACLE: /tmp/pair-a.json
          D081R1F1_P0A_ORACLE: /tmp/p0a-a.json
          D081R1F1_P0B_ORACLE: /tmp/p0b-a.json
        run: |
          set -euo pipefail
          cargo +1.94.1 metadata --locked --offline --format-version 1 > /tmp/elastic-metadata.json
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --offline f10_elastic_prefactor_tests -- --nocapture 2>&1 | tee /tmp/elastic-green.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored' /tmp/elastic-green.log
          cargo +1.94.1 test --locked --offline f10_electron_action_tgamma_jvp_red_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_tgamma_tangent_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_tgamma_kinematic_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_tgamma_adversarial_repair_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_tgamma_adversarial_repair_tests::direct_python_d080a_basis_and_kinematic_arrays_match -- --ignored --exact --nocapture
          cargo +1.94.1 test --locked --offline f10_electron_action_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_packed_rhs_jvp_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_packed_rhs_preflight_tests::tests -- --nocapture
          cargo +1.94.1 clippy --all-targets --all-features --locked --offline -- -D warnings
          rm .cargo/config.toml
          rmdir .cargo
          git -C ../.. diff --exit-code
          git -C ../.. diff --cached --exit-code
          test -z "$(git -C ../.. status --porcelain)"
          echo 'PASS_ELASTIC_MEASURE_MATRIX_TANGENT_PRIMITIVES_FULL_ELASTIC_ACTION_OPEN'
          echo "Elastic prefactor replay PASS at $GITHUB_SHA; full elastic action remains open." >> "$GITHUB_STEP_SUMMARY"
