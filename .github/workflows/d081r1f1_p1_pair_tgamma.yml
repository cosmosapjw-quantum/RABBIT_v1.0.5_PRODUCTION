name: d081r1f1-p1-pair-tgamma
on:
  push:
    branches: [research/d081r1f1-p1-collision-tgamma-jvp-green-20260905-r1]
    paths:
      - .github/workflows/d081r1f1_p1_pair_tgamma.yml
      - native/rabbit_cpu/src/f10_electron_action/tgamma_jvp.rs
      - native/rabbit_cpu/src/f10_electron_action_tgamma_jvp_red_tests.rs
      - native/rabbit_cpu/src/f10_electron_action.rs
      - scripts/audit/d081r1f1_p1_pair_tgamma_oracle.py
permissions:
  contents: read
  actions: read
jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: src:.
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the committed pair implementation and prospective tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 47a8a23fffaa216ed810f4908ea29a53aba11de1 HEAD
          test "$(git hash-object native/rabbit_cpu/src/f10_electron_action/tgamma_jvp.rs)" = 6a6348d69db951650b3dafd92a651dab4801d578
          test "$(git hash-object native/rabbit_cpu/src/f10_electron_action_tgamma_jvp_red_tests.rs)" = aa1628dfb38d0d26bea699e971271083c907337e
          test "$(git hash-object native/rabbit_cpu/src/f10_electron_action.rs)" = 45ce4f38d6db0bbf2620da493015fdc3e381e263
          test "$(git hash-object scripts/audit/d081r1f1_p1_pair_tgamma_oracle.py)" = 249a536f851beca59cde492277a8baf6ecc63760
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object scripts/audit/_d080b_tgamma_collision.py)" = 78489c43f3046db09d8ba2d96070124ed7b0aa91
          test "$(git hash-object scripts/audit/_d080_tgamma_primitives.py)" = c585d5865fd68a90a04a76ab540b8437fba8cfce
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          grep -Fx 'pub(crate) mod tgamma_jvp;' native/rabbit_cpu/src/f10_electron_action.rs
          test -z "$(git status --porcelain)"
          echo "PAIR_REPLAY_HEAD=$(git rev-parse HEAD)"
          echo "PAIR_REPLAY_TREE=$(git rev-parse HEAD^{tree})"
      - name: Exact Rust and lock-derived offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = 'rustc 1.94.1 (e408947bf 2026-03-25)'
          test "$(cargo +1.94.1 --version)" = 'cargo 1.94.1 (29ea6fb6a 2026-03-24)'
          mkdir -p /tmp/pair-vendor-outer /tmp/pair-vendor
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9932329475/zip > /tmp/pair-vendor.zip
          echo '2fa7b64275f5ec435b8dab3b9876dce79227bb1d12a5da552f67059e6a240640  /tmp/pair-vendor.zip' | sha256sum -c -
          unzip -q /tmp/pair-vendor.zip -d /tmp/pair-vendor-outer
          echo '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f  /tmp/pair-vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz' | sha256sum -c -
          tar -xzf /tmp/pair-vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz -C /tmp/pair-vendor
          test "$(find /tmp/pair-vendor/vendor -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          test ! -e native/rabbit_cpu/.cargo/config.toml
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="pinned"\n[source.pinned]\ndirectory="/tmp/pair-vendor/vendor"\n[net]\noffline=true\n' > native/rabbit_cpu/.cargo/config.toml
      - name: Deterministic same-capsule D080B and 100-digit Pauli references
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/pair-python
          /tmp/pair-python/bin/pip install --only-binary=:all: numpy==2.4.4 scipy==1.17.1 mpmath==1.3.0
          for suffix in a b; do
            /tmp/pair-python/bin/python scripts/audit/d081r1f1_p1_pair_tgamma_oracle.py --output /tmp/pair-${suffix}.json
          done
          cmp /tmp/pair-a.json /tmp/pair-b.json
          sha256sum /tmp/pair-a.json
      - name: Clean pair GREEN and inherited gates without source mutation
        shell: bash
        working-directory: native/rabbit_cpu
        env:
          D081R1F1_P1_PAIR_ORACLE: /tmp/pair-a.json
        run: |
          set -euo pipefail
          cargo +1.94.1 metadata --locked --offline --format-version 1 > /tmp/pair-replay-metadata.json
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --offline f10_electron_action_tgamma_jvp_red_tests -- --nocapture 2>&1 | tee /tmp/pair-green.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored' /tmp/pair-green.log
          cargo +1.94.1 test --locked --offline f10_electron_action_tests -- --nocapture 2>&1 | tee /tmp/pair-primal.log
          grep -F 'test result: ok. 4 passed; 0 failed' /tmp/pair-primal.log
          cargo +1.94.1 test --locked --offline f10_packed_rhs_jvp_tests -- --nocapture 2>&1 | tee /tmp/pair-c-jvp.log
          grep -F 'test result: ok. 1 passed; 0 failed' /tmp/pair-c-jvp.log
          cargo +1.94.1 test --locked --offline f10_packed_rhs_preflight_tests::tests -- --nocapture 2>&1 | tee /tmp/pair-preflight.log
          grep -F 'test result: ok. 3 passed; 0 failed' /tmp/pair-preflight.log
          cargo +1.94.1 clippy --all-targets --all-features --locked --offline -- -D warnings
          rm .cargo/config.toml
          rmdir .cargo
          git -C ../.. diff --exit-code
          git -C ../.. diff --cached --exit-code
          test -z "$(git -C ../.. status --porcelain)"
          echo 'PASS_CLEAN_PAIR_ONLY_ORDER8_THERMAL_JVP_FULL_ELECTRON_JVP_OPEN'
          printf 'Pair-only order-eight clean replay PASS at %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
