name: d081r1d4-scalar-diagnostic

on:
  push:
    branches:
      - research/d081r1d4-combined-action-20260903
    paths:
      - .github/workflows/d081r1d4_scalar_diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d4-combined-action-20260903
          fetch-depth: 0

      - name: Verify exact D3 predecessor and frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a604cc7af832c799687d29ba05765972f7ba0c9d HEAD
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/tests/fixtures/d081r1/full_collision_action_case.json)" = c94d2e72a1f8300b7c20c9c793417a5c4a5fa302
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014

      - name: Label every scalar comparison without changing the branch source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/rabbit_cpu/src/f10_combined_action_tests.rs")
          text = path.read_text(encoding="utf-8")

          old = "use serde_json::Value;\n"
          new = old + "use std::sync::atomic::{AtomicUsize, Ordering};\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected serde import count")
          text = text.replace(old, new)

          old = '''fn assert_scalar_close(actual: f64, expected: f64, scale: f64, relative_tolerance: f64) {
    let absolute_floor = 262_144.0 * f64::EPSILON * scale.max(f64::MIN_POSITIVE);
    let allowed = absolute_floor + relative_tolerance * actual.abs().max(expected.abs());
    assert!(
        (actual - expected).abs() <= allowed,
        "scalar mismatch: actual={actual:.17e}, expected={expected:.17e}, allowed={allowed:.17e}"
    );
}
'''
          new = '''fn assert_scalar_close(actual: f64, expected: f64, scale: f64, relative_tolerance: f64) {
    static SCALAR_INDEX: AtomicUsize = AtomicUsize::new(0);
    let index = SCALAR_INDEX.fetch_add(1, Ordering::SeqCst);
    let absolute_floor = 262_144.0 * f64::EPSILON * scale.max(f64::MIN_POSITIVE);
    let allowed = absolute_floor + relative_tolerance * actual.abs().max(expected.abs());
    eprintln!(
        "D081R1D4_SCALAR index={index} actual={actual:.17e} expected={expected:.17e} difference={:.17e} allowed={allowed:.17e}",
        (actual - expected).abs()
    );
}
'''
          if text.count(old) != 1:
              raise SystemExit("unexpected scalar helper body")
          text = text.replace(old, new)

          old = '''        for case in value["cases"].as_array().expect("fixture cases") {
            let result = assemble_combined_action(
'''
          new = '''        for case in value["cases"].as_array().expect("fixture cases") {
            eprintln!("D081R1D4_CASE {}", case["name"].as_str().unwrap());
            let result = assemble_combined_action(
'''
          if text.count(old) != 1:
              raise SystemExit("unexpected combined parity loop")
          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt

      - name: Recover exact offline vendor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9838506413/zip > /tmp/vendor.zip
          echo "391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a  /tmp/vendor.zip" | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          vendor_dir="$(find /tmp/vendor-outer -type d -name vendor -print -quit)"
          if [[ -z "${vendor_dir}" ]]; then
            archive="$(find /tmp/vendor-outer -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' -o -name '*.zip' \) -print -quit)"
            case "${archive}" in
              *.tar.gz|*.tgz) tar -xzf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar.xz) tar -xJf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar) tar -xf "${archive}" -C /tmp/vendor-expanded ;;
              *.zip) unzip -q "${archive}" -d /tmp/vendor-expanded ;;
            esac
            vendor_dir="$(find /tmp/vendor-expanded -type d -name vendor -print -quit)"
          fi
          test -n "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r0"\n[source.d081r0]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml

      - name: Emit all combined scalar comparisons
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          cargo +1.94.1 fmt --all
          cargo +1.94.1 test --locked --offline \
            f10_combined_action_tests::tests::combined_action_matches_every_frozen_python_case \
            -- --nocapture
