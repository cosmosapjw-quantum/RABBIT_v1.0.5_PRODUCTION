name: d081r1d4-track-caller-repair

on:
  push:
    branches:
      - research/d081r1d4-combined-action-20260903
    paths:
      - .github/workflows/d081r1d4_scalar_diagnostic.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d4-combined-action-20260903
          fetch-depth: 2

      - name: Preserve the scalar call site in failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/rabbit_cpu/src/f10_combined_action_tests.rs")
          text = path.read_text(encoding="utf-8")
          old = "fn assert_scalar_close(actual: f64, expected: f64, scale: f64, relative_tolerance: f64) {\n"
          new = "#[track_caller]\n" + old
          if text.count(old) != 1:
              raise SystemExit(f"unexpected scalar helper count: {text.count(old)}")
          if "#[track_caller]\n" + old in text:
              raise SystemExit("track_caller already present")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --name-only)" = "native/rabbit_cpu/src/f10_combined_action_tests.rs"

      - name: Commit bounded test-diagnostic repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/rabbit_cpu/src/f10_combined_action_tests.rs
          git diff --cached --check
          git commit -m "test(d081r1d4): preserve scalar diagnostic call sites"
          git push origin HEAD:research/d081r1d4-combined-action-20260903
