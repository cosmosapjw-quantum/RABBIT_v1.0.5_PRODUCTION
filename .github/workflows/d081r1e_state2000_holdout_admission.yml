name: d081r1e-state2000-holdout-admission

on:
  push:
    branches:
      - research/d081r1e-holdout-metrology-20260904
    paths-ignore:
      - docs/audit/D081R1E_STATE2000_HOLDOUT_RECEIPT_2026-09-04.json

permissions:
  contents: write
  actions: read

jobs:
  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1e-holdout-metrology-20260904
          fetch-depth: 0

      - name: Verify prospective contract and recover unseen authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 22240bba2f4c4c02ec2eedd4f131a8fffd3be5e2 HEAD
          test "$(git hash-object docs/audit/D081R1E_HOLDOUT_METROLOGY_CONTRACT_2026-09-04.md)" = 5eee0e3b391d66127754ed71ce3e61592e2cbf43
          test "$(git hash-object native/rabbit_cpu/tests/fixtures/d081r1/generate_state2000_holdout_metrology.py)" = 36fa0397744a25accaa16177e533ae1c2ecccb79
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object scripts/audit/_trajectory_core.py)" = 465a73f0ce40f7149bebdc2d67103f388e2344d9
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          HISTORICAL='78f5b091bd8de99bd8d0b1eddd8a0b7978f5da2b'
          STATE_PATH='.agent-harness/runs/run-20260805-f10-v3-campaign/v3a_r2/domain/state_2000.npz'
          test "$(git rev-parse "${HISTORICAL}:${STATE_PATH}")" = cfb17344ae166c01c2e5bcb14acae0d968e49477
          git show "${HISTORICAL}:${STATE_PATH}" > /tmp/state_2000.npz
          test "$(git hash-object /tmp/state_2000.npz)" = cfb17344ae166c01c2e5bcb14acae0d968e49477
          test "$(stat -c '%s' /tmp/state_2000.npz)" = 2103
          echo '780ad7c1388caec23f02012781717d43ffb85d96d4d501c40c504939e7c9a44d  /tmp/state_2000.npz' | sha256sum -c -

      - name: Install exact Python and Rust tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/d081r1e-holdout-venv
          /tmp/d081r1e-holdout-venv/bin/python -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            numpy==2.4.4 scipy==1.17.1
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"

      - name: Recover exact offline Rust vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9838506413/zip > /tmp/vendor.zip
          echo '391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          vendor_dir="$(find /tmp/vendor-outer -type d -name vendor -print -quit)"
          if [[ -z "${vendor_dir}" ]]; then
            archive="$(find /tmp/vendor-outer -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' -o -name '*.zip' \) -print -quit)"
            case "${archive}" in
              *.tar.gz|*.tgz) tar -xzf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar.xz) tar -xJf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar) tar -xf "${archive}" -C /tmp/vendor-expanded ;;
              *.zip) unzip -q "${archive}" -d /tmp/vendor-expanded ;;
              *) echo 'no supported vendor archive' >&2; exit 1 ;;
            esac
            vendor_dir="$(find /tmp/vendor-expanded -type d -name vendor -print -quit)"
          fi
          test -n "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r0"\n[source.d081r0]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml

      - name: Generate the unseen Python fixture twice
        shell: bash
        run: |
          set -euo pipefail
          PY=/tmp/d081r1e-holdout-venv/bin/python
          GEN=native/rabbit_cpu/tests/fixtures/d081r1/generate_state2000_holdout_metrology.py
          "$PY" "$GEN" --retained /tmp/state_2000.npz --output /tmp/holdout-a.json
          "$PY" "$GEN" --retained /tmp/state_2000.npz --output /tmp/holdout-b.json
          cmp /tmp/holdout-a.json /tmp/holdout-b.json
          sha256sum /tmp/holdout-a.json /tmp/holdout-b.json

      - name: Verify exact static substrate and structural gates
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          cargo +1.94.1 metadata --locked --offline --format-version 1 >/tmp/d081r1e-holdout-metadata.json
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_preflight_tests::tests -- --nocapture
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_tests::tests::retained_oracle_and_control_contracts_are_exact \
            -- --exact --nocapture
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_tests::tests::state_chart_and_passive_elapsed_contract_fail_closed \
            -- --exact --nocapture
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_tests::tests::collision_chart_hubble_and_thermodynamic_mutations_are_killed \
            -- --exact --nocapture
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_tests::tests::mu_tau_swap_covariance_survives_the_full_packed_rhs_map \
            -- --exact --nocapture

      - name: Execute prospectively frozen state-2000 holdout
        shell: bash
        working-directory: native/rabbit_cpu
        env:
          D081R1E_HOLDOUT_FIXTURE: /tmp/holdout-a.json
          D081R1E_HOLDOUT_RECEIPT: ${{ github.workspace }}/docs/audit/D081R1E_STATE2000_HOLDOUT_RECEIPT_2026-09-04.json
        run: |
          set -euo pipefail
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_holdout_tests::tests::state2000_prospective_holdout_admission \
            -- --ignored --exact --nocapture
          cargo +1.94.1 clippy --all-targets --all-features \
            --locked --offline -- -D warnings

      - name: Finalize and publish durable PASS receipt
        shell: bash
        env:
          RECEIPT: docs/audit/D081R1E_STATE2000_HOLDOUT_RECEIPT_2026-09-04.json
        run: |
          set -euo pipefail
          PY=/tmp/d081r1e-holdout-venv/bin/python
          "$PY" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          receipt = Path(os.environ["RECEIPT"])
          fixture = Path("/tmp/holdout-a.json")
          payload = json.loads(receipt.read_text(encoding="utf-8"))
          payload["fixture_sha256"] = hashlib.sha256(fixture.read_bytes()).hexdigest()
          payload["ci"] = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "trigger_sha": os.environ["GITHUB_SHA"],
          }
          receipt.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          test "$("$PY" -c 'import json; print(json.load(open("'"${RECEIPT}"'"))["classification"])')" = PASS_WITH_RETAINED_ORDER60_CONDITIONED_PACKED_RHS_SCOPE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${RECEIPT}"
          test "$(git diff --cached --name-only)" = "${RECEIPT}"
          git commit -m 'test(d081r1e): publish state-2000 holdout PASS receipt'
          git push origin HEAD:research/d081r1e-holdout-metrology-20260904
