name: d081r1d4-test-error-semantics-patch

on:
  push:
    branches:
      - research/d081r1d4-combined-action-20260903
    paths:
      - .github/workflows/d081r1d4_test_error_semantics_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d4-combined-action-20260903
          fetch-depth: 2

      - name: Preserve typed error assertions without requiring value equality
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/rabbit_cpu/src/f10_combined_action_tests.rs")
          text = path.read_text(encoding="utf-8")
          replacements = {
          '''        assert_eq!(
            assemble_combined_action(
                &grid,
                &[0.0; 23],
                temperature_cm,
                temperature_gamma,
                F10CombinedActionConfig::default(),
            ),
            Err(F10CombinedActionError::SelfAction)
        );''': '''        assert!(matches!(
            assemble_combined_action(
                &grid,
                &[0.0; 23],
                temperature_cm,
                temperature_gamma,
                F10CombinedActionConfig::default(),
            ),
            Err(F10CombinedActionError::SelfAction)
        ));''',
          '''        assert_eq!(
            assemble_combined_action(
                &grid,
                &nonfinite,
                temperature_cm,
                temperature_gamma,
                F10CombinedActionConfig::default(),
            ),
            Err(F10CombinedActionError::SelfAction)
        );''': '''        assert!(matches!(
            assemble_combined_action(
                &grid,
                &nonfinite,
                temperature_cm,
                temperature_gamma,
                F10CombinedActionConfig::default(),
            ),
            Err(F10CombinedActionError::SelfAction)
        ));''',
          '''        assert_eq!(
            assemble_combined_action(
                &grid,
                &bit_array(&case["pair_cloglog"]),
                temperature_cm,
                -temperature_gamma,
                F10CombinedActionConfig::default(),
            ),
            Err(F10CombinedActionError::InvalidInput)
        );''': '''        assert!(matches!(
            assemble_combined_action(
                &grid,
                &bit_array(&case["pair_cloglog"]),
                temperature_cm,
                -temperature_gamma,
                F10CombinedActionConfig::default(),
            ),
            Err(F10CombinedActionError::InvalidInput)
        ));''',
          '''        assert_eq!(
            assemble_combined_action(
                &grid,
                &bit_array(&case["pair_cloglog"]),
                temperature_cm,
                temperature_gamma,
                invalid_config,
            ),
            Err(F10CombinedActionError::InvalidConfiguration)
        );''': '''        assert!(matches!(
            assemble_combined_action(
                &grid,
                &bit_array(&case["pair_cloglog"]),
                temperature_cm,
                temperature_gamma,
                invalid_config,
            ),
            Err(F10CombinedActionError::InvalidConfiguration)
        ));''',
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f"unexpected assertion occurrence count: {text.count(before)}")
              text = text.replace(before, after)
          path.write_text(text, encoding="utf-8")
          PY
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          (cd native/rabbit_cpu && cargo +1.94.1 fmt --all)
          rm .github/workflows/d081r1d4_test_error_semantics_patch.yml
          git diff --check

      - name: Commit bounded RED-suite type repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(d081r1d4): assert typed component failures"
          git push origin HEAD:research/d081r1d4-combined-action-20260903
