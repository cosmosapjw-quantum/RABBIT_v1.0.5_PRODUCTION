name: d081r1d3-generate-electron-metrology

on:
  push:
    branches:
      - research/d081r1d3-electron-action-20260903
    paths:
      - .github/workflows/d081r1d3_generate_electron_metrology.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d3-electron-action-20260903
          fetch-depth: 0

      - name: Verify frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 59e21cdf18e34cb5cbcc5ccf08f155f5975f29fb HEAD
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/tests/fixtures/d081r1/full_collision_action_case.json)" = c94d2e72a1f8300b7c20c9c793417a5c4a5fa302

      - name: Generate deterministic electron-only fixture twice
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "numpy==2.4.4" "scipy==1.17.1"
          generator=native/rabbit_cpu/tests/fixtures/d081r1/generate_electron_collision_action_metrology.py
          fixture=native/rabbit_cpu/tests/fixtures/d081r1/electron_collision_action_metrology.json
          python3 "${generator}"
          cp "${fixture}" /tmp/electron-metrology.first.json
          python3 "${generator}"
          cmp /tmp/electron-metrology.first.json "${fixture}"
          python3 -m json.tool "${fixture}" >/dev/null

      - name: Commit frozen component fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture=native/rabbit_cpu/tests/fixtures/d081r1/electron_collision_action_metrology.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${fixture}"
          git diff --cached --check
          git commit -m "test(d081r1d3): freeze electron-action component metrology"
          git push origin HEAD:research/d081r1d3-electron-action-20260903
