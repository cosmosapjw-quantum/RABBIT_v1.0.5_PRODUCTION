name: d080b-branch-signature-repair

on:
  push:
    branches:
      - research/d080b-tgamma-collision-column-20260902
    paths:
      - .github/workflows/d080b_branch_signature_repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: research/d080b-tgamma-collision-column-20260902

      - name: Remove continuous T-gamma bytes from the discrete branch signature
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/audit/_d080b_tgamma_collision.py")
          text = path.read_text(encoding="utf-8")
          old = '''    digest.update(
              f"{grid.order}:{grid.y_max}:{tcm:.17e}:{tg:.17e}:{mass:.17e}".encode()
          )
          '''
          new = '''    # A branch signature describes only discrete path choices.  Including
              # the differentiated continuous value T_gamma would make every nonzero
              # finite-difference perturbation appear to cross a branch by construction.
              digest.update(
                  (
                      f"{grid.order}:{grid.y_max}:{tcm:.17e}:{mass:.17e}:"
                      f"{config.incoming_polar_order}:"
                      f"{config.final_polar_order}:"
                      f"{config.final_azimuth_order}:"
                      f"{config.electron_radial_order}"
                  ).encode()
              )
              '''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one continuous-temperature signature block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/d080b_branch_signature_repair.yml
          git diff --check

      - name: Commit the single root-cause fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          test "$changed" = "scripts/audit/_d080b_tgamma_collision.py"
          git commit -m "fix(d080b): make branch signatures temperature-invariant"
          git push origin HEAD:research/d080b-tgamma-collision-column-20260902
