name: d080f-retained-full-jacobian-build

on:
  push:
    branches:
      - research/d080f-retained-full-jacobian-build-20260902
    paths:
      - .github/workflows/d080f_full_build.yml
      - scripts/audit/_d080f_frozen_full_build.py
      - scripts/audit/d080f_retained_full_build.py
      - tests/test_d080f_frozen_full_build.py

permissions:
  contents: write

jobs:
  sealed-full-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify frozen predecessor identities
        run: |
          test "$(git rev-parse HEAD:src/rabbit/decoupling/_independent_noqke.py)" = \
            de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git rev-parse HEAD:scripts/audit/_d079_rhs_jvp.py)" = \
            6bcff2bc5627c0af0ad4df61c908d09e62ffaba5
          test "$(git rev-parse HEAD:scripts/audit/_d080c_tgamma_rhs.py)" = \
            c18feacbd57c9519af14504027b7d465758eb1ef
          test "$(git rev-parse HEAD:scripts/audit/_d080d_static_jacobian.py)" = \
            c577fefaf7a83443a7531e59a283c4f15e8815e1
          test "$(git rev-parse HEAD:scripts/audit/_d080e_prepared_jvp.py)" = \
            0913b3be5ad66af27ae7115deb603c88556cd6b4
          test "$(git rev-parse HEAD:scripts/audit/_d080e_prepared_jvp_core.py)" = \
            915196691eb166f5624d413a46d314b32faacfe6

      - name: Install frozen research dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            numpy==2.5.2 scipy==1.18.1 matplotlib==3.11.1 pytest==9.1.1

      - name: Compile D-080F specification
        run: python3 -m py_compile tests/test_d080f_frozen_full_build.py

      - name: Run focused sealed-build specification
        run: python3 -m pytest -q tests/test_d080f_frozen_full_build.py
