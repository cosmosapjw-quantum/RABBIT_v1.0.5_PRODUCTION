name: d080b-static-tgamma-collision

on:
  push:
    branches:
      - research/d080b-tgamma-collision-column-20260902
    paths:
      - .github/workflows/d080b_tgamma_collision.yml
      - scripts/audit/_d080b_tgamma_collision.py
      - scripts/audit/d080b_tgamma_collision_probe.py
      - scripts/audit/d080b_symbolic_checks.wl
      - tests/test_d080b_tgamma_collision.py

permissions:
  contents: write

jobs:
  static-tgamma-column:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify frozen predecessor identities
        run: |
          test "$(git rev-parse HEAD:src/rabbit/decoupling/_independent_noqke.py)" = \
            de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git rev-parse HEAD:scripts/audit/_d079_tangent_primitives.py)" = \
            668f3fab76ffc3ad7f29335a79fcd5daf47d429e
          test "$(git rev-parse HEAD:scripts/audit/_d079_collision_jvp.py)" = \
            591a64702c58a2de265fb88636f186e2d1b7e019
          test "$(git rev-parse HEAD:scripts/audit/_d080_tgamma_primitives.py)" = \
            c585d5865fd68a90a04a76ab540b8437fba8cfce

      - name: Install frozen research dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            numpy==2.5.2 scipy==1.18.1 matplotlib==3.11.1 pytest==9.1.1

      - name: Compile D-080B source and tests
        run: |
          python3 -m py_compile \
            scripts/audit/_d080b_tgamma_collision.py \
            scripts/audit/d080b_tgamma_collision_probe.py \
            tests/test_d080b_tgamma_collision.py

      - name: Run focused static derivative suite
        run: python3 -m pytest -q tests/test_d080b_tgamma_collision.py -m "not slow"

      - name: Generate deterministic plot and mutation receipt
        run: |
          rm -rf docs/audit/artifacts/d080b
          python3 scripts/audit/d080b_tgamma_collision_probe.py \
            --out-dir docs/audit/artifacts/d080b

      - name: Audit receipt fail-closed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("docs/audit/artifacts/d080b")
          receipt = json.loads((root / "research_receipt.json").read_text())
          assert receipt["classification"] == "FULL_STATIC_TGAMMA_COLLISION_COLUMN"
          assert receipt["comparator_blob_sha"] == "de44feee0aa484abe26976c7dc34c579643005b5"
          assert receipt["best_thermal_action_residual"] < 3.0e-5
          assert receipt["best_thermal_energy_residual"] < 3.0e-5
          assert receipt["equilibrium_neutrino_energy_tangent"] > 0.0
          assert receipt["equilibrium_electromagnetic_energy_tangent"] < 0.0
          assert receipt["maximum_first_law_tangent_residual"] < 2.0e-10
          assert receipt["all_ladder_samples_same_branch"] is True
          for value in receipt["mutation_residuals"].values():
              assert value > 1.0e-6
          for name in (
              "thermal_residual_ladder.png",
              "energy_transfer_ladder.png",
              "component_norms.png",
              "mutation_kills.png",
              "probe_summary.md",
              "research_receipt.json",
          ):
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, name
          PY

      - name: Recover exact retained creep-1200 state
        run: |
          git fetch --no-tags origin diagnosis_report
          test "$(git rev-parse origin/diagnosis_report)" = \
            78f5b091bd8de99bd8d0b1eddd8a0b7978f5da2b
          git show \
            origin/diagnosis_report:.agent-harness/runs/run-20260805-f10-v3-campaign/v3a_r2/domain/state_1200.npz \
            > /tmp/d080b_state_1200.npz
          echo "c0ad51adbd34d4fb8408f566c7bc573ca3d5bbd8c1d1f5d89f50df2e6b5d3380  /tmp/d080b_state_1200.npz" \
            | sha256sum -c -

      - name: Run retained-stiff local T-gamma discriminator
        env:
          D080B_STATE_1200: /tmp/d080b_state_1200.npz
        run: python3 -m pytest -q tests/test_d080b_tgamma_collision.py -m slow

      - name: Upload direct evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d080b-tgamma-collision-artifacts
          path: docs/audit/artifacts/d080b
          if-no-files-found: error
          retention-days: 2

      - name: Commit deterministic evidence
        run: |
          set -euo pipefail
          git fetch origin research/d080b-tgamma-collision-column-20260902
          git rebase origin/research/d080b-tgamma-collision-column-20260902
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/artifacts/d080b
          expected="$(cat <<'EOF'
          docs/audit/artifacts/d080b/component_norms.png
          docs/audit/artifacts/d080b/energy_transfer_ladder.png
          docs/audit/artifacts/d080b/mutation_kills.png
          docs/audit/artifacts/d080b/probe_summary.md
          docs/audit/artifacts/d080b/research_receipt.json
          docs/audit/artifacts/d080b/thermal_residual_ladder.png
          EOF
          )"
          actual="$(git diff --cached --name-only | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected generated paths.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "research(d080b): record full T-gamma collision-column evidence"
          git push origin HEAD:research/d080b-tgamma-collision-column-20260902
