name: d081r1f0-source-compile-repair-r1

on:
  push:
    branches:
      - research/d081r1f0-rust-c-only-jvp-20260904
    paths:
      - docs/audit/D081R1F0_SOURCE_COMPILE_REPAIR_R1_EXECUTE_2026-09-04

permissions:
  contents: write
  actions: read

jobs:
  source-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BRANCH: research/d081r1f0-rust-c-only-jvp-20260904
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1f0-rust-c-only-jvp-20260904
          fetch-depth: 0

      - name: Verify exact predecessor and repair inputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8cef907e704149340774214f4da1bd28b79608e9 HEAD
          test "$(git hash-object docs/audit/D081R1F0_RUST_C_ONLY_PACKED_RHS_JVP_CONTRACT_2026-09-04.md)" = ac7149fe5d5ec327cdc168d1eba7fe4a68ce3221
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object scripts/audit/_d079_tangent_primitives.py)" = 668f3fab76ffc3ad7f29335a79fcd5daf47d429e
          test "$(git hash-object scripts/audit/_d079_collision_jvp.py)" = 591a64702c58a2de265fb88636f186e2d1b7e019
          test "$(git hash-object scripts/audit/_d079_rhs_jvp.py)" = 6bcff2bc5627c0af0ad4df61c908d09e62ffaba5
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test "$(git hash-object .github/scripts/d081r1f0_register_modules.py)" = 413bfc4cbc07332bf1a098500466fd7835dfdddc
          test "$(git hash-object .github/scripts/d081r1f0_source_compile_repair_r1.py)" = 35a81ca3b07070df8fc046fcf5755d943a7469f9
          test "$(git hash-object native/rabbit_cpu/src/f10_action_tangent.rs)" = 9121116e1f9496c2e79d0ff600043d21d248534e
          test "$(git hash-object native/rabbit_cpu/src/f10_self_action/c_jvp.rs)" = e7e5fcf138aee7dd03201dc309df104aeb00bfcf
          test "$(git hash-object native/rabbit_cpu/src/f10_electron_action/c_jvp.rs)" = 4e15d7bb08db39c4a8a7498ee58565a98c57250e
          test "$(git hash-object native/rabbit_cpu/src/f10_combined_action_jvp.rs)" = 8f29a1925aed6ac79ce27913a3e470db45e5f358
          test "$(git hash-object native/rabbit_cpu/src/f10_packed_rhs_jvp.rs)" = 49266dcfc2336bd43957ad635270d9686cbb8802
          test "$(git hash-object native/rabbit_cpu/src/f10_packed_rhs_jvp_tests.rs)" = 79fdfbb7db76703d4c2aeb799b876107b10d931e
          test "$(git hash-object native/rabbit_cpu/src/f10_self_action.rs)" = da1decad01aef2f8056e60d3fcc1501e6aa635e9
          test "$(git hash-object native/rabbit_cpu/src/f10_electron_action.rs)" = 8d8acaa75ca15a17cfd5d8cbd85102915bfff352
          test "$(git hash-object native/rabbit_cpu/src/lib.rs)" = 423ddb478069f8e7d36c54842f34fda98ac48986
          test -f docs/audit/D081R1F0_SOURCE_COMPILE_REPAIR_R1_EXECUTE_2026-09-04

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"

      - name: Recover exact offline Rust vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9838506413/zip > /tmp/vendor.zip
          echo "391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a  /tmp/vendor.zip" | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          vendor_dir="$(find /tmp/vendor-outer -type d -name vendor -print -quit)"
          if [[ -z "${vendor_dir}" ]]; then
            archive="$(find /tmp/vendor-outer -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' -o -name '*.zip' \) -print -quit)"
            case "${archive}" in
              *.tar.gz|*.tgz) tar -xzf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar.xz) tar -xJf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar) tar -xf "${archive}" -C /tmp/vendor-expanded ;;
              *.zip) unzip -q "${archive}" -d /tmp/vendor-expanded ;;
              *) echo "no supported vendor archive" >&2; exit 1 ;;
            esac
            vendor_dir="$(find /tmp/vendor-expanded -type d -name vendor -print -quit)"
          fi
          test -n "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r0"\n[source.d081r0]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml

      - name: Apply bounded repair and freeze tested source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/d081r1f0_register_modules.py
          python3 .github/scripts/d081r1f0_source_compile_repair_r1.py
          grep -Fx 'pub(crate) mod c_jvp;' native/rabbit_cpu/src/f10_self_action.rs
          grep -Fx 'pub(crate) mod c_jvp;' native/rabbit_cpu/src/f10_electron_action.rs
          cd native/rabbit_cpu
          cargo +1.94.1 fmt --all
          cd ../..
          git diff --check
          git add native/rabbit_cpu/src
          tested_tree="$(git write-tree)"
          echo "D081R1F0_TESTED_SOURCE_TREE=${tested_tree}" >> "$GITHUB_ENV"
          printf 'tested_source_tree=%s\n' "${tested_tree}"

      - name: Compile and run bounded source repair verification
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          cargo +1.94.1 metadata --locked --offline --format-version 1 > /tmp/d081r1f0-repair-metadata.json
          cargo +1.94.1 check --release --locked --offline 2>&1 | tee /tmp/d081r1f0-repair-check.log
          cargo +1.94.1 test --locked --offline f10_packed_rhs_jvp_tests -- --nocapture 2>&1 | tee /tmp/d081r1f0-repair-jvp-zero.log
          cargo +1.94.1 test --locked --offline f10_packed_rhs_preflight_tests::tests -- --nocapture 2>&1 | tee /tmp/d081r1f0-repair-primal-preflight.log
          cargo +1.94.1 test --locked --offline f10_packed_rhs_tests::tests -- --nocapture 2>&1 | tee /tmp/d081r1f0-repair-primal-tests.log
          cargo +1.94.1 clippy --all-targets --all-features --locked --offline -- -D warnings 2>&1 | tee /tmp/d081r1f0-repair-clippy.log

      - name: Publish exact source-repair receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT=docs/audit/artifacts/d081r1f0/source_compile_repair_r1_receipt.json
          mkdir -p "$(dirname "${RECEIPT}")"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          source_paths = [
              "native/rabbit_cpu/src/f10_action_tangent.rs",
              "native/rabbit_cpu/src/f10_self_action.rs",
              "native/rabbit_cpu/src/f10_self_action/c_jvp.rs",
              "native/rabbit_cpu/src/f10_electron_action.rs",
              "native/rabbit_cpu/src/f10_electron_action/c_jvp.rs",
              "native/rabbit_cpu/src/f10_combined_action_jvp.rs",
              "native/rabbit_cpu/src/f10_packed_rhs_jvp.rs",
              "native/rabbit_cpu/src/f10_packed_rhs_jvp_tests.rs",
              "native/rabbit_cpu/src/lib.rs",
          ]
          log_paths = [
              "/tmp/d081r1f0-repair-check.log",
              "/tmp/d081r1f0-repair-jvp-zero.log",
              "/tmp/d081r1f0-repair-primal-preflight.log",
              "/tmp/d081r1f0-repair-primal-tests.log",
              "/tmp/d081r1f0-repair-clippy.log",
          ]
          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()
          payload = {
              "schema": "rabbit.d081r1f0.source_compile_repair_r1.v1",
              "classification": "SOURCE_COMPILE_REPAIR_R1_GREEN_NUMERICAL_EQUIVALENCE_UNTESTED",
              "trigger_head": os.environ["GITHUB_SHA"],
              "tested_source_tree": os.environ["D081R1F0_TESTED_SOURCE_TREE"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "failed_predecessor_run_id": "33830077340",
              "failed_predecessor_tested_tree": "75fd8863a0d7353fed3ce35e320d6001f0f26698",
              "repair_scope": [
                  "permanent derivative module registration",
                  "Clippy-equivalent iterator rewrite preserving accumulation order",
                  "exact-zero diagnostic field coverage",
              ],
              "contract_blob": "ac7149fe5d5ec327cdc168d1eba7fe4a68ce3221",
              "repair_script_blob": "35a81ca3b07070df8fc046fcf5755d943a7469f9",
              "rustc": subprocess.check_output(["rustc", "+1.94.1", "--version"], text=True).strip(),
              "cargo": subprocess.check_output(["cargo", "+1.94.1", "--version"], text=True).strip(),
              "offline_vendor": {
                  "artifact_id": 9838506413,
                  "zip_sha256": "391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a",
                  "package_directories": 174,
              },
              "source_blobs": {path: git("hash-object", path) for path in source_paths},
              "log_sha256": {
                  Path(path).name: hashlib.sha256(Path(path).read_bytes()).hexdigest()
                  for path in log_paths
              },
              "tests": {
                  "jvp": "exact-zero direction with full diagnostic structural coverage",
                  "primal_regression": "packed RHS preflight and packed RHS tests",
                  "clippy": "all targets/all features with -D warnings",
              },
              "untested": [
                  "nonzero analytic JVP",
                  "cross-language equivalence",
                  "linearity and additivity",
                  "nonzero first-law and symmetry gates",
                  "centered-difference witnesses",
                  "retained calibration",
                  "unseen holdout",
                  "mutations",
                  "solver and trajectory",
              ],
              "claim_ceiling": "source compilation and exact-zero JVP preflight only; no numerical-equivalence, retained-state, holdout, solver, trajectory, endpoint, N_eff, performance, release, or publication claim",
          }
          Path("docs/audit/artifacts/d081r1f0/source_compile_repair_r1_receipt.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/rabbit_cpu/src "${RECEIPT}"
          git diff --cached --check
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          git commit -m 'test(d081r1f0): publish source compile repair r1'
          final_commit="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          printf 'final_commit=%s\nfinal_tree=%s\n' "${final_commit}" "${final_tree}"
          git push origin "HEAD:${BRANCH}"
