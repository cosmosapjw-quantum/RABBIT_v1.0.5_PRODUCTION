name: d081r1e0-openblas-core-probe

on:
  push:
    branches:
      - research/d081r1e0-retained-packed-rhs-oracle-20260903
    paths:
      - .github/workflows/d081r1e0_openblas_core_probe.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "Haswell"
  NPY_DISABLE_CPU_FEATURES: "X86_V3,X86_V4"

jobs:
  probe:
    name: openblas-core-probe-${{ matrix.replica }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        replica: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Recover exact retained state
        shell: bash
        run: |
          set -euo pipefail
          git show '78f5b091bd8de99bd8d0b1eddd8a0b7978f5da2b:.agent-harness/runs/run-20260805-f10-v3-campaign/v3a_r2/domain/state_1200.npz' > /tmp/state_1200.npz
          echo 'c0ad51adbd34d4fb8408f566c7bc573ca3d5bbd8c1d1f5d89f50df2e6b5d3380  /tmp/state_1200.npz' | sha256sum -c -

      - name: Install exact Python oracle environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/d081r1e0-core-venv
          /tmp/d081r1e0-core-venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.4.4 scipy==1.17.1

      - name: Generate and validate pinned-core fixture
        shell: bash
        env:
          REPLICA: ${{ matrix.replica }}
        run: |
          set -euo pipefail
          PY=/tmp/d081r1e0-core-venv/bin/python
          GEN=native/rabbit_cpu/tests/fixtures/d081r1/generate_retained_packed_rhs_case.py
          CHECK=native/rabbit_cpu/tests/fixtures/d081r1/validate_retained_packed_rhs_case.py
          "$PY" "$GEN" --retained-state /tmp/state_1200.npz --output /tmp/core_a.json
          "$PY" "$GEN" --retained-state /tmp/state_1200.npz --output /tmp/core_b.json
          cmp /tmp/core_a.json /tmp/core_b.json
          "$PY" "$CHECK" --fixture /tmp/core_a.json
          "$PY" - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          fixture = Path('/tmp/core_a.json')
          data = json.loads(fixture.read_text(encoding='utf-8'))
          cpu = subprocess.run(
              ['lscpu', '--json'], check=True, text=True, capture_output=True
          )
          fields = {
              row['field'].rstrip(':'): row['data']
              for row in json.loads(cpu.stdout)['lscpu']
          }
          selected_arrays = (
              'packed_state',
              'grid_nodes',
              'grid_weights',
              'occupation',
              'cloglog_chain',
              'self_native',
              'electron_native',
              'total_native',
              'self_modal',
              'electron_modal',
              'total_modal',
              'pair_rate',
              'spectral_rhs',
              'packed_rhs_trajectory_core',
          )
          summary = {
              'schema': 'rabbit.d081r1e0.openblas_core_replica.v1',
              'replica': int(os.environ['REPLICA']),
              'head_sha': os.environ['GITHUB_SHA'],
              'platform': platform.platform(),
              'machine': platform.machine(),
              'cpu_vendor': fields.get('Vendor ID', ''),
              'cpu_model': fields.get('Model name', ''),
              'openblas_coretype': os.environ['OPENBLAS_CORETYPE'],
              'numpy_disabled_features': os.environ['NPY_DISABLE_CPU_FEATURES'],
              'fixture_sha256': hashlib.sha256(fixture.read_bytes()).hexdigest(),
              'array_sha256': {
                  key: data['arrays'][key]['sha256'] for key in selected_arrays
              },
              'scalar_bits': {
                  'temperature_rhs': data['scalars']['temperature_rhs_bits'],
                  'elapsed_rhs': data['scalars']['elapsed_rhs_bits'],
                  'q_nu': data['scalars']['neutrino_energy_transfer_bits'],
                  'q_em': data['scalars']['electromagnetic_energy_transfer_bits'],
              },
          }
          output = Path(f"/tmp/openblas-core-{summary['replica']}.json")
          output.write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload replica summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d081r1e0-openblas-core-${{ matrix.replica }}
          path: /tmp/openblas-core-${{ matrix.replica }}.json
          if-no-files-found: error
          retention-days: 7

  compare:
    name: compare-openblas-core-replicas
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all replica summaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: d081r1e0-openblas-core-*
          path: /tmp/d081r1e0-openblas-core
          merge-multiple: true

      - name: Classify cross-host reproducibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('/tmp/d081r1e0-openblas-core').glob('openblas-core-*.json'))
          if len(files) != 4:
              raise SystemExit(f'expected four summaries, found {len(files)}')
          rows = [json.loads(path.read_text(encoding='utf-8')) for path in files]
          array_keys = sorted(rows[0]['array_sha256'])
          hash_families = {
              'fixture_sha256': sorted({row['fixture_sha256'] for row in rows}),
              **{
                  key: sorted({row['array_sha256'][key] for row in rows})
                  for key in array_keys
              },
          }
          scalar_families = {
              key: sorted({row['scalar_bits'][key] for row in rows})
              for key in sorted(rows[0]['scalar_bits'])
          }
          byte_reproducible = (
              len(hash_families['fixture_sha256']) == 1
              and all(len(values) == 1 for values in hash_families.values())
              and all(len(values) == 1 for values in scalar_families.values())
          )
          classification = (
              'BYTE_REPRODUCIBLE_IN_PINNED_NUMPY_OPENBLAS_CAPSULE'
              if byte_reproducible
              else 'CANONICAL_BYTE_FIXTURE_WITH_CROSS_HOST_SEMANTIC_ENVELOPE'
          )
          report = {
              'schema': 'rabbit.d081r1e0.openblas_core_aggregate.v1',
              'status': 'DIAGNOSTIC_ONLY_NO_SCIENTIFIC_GATE_MOVEMENT',
              'classification': classification,
              'byte_reproducible': byte_reproducible,
              'replicas': rows,
              'hash_families': hash_families,
              'scalar_families': scalar_families,
          }
          output = Path('/tmp/d081r1e0-openblas-core-aggregate.json')
          output.write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload aggregate diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d081r1e0-openblas-core-aggregate
          path: /tmp/d081r1e0-openblas-core-aggregate.json
          if-no-files-found: error
          retention-days: 14
