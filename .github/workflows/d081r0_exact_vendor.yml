name: d081r0-exact-rabbit-offline-vendor

on:
  push:
    branches:
      - research/d081r0-rust-offline-semantic-admission-20260902
    paths:
      - .github/workflows/d081r0_exact_vendor.yml

permissions:
  contents: read

jobs:
  exact-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify frozen Rust graph and predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 901a62350b19cf43c17dffe45e96e8b94e4c7ca1)" = \
            "901a62350b19cf43c17dffe45e96e8b94e4c7ca1"
          test "$(git rev-parse HEAD:native/rabbit_cpu/Cargo.toml)" = \
            "30bc4826c7a7676b5fb5c8610273eb7586551ad8"
          test "$(git rev-parse HEAD:native/rabbit_cpu/Cargo.lock)" = \
            "a1b5035da5c20712d1a2a4ab077da255ff94a014"
          test "$(git rev-parse HEAD:native/rabbit_cpu/rust-toolchain.toml)" = \
            "b1dd491cdce6f8b98cfe02f6807980c0dfe48784"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
          rustc +1.94.1 --version --verbose
          cargo +1.94.1 --version --verbose

      - name: Create exact RABBIT vendor and portable repository layout
        shell: bash
        run: |
          set -euo pipefail
          kit=/tmp/d081r0-rabbit-offline
          repo="$kit/repo"
          crate="$repo/native/rabbit_cpu"
          rm -rf "$kit"
          mkdir -p "$repo/native" "$repo/src/rabbit/network/data" "$repo/tests/fixtures"
          cp -a native/rabbit_cpu "$repo/native/"
          cp src/rabbit/network/data/primat_ac2024_31rxn.json "$repo/src/rabbit/network/data/"
          cp src/rabbit/network/data/primat_ac2024_12rxn.json "$repo/src/rabbit/network/data/"
          cp tests/fixtures/flrw_gold_v861.json "$repo/tests/fixtures/"
          cd "$crate"
          mkdir -p .cargo
          cargo +1.94.1 vendor --locked vendor > .cargo/config.toml
          grep -F 'replace-with = "vendored-sources"' .cargo/config.toml
          grep -F 'directory = "vendor"' .cargo/config.toml

      - name: Prove exact bounded offline closure
        shell: bash
        run: |
          set -euo pipefail
          crate=/tmp/d081r0-rabbit-offline/repo/native/rabbit_cpu
          cd "$crate"
          export CARGO_NET_OFFLINE=true
          cargo +1.94.1 metadata --locked --offline --format-version 1 \
            > /tmp/d081r0-cargo-metadata.json
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --lib --offline --no-run
          {
            cargo +1.94.1 test --locked --lib --offline ode::tests -- --nocapture
            cargo +1.94.1 test --locked --lib --offline \
              isotropic_boltzmann::tests::analytic_jacobian_and_explicit_time_derivative_match_five_point_stencils \
              -- --exact --nocapture
            cargo +1.94.1 test --locked --lib --offline \
              isotropic_boltzmann::tests::classical_spectral_flrw_jacobian_and_time_derivative_match_stencils \
              -- --exact --nocapture
            cargo +1.94.1 test --locked --lib --offline \
              isotropic_boltzmann::tests::fused_rhs_and_jacobian_matches_separate_calls_bitwise \
              -- --exact --nocapture
            cargo +1.94.1 test --locked --lib --offline pauli_edge_step::tests -- --nocapture
            cargo +1.94.1 test --locked --lib --offline \
              electron_spectral::tests::unforced_equilibrium_jacobian_is_continuous \
              -- --exact --nocapture
            cargo +1.94.1 test --locked --lib --offline \
              electron_spectral::tests::folded_edges_reconstruct_action_at_five_independent_states \
              -- --exact --nocapture
            cargo +1.94.1 test --locked --lib --offline \
              neutrino_self_spectral::tests::nonthermal_full_catalogue_conserves_weighted_number_and_energy \
              -- --exact --nocapture
            cargo +1.94.1 test --locked --lib --offline \
              neutrino_self_spectral::tests::logit_jacobian_matches_five_point_stencils \
              -- --exact --nocapture
          } 2>&1 | tee /tmp/d081r0-cargo-test.txt
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 clippy --all-targets --all-features --locked --offline -- -D warnings

      - name: Create deterministic offline kit and receipt
        shell: bash
        run: |
          set -euo pipefail
          kit=/tmp/d081r0-rabbit-offline
          crate="$kit/repo/native/rabbit_cpu"
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          kit = pathlib.Path('/tmp/d081r0-rabbit-offline')
          crate = kit / 'repo/native/rabbit_cpu'
          lock = (crate / 'Cargo.lock').read_text(encoding='utf-8')
          packages = len(re.findall(r'^\[\[package\]\]$', lock, flags=re.M))
          registry_packages = len(re.findall(r'^source = "registry\+', lock, flags=re.M))
          vendor_dirs = sorted(p for p in (crate / 'vendor').iterdir() if p.is_dir())
          test_text = pathlib.Path('/tmp/d081r0-cargo-test.txt').read_text(encoding='utf-8')
          matches = re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out', test_text)
          if not matches:
              raise SystemExit('could not parse cargo test result')
          passed = sum(int(item[0]) for item in matches)
          failed = sum(int(item[1]) for item in matches)
          ignored = sum(int(item[2]) for item in matches)
          measured = sum(int(item[3]) for item in matches)
          filtered = sum(int(item[4]) for item in matches)
          if failed != 0:
              raise SystemExit(f'offline tests reported {failed} failures')
          receipt = {
              'schema': 'rabbit.d081r0.exact_offline_vendor.v3',
              'classification': 'EXACT_RABBIT_CARGO_LOCK_BOUNDED_OFFLINE_CLOSURE',
              'source_head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'source_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
              'cargo_toml_git_blob': subprocess.check_output(['git','rev-parse','HEAD:native/rabbit_cpu/Cargo.toml'], text=True).strip(),
              'cargo_lock_git_blob': subprocess.check_output(['git','rev-parse','HEAD:native/rabbit_cpu/Cargo.lock'], text=True).strip(),
              'toolchain_git_blob': subprocess.check_output(['git','rev-parse','HEAD:native/rabbit_cpu/rust-toolchain.toml'], text=True).strip(),
              'repository_relative_authority_files': [
                  'src/rabbit/network/data/primat_ac2024_31rxn.json',
                  'src/rabbit/network/data/primat_ac2024_12rxn.json',
                  'tests/fixtures/flrw_gold_v861.json',
              ],
              'rustc': subprocess.check_output(['rustc','+1.94.1','--version','--verbose'], text=True).strip().splitlines(),
              'cargo': subprocess.check_output(['cargo','+1.94.1','--version','--verbose'], text=True).strip().splitlines(),
              'lock_package_stanzas': packages,
              'lock_registry_sources': registry_packages,
              'vendor_directory_count': len(vendor_dirs),
              'commands': {
                  'metadata_locked_offline': 'PASS',
                  'check_release_locked_offline': 'PASS',
                  'compile_all_lib_tests_locked_offline': 'PASS',
                  'focused_tests_locked_offline': 'PASS',
                  'fmt_check': 'PASS',
                  'clippy_all_targets_all_features_locked_offline': 'PASS',
              },
              'focused_test_result_aggregate': {
                  'passed': passed,
                  'failed': failed,
                  'ignored': ignored,
                  'measured': measured,
                  'filtered_out_sum': filtered,
                  'test_invocations': len(matches),
              },
              'long_endpoint_tests_executed': False,
              'claim_ceiling': 'environment/dependency closure and bounded native regression only; no Rust/Python semantic parity, performance, trajectory, endpoint, or scientific result',
          }
          (kit / 'OFFLINE_CLOSURE_RECEIPT.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          cp /tmp/d081r0-cargo-metadata.json "$kit/CARGO_METADATA.json"
          cp /tmp/d081r0-cargo-test.txt "$kit/CARGO_TEST.txt"
          git rev-parse HEAD > "$kit/SOURCE_HEAD"
          git rev-parse HEAD^{tree} > "$kit/SOURCE_TREE"
          (
            cd "$kit"
            find SOURCE_HEAD SOURCE_TREE OFFLINE_CLOSURE_RECEIPT.json CARGO_METADATA.json CARGO_TEST.txt repo \
              -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$kit/RABBIT_D081R0_EXACT_OFFLINE_CARGO_KIT.tar.gz" -C "$kit" \
            SOURCE_HEAD SOURCE_TREE OFFLINE_CLOSURE_RECEIPT.json CARGO_METADATA.json CARGO_TEST.txt SHA256SUMS repo
          test -s "$kit/RABBIT_D081R0_EXACT_OFFLINE_CARGO_KIT.tar.gz"
          sha256sum "$kit/RABBIT_D081R0_EXACT_OFFLINE_CARGO_KIT.tar.gz"

      - name: Upload exact offline kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d081r0-exact-rabbit-offline-cargo-kit
          path: /tmp/d081r0-rabbit-offline/RABBIT_D081R0_EXACT_OFFLINE_CARGO_KIT.tar.gz
          if-no-files-found: error
          retention-days: 2
