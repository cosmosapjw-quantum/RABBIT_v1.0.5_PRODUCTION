name: d081r1d0-full-action-oracle

on:
  push:
    branches:
      - research/d081r1d-full-action-oracle-20260903

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d-full-action-oracle-20260903
          fetch-depth: 24

      - name: Verify frozen predecessor and source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5e4adf6af6ae1983ba0a272074503a7d6f469a46 HEAD
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014

      - name: Install exact Python oracle dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "numpy==2.4.4" "scipy==1.17.1"

      - name: Generate deterministic full-action fixture twice
        shell: bash
        run: |
          set -euo pipefail
          generator=native/rabbit_cpu/tests/fixtures/d081r1/generate_full_collision_action_case.py
          fixture=native/rabbit_cpu/tests/fixtures/d081r1/full_collision_action_case.json
          python3 "${generator}"
          cp "${fixture}" /tmp/full-action.first.json
          python3 "${generator}"
          cmp /tmp/full-action.first.json "${fixture}"

      - name: Audit schema and physical fixture gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          path = Path("native/rabbit_cpu/tests/fixtures/d081r1/full_collision_action_case.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          def decode(bits: str) -> float:
              return struct.unpack(">d", bytes.fromhex(bits))[0]

          assert data["schema"] == "rabbit.d081r1.full_collision_action.v1"
          assert data["private_comparator_git_blob"] == "de44feee0aa484abe26976c7dc34c579643005b5"
          assert data["order"] == 8
          assert decode(data["y_max_bits"]) == 8.0
          assert data["self_event_count"] == 27
          assert data["electron_event_count"] == 15
          assert data["species_order"] == [
              "nu_e", "antinu_e", "nu_mu", "antinu_mu", "nu_tau", "antinu_tau"
          ]
          cases = {case["name"]: case for case in data["cases"]}
          assert set(cases) == {"equilibrium", "thermal_split", "mu_tau_split"}
          for case in cases.values():
              assert case["arrays"]["total_native"]["shape"] == [6, 8]
              assert case["arrays"]["total_modal"]["shape"] == [6, 8]
              assert len(case["self_rows"]) == 9
              assert len(case["electron_families"]) == 15
              assert decode(case["diagnostics"]["first_law_residual"]) <= 5.0e-13
              assert decode(case["diagnostics"]["charge_conjugation_residual"]) <= 5.0e-12
          assert decode(cases["equilibrium"]["diagnostics"]["mu_tau_residual"]) <= 5.0e-12
          assert decode(cases["thermal_split"]["diagnostics"]["event_neutrino_energy_transfer"]) > 0.0
          assert decode(cases["thermal_split"]["electron_bath_energy_transfer_bits"]) < 0.0
          assert decode(cases["mu_tau_split"]["diagnostics"]["mu_tau_residual"]) > 1.0e-8
          PY

      - name: Generate bounded R1D0 records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/audit/artifacts/d081r1d0
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import struct
          import subprocess
          from pathlib import Path

          fixture = Path("native/rabbit_cpu/tests/fixtures/d081r1/full_collision_action_case.json")
          generator = Path("native/rabbit_cpu/tests/fixtures/d081r1/generate_full_collision_action_case.py")
          data = json.loads(fixture.read_text(encoding="utf-8"))

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def decode(bits: str) -> float:
              return struct.unpack(">d", bytes.fromhex(bits))[0]

          cases = {case["name"]: case for case in data["cases"]}
          receipt = {
              "schema": "rabbit.d081r1d0.full_action_oracle_freeze.v1",
              "classification": "FULL_PYTHON_ACTION_ORACLE_FROZEN",
              "tested_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tested_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "predecessor_head": "5e4adf6af6ae1983ba0a272074503a7d6f469a46",
              "private_comparator_git_blob": "de44feee0aa484abe26976c7dc34c579643005b5",
              "fixture_sha256": sha(fixture),
              "generator_sha256": sha(generator),
              "order": 8,
              "y_max": 8.0,
              "cases": ["equilibrium", "thermal_split", "mu_tau_split"],
              "catalogue": {"self_events": 27, "electron_events": 15},
              "equilibrium": {
                  "first_law_residual": decode(cases["equilibrium"]["diagnostics"]["first_law_residual"]),
                  "charge_conjugation_residual": decode(cases["equilibrium"]["diagnostics"]["charge_conjugation_residual"]),
                  "mu_tau_residual": decode(cases["equilibrium"]["diagnostics"]["mu_tau_residual"]),
              },
              "thermal_split": {
                  "q_nu": decode(cases["thermal_split"]["diagnostics"]["event_neutrino_energy_transfer"]),
                  "q_em": decode(cases["thermal_split"]["electron_bath_energy_transfer_bits"]),
                  "first_law_residual": decode(cases["thermal_split"]["diagnostics"]["first_law_residual"]),
              },
              "mu_tau_split": {
                  "mu_tau_residual": decode(cases["mu_tau_split"]["diagnostics"]["mu_tau_residual"]),
                  "first_law_residual": decode(cases["mu_tau_split"]["diagnostics"]["first_law_residual"]),
              },
              "claim_ceiling": (
                  "frozen Python order-8 full-action oracle only; no Rust full-action parity, "
                  "retained order-60 result, RHS/J/Jv, solver, performance, endpoint, N_eff "
                  "or F10 gate movement"
              ),
          }
          Path("docs/audit/artifacts/d081r1d0/full_action_oracle_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

          cat > docs/audit/BD637_D081R1D0_FULL_ACTION_ORACLE_RESULT_2026-09-03.md <<'EOF'
          # BD637 — D-081R1D0 full-action oracle freeze result

          ## Verdict

          `FULL_PYTHON_ACTION_ORACLE_FROZEN`

          The frozen private Python comparator was executed twice byte-identically on three
          prospectively declared affine-GL8 `[0,8]` cases: exact equilibrium, a hotter
          electromagnetic bath, and a mu/tau antisymmetric flavour split. The fixture records
          six-species native/modal self, electron and total actions, nine self rows, fifteen
          electron families, support/correction signatures, energy and entropy diagnostics,
          moments, and cancellation envelopes as exact binary64 bit patterns.

          ## Authority correction

          The legacy two-bank Rust action is not the positive oracle. It is retained only as a
          negative control because folding mu and tau erases the antisymmetric direction. The
          full-action positive authority is the frozen Python comparator Git blob recorded in
          the machine receipt.

          ## Physical gates

          The generator requires first-law and CP closure in every case, a numerically null
          equilibrium action, positive neutrino and negative electromagnetic energy transfer
          for the thermal-split case, and a nonzero mu/tau response for the antisymmetric case.

          ## Claim ceiling

          This result freezes test data. No Rust angular/radial action, packed RHS, JVP,
          Jacobian, solver, trajectory, performance result, endpoint, `N_eff`, production,
          publication, or F10-gate movement is established.

          ## Next node

          D-081R1D1 must rematerialize the missing affine-grid, mapped-spectral, and exact
          kinematic foundations in the remote Rust lineage through RED-first fixture tests.
          Only then may the 27-event self action be assembled.
          EOF

          python3 -m json.tool docs/audit/artifacts/d081r1d0/full_action_oracle_receipt.json >/dev/null
          git diff --check

      - name: Commit frozen fixture and records, removing temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/d081r1d0_full_action_oracle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(d081r1d0): freeze full six-species Python action oracle"
          git push origin HEAD:research/d081r1d-full-action-oracle-20260903
