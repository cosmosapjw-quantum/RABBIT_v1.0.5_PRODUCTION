name: d081r1f0-retained-mu-tau-diagnostic

on:
  push:
    branches:
      - research/d081r1f0-rust-c-only-jvp-20260904
    paths:
      - .github/workflows/d081r1f0_retained_mu_tau_diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger and frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 0a284a9adbed8960051a67ab22380f2f6cca36e9 HEAD
          test "$(git hash-object docs/audit/D081R1F0_RUST_C_ONLY_PACKED_RHS_JVP_CONTRACT_2026-09-04.md)" = ac7149fe5d5ec327cdc168d1eba7fe4a68ce3221
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object scripts/audit/_d079_tangent_primitives.py)" = 668f3fab76ffc3ad7f29335a79fcd5daf47d429e
          test "$(git hash-object scripts/audit/_d079_collision_jvp.py)" = 591a64702c58a2de265fb88636f186e2d1b7e019
          test "$(git hash-object scripts/audit/_d079_rhs_jvp.py)" = 6bcff2bc5627c0af0ad4df61c908d09e62ffaba5
          test "$(git hash-object native/rabbit_cpu/tests/fixtures/d081r1/generate_rust_c_only_jvp_oracle.py)" = d8366b5386a7f1744fdb9729dba710712cd37eb4
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test ! -e docs/audit/artifacts/d081r1f0/retained_holdout_verification_receipt.json

      - name: Recover state and exact runtime
        shell: bash
        run: |
          set -euo pipefail
          HISTORICAL='78f5b091bd8de99bd8d0b1eddd8a0b7978f5da2b'
          STATE_PATH='.agent-harness/runs/run-20260805-f10-v3-campaign/v3a_r2/domain/state_1200.npz'
          git show "${HISTORICAL}:${STATE_PATH}" > /tmp/d081r1f0_state_1200.npz
          echo 'c0ad51adbd34d4fb8408f566c7bc573ca3d5bbd8c1d1f5d89f50df2e6b5d3380  /tmp/d081r1f0_state_1200.npz' | sha256sum -c -
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/d081r1f0-diagnostic-venv
          /tmp/d081r1f0-diagnostic-venv/bin/python -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            numpy==2.4.4 scipy==1.17.1
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"

      - name: Recover exact offline Rust vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9838506413/zip > /tmp/vendor.zip
          echo '391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          vendor_dir="$(find /tmp/vendor-outer -type d -name vendor -print -quit)"
          if [[ -z "${vendor_dir}" ]]; then
            archive="$(find /tmp/vendor-outer -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' -o -name '*.zip' \) -print -quit)"
            case "${archive}" in
              *.tar.gz|*.tgz) tar -xzf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar.xz) tar -xJf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar) tar -xf "${archive}" -C /tmp/vendor-expanded ;;
              *.zip) unzip -q "${archive}" -d /tmp/vendor-expanded ;;
              *) echo 'no supported vendor archive' >&2; exit 1 ;;
            esac
            vendor_dir="$(find /tmp/vendor-expanded -type d -name vendor -print -quit)"
          fi
          test -n "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r0"\n[source.d081r0]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml

      - name: Generate retained calibration oracle once
        shell: bash
        run: |
          set -euo pipefail
          PY=/tmp/d081r1f0-diagnostic-venv/bin/python
          GEN=native/rabbit_cpu/tests/fixtures/d081r1/generate_rust_c_only_jvp_oracle.py
          "$PY" "$GEN" --case retained-calibration \
            --retained /tmp/d081r1f0_state_1200.npz \
            --output /tmp/retained-calibration.json
          "$PY" - <<'PY'
          import json, struct
          from pathlib import Path
          p=json.loads(Path('/tmp/retained-calibration.json').read_text())
          def f64(s): return struct.unpack('>d', int(str(s).removeprefix('0x'),16).to_bytes(8,'big'))[0]
          def arr(o): return [f64(x) for x in o['bits']]
          v=arr(p['collision']['total_native']); n=p['order']
          mu=[0.5*(v[2*n+i]+v[3*n+i]) for i in range(n)]
          tau=[0.5*(v[4*n+i]+v[5*n+i]) for i in range(n)]
          numerator=max(abs(a-b) for a,b in zip(mu,tau))
          scale=max(max(map(abs,mu)),max(map(abs,tau)))
          stored=f64(p['collision']['mu_tau_residual_bits'])
          print(f'D081R1F0_PY_MU_TAU stored={stored:.17e} numerator={numerator:.17e} scale={scale:.17e} recomputed={numerator/max(scale,float.fromhex("0x1.0p-1022")):.17e}')
          print(f'D081R1F0_PY_CP stored={f64(p["collision"]["charge_conjugation_residual_bits"]):.17e}')
          PY

      - name: Inject diagnostic prints without changing the gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('native/rabbit_cpu/src/f10_packed_rhs_jvp_retained_calibration_tests.rs')
          text=path.read_text()
          old='''    assert_below(\n        result.combined_action.mu_tau_residual,\n        2.0e-9,\n        "retained mu/tau tangent",\n    );\n'''
          new='''    let pair_average = |values: &[f64], pair: usize| -> Vec<f64> {\n        (0..grid.order)\n            .map(|node| {\n                0.5 * (values[(2 * pair) * grid.order + node]\n                    + values[(2 * pair + 1) * grid.order + node])\n            })\n            .collect()\n    };\n    let rust_mu = pair_average(&result.combined_action.native_total, 1);\n    let rust_tau = pair_average(&result.combined_action.native_total, 2);\n    let python_mu = pair_average(&expected_total_native, 1);\n    let python_tau = pair_average(&expected_total_native, 2);\n    let rust_numerator = maximum_absolute_difference(&rust_mu, &rust_tau);\n    let rust_scale = maximum_absolute(&rust_mu).max(maximum_absolute(&rust_tau));\n    let python_numerator = maximum_absolute_difference(&python_mu, &python_tau);\n    let python_scale = maximum_absolute(&python_mu).max(maximum_absolute(&python_tau));\n    let python_stored_mu_tau = bits(&value["collision"]["mu_tau_residual_bits"]);\n    println!(\n        "D081R1F0_RUST_MU_TAU residual={:.17e} numerator={rust_numerator:.17e} scale={rust_scale:.17e} python_stored={python_stored_mu_tau:.17e} python_recomputed={:.17e} mu_array_relative={:.17e} tau_array_relative={:.17e}",\n        result.combined_action.mu_tau_residual,\n        python_numerator / python_scale.max(f64::MIN_POSITIVE),\n        global_relative(&rust_mu, &python_mu),\n        global_relative(&rust_tau, &python_tau),\n    );\n    assert_below(\n        result.combined_action.mu_tau_residual,\n        2.0e-9,\n        "retained mu/tau tangent",\n    );\n'''
          if text.count(old)!=1:
              raise SystemExit(f'expected one target block, found {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          cd native/rabbit_cpu
          cargo +1.94.1 fmt --all

      - name: Execute the unchanged failing gate and retain diagnostics
        shell: bash
        working-directory: native/rabbit_cpu
        env:
          D081R1F0_RETAINED_CALIBRATION_FIXTURE: /tmp/retained-calibration.json
        run: |
          set -euo pipefail
          set +e
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_jvp_retained_calibration_tests::retained_state1200_c_only_jvp_matches_the_frozen_calibration_oracle \
            -- --exact --nocapture 2>&1 | tee /tmp/d081r1f0-mu-tau-diagnostic.log
          status=${PIPESTATUS[0]}
          set -e
          grep -F 'D081R1F0_RUST_MU_TAU' /tmp/d081r1f0-mu-tau-diagnostic.log
          grep -F 'retained mu/tau tangent exceeded threshold' /tmp/d081r1f0-mu-tau-diagnostic.log
          test "${status}" -ne 0
          echo 'DIAGNOSTIC_COMPLETE_EXPECTED_GATE_FAILURE_PRESERVED'
