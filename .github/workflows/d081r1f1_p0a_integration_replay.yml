name: d081r1f1-p0a-integration-replay

on:
  push:
    branches:
      - research/d081r1f1-rust-tgamma-jvp-20260904
    paths:
      - .github/workflows/d081r1f1_p0a_integration_replay.yml
      - native/rabbit_cpu/src/f10_tgamma_tangent.rs
      - native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs
      - native/rabbit_cpu/src/lib.rs
      - scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py
      - docs/audit/artifacts/d081r1f1/p0a_primitives_red_receipt.json
      - docs/audit/artifacts/d081r1f1/p0a_primitives_green_receipt.json
      - docs/audit/artifacts/d081r1f1/vendor_refresh_receipt.json

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact integrated head and frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'research/d081r1f1-rust-tgamma-jvp-20260904'
          git merge-base --is-ancestor 2f7a555a0f75b92b464d64c02b2ebcff72d37e87 HEAD
          test "$(git show -s --format=%P 2f7a555a0f75b92b464d64c02b2ebcff72d37e87)" = '3106c59aab2f4847b0d0971452a896bdd75079b0 d720f88773ed407393af8c241ee7ebb64ca67b93'
          test "$(git rev-parse 2f7a555a0f75b92b464d64c02b2ebcff72d37e87^{tree})" = bda1814e8be921468c5556e0d50c4b867b52b926
          test "$(git hash-object docs/audit/D081R1F1_RUST_TGAMMA_PACKED_RHS_JVP_CONTRACT_2026-09-04.md)" = 58eeaf38b9f4edd4c60a01d22d2e101a33b71812
          test "$(git hash-object docs/audit/artifacts/d081r1f1/vendor_refresh_receipt.json)" = c023e9d0ae84651cdcc9b458f6ac8a02219a29b0
          test "$(git hash-object docs/audit/artifacts/d081r1f1/p0a_primitives_red_receipt.json)" = 5c5745c840b39a39b06221ec59906a2e50cd136f
          test "$(git hash-object docs/audit/artifacts/d081r1f1/p0a_primitives_green_receipt.json)" = 1e56ef1f69ffff2158a1859edec56218840f2d40
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_tangent.rs)" = 0217768ba62b02d14a3c52ae68208fafc8c8d46c
          test "$(git hash-object native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs)" = f2642cf9a699290e2c97a7d6e8a12b980e5f8919
          test "$(git hash-object native/rabbit_cpu/src/lib.rs)" = 31901ae934375fb22a7c9a4e7b4b23ef0c366f32
          test "$(git hash-object scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py)" = 3a90ae484a20fd8601c9db307ce5d5202343acca
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          python3 - <<'PY'
          import json
          from pathlib import Path
          red = json.loads(Path('docs/audit/artifacts/d081r1f1/p0a_primitives_red_receipt.json').read_text())
          green = json.loads(Path('docs/audit/artifacts/d081r1f1/p0a_primitives_green_receipt.json').read_text())
          vendor = json.loads(Path('docs/audit/artifacts/d081r1f1/vendor_refresh_receipt.json').read_text())
          assert red['classification'] == 'PASS_EXPECTED_ABSENT_TGAMMA_PRIMITIVES_MODULE_RED'
          assert green['classification'] == 'PASS_WITH_MOVING_HALF_LINE_AND_QED_OFF_EOS_TGAMMA_PRIMITIVES_SCOPE'
          assert green['focused_tests'] == {'passed': 3, 'failed': 0}
          assert green['strict_clippy'] == 'PASS'
          assert green['release_check'] == 'PASS'
          assert vendor['classification'] == 'LOCK_DERIVED_VENDOR_OFFLINE_CLOSURE_PASS'
          assert vendor['artifact_id'] == 9932329475
          assert vendor['package_count'] == 174
          PY

      - name: Generate deterministic Python primitive oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/d081r1f1-p0a-replay-venv
          /tmp/d081r1f1-p0a-replay-venv/bin/python -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            numpy==2.4.4 scipy==1.17.1
          PY=/tmp/d081r1f1-p0a-replay-venv/bin/python
          GEN=scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py
          "$PY" "$GEN" --output /tmp/p0a-replay-a.json
          "$PY" "$GEN" --output /tmp/p0a-replay-b.json
          cmp /tmp/p0a-replay-a.json /tmp/p0a-replay-b.json
          echo '3e0941c8649895c0ee3c1c2e98abd949a1d2fafbf0d7dcf1ff39f41825ce0fa7  /tmp/p0a-replay-a.json' | sha256sum -c -
          echo '3e0941c8649895c0ee3c1c2e98abd949a1d2fafbf0d7dcf1ff39f41825ce0fa7  /tmp/p0a-replay-b.json' | sha256sum -c -

      - name: Install exact Rust and refreshed offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = 'rustc 1.94.1 (e408947bf 2026-03-25)'
          test "$(cargo +1.94.1 --version)" = 'cargo 1.94.1 (29ea6fb6a 2026-03-24)'
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9932329475/zip > /tmp/vendor.zip
          echo '2fa7b64275f5ec435b8dab3b9876dce79227bb1d12a5da552f67059e6a240640  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          echo '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f  /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz' | sha256sum -c -
          tar -xzf /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz -C /tmp/vendor-expanded
          test "$(find /tmp/vendor-expanded/vendor -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r1"\n[source.d081r1]\ndirectory="/tmp/vendor-expanded/vendor"\n[net]\noffline=true\n' > native/rabbit_cpu/.cargo/config.toml

      - name: Replay P0A and inherited exact-offline regressions
        shell: bash
        working-directory: native/rabbit_cpu
        env:
          D081R1F1_P0A_ORACLE: /tmp/p0a-replay-a.json
        run: |
          set -euo pipefail
          cargo +1.94.1 metadata --locked --offline --format-version 1 > /tmp/p0a-integration-metadata.json
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 check --release --locked --offline
          cargo +1.94.1 test --locked --offline f10_tgamma_tangent_tests -- --nocapture 2>&1 | tee /tmp/p0a-integration-test.log
          grep -F 'test result: ok. 3 passed; 0 failed' /tmp/p0a-integration-test.log
          cargo +1.94.1 test --locked --offline f10_packed_rhs_jvp_tests -- --nocapture
          cargo +1.94.1 test --locked --offline f10_packed_rhs_preflight_tests::tests -- --nocapture
          cargo +1.94.1 clippy --all-targets --all-features --locked --offline -- -D warnings
          git -C ../.. diff --exit-code
          echo 'D081R1F1_P0A_INTEGRATION_REPLAY_PASS'
