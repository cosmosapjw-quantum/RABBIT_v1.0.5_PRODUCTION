name: d081r1f1-p0a-primitives-red

on:
  push:
    branches:
      - research/d081r1f1-p0a-tgamma-primitives-20260904
    paths:
      - .github/workflows/d081r1f1_p0a_primitives_red.yml
      - scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py
      - native/rabbit_cpu/src/f10_tgamma_tangent_tests.rs
      - native/rabbit_cpu/src/lib.rs

permissions:
  contents: write
  actions: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger and frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor a9bc5b244ab7f2b120af43a9849fdfac6283c496 HEAD
          test "$(git hash-object docs/audit/D081R1F1_RUST_TGAMMA_PACKED_RHS_JVP_CONTRACT_2026-09-04.md)" = 58eeaf38b9f4edd4c60a01d22d2e101a33b71812
          test "$(git hash-object scripts/audit/_d080_tgamma_primitives.py)" = c585d5865fd68a90a04a76ab540b8437fba8cfce
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test "$(git hash-object docs/audit/artifacts/d081r1f1/vendor_refresh_receipt.json)" = c023e9d0ae84651cdcc9b458f6ac8a02219a29b0
          test ! -e native/rabbit_cpu/src/f10_tgamma_tangent.rs
          test ! -e docs/audit/artifacts/d081r1f1/p0a_primitives_red_receipt.json

      - name: Generate deterministic Python primitive oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.12.3
          python3 -m venv /tmp/d081r1f1-p0a-venv
          /tmp/d081r1f1-p0a-venv/bin/python -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            numpy==2.4.4 scipy==1.17.1
          PY=/tmp/d081r1f1-p0a-venv/bin/python
          GEN=scripts/audit/d081r1f1_p0a_tgamma_primitives_oracle.py
          "$PY" "$GEN" --output /tmp/p0a-a.json
          "$PY" "$GEN" --output /tmp/p0a-b.json
          cmp /tmp/p0a-a.json /tmp/p0a-b.json
          echo '3e0941c8649895c0ee3c1c2e98abd949a1d2fafbf0d7dcf1ff39f41825ce0fa7  /tmp/p0a-a.json' | sha256sum -c -
          echo '3e0941c8649895c0ee3c1c2e98abd949a1d2fafbf0d7dcf1ff39f41825ce0fa7  /tmp/p0a-b.json' | sha256sum -c -

      - name: Install exact Rust and refreshed offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt clippy
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$(cargo +1.94.1 --version)" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9932329475/zip > /tmp/vendor.zip
          echo '2fa7b64275f5ec435b8dab3b9876dce79227bb1d12a5da552f67059e6a240640  /tmp/vendor.zip' | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          echo '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f  /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz' | sha256sum -c -
          tar -xzf /tmp/vendor-outer/d081r1-cargo-vendor-a1b5035.tar.gz -C /tmp/vendor-expanded
          vendor_dir=/tmp/vendor-expanded/vendor
          test -d "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r1"\n[source.d081r1]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml
          cd native/rabbit_cpu
          cargo +1.94.1 metadata --locked --offline --format-version 1 > /tmp/p0a-metadata.json

      - name: Verify expected missing-module RED
        shell: bash
        working-directory: native/rabbit_cpu
        env:
          D081R1F1_P0A_ORACLE: /tmp/p0a-a.json
        run: |
          set -euo pipefail
          set +e
          cargo +1.94.1 test --locked --offline f10_tgamma_tangent_tests -- --nocapture > /tmp/p0a-red.log 2>&1
          status=$?
          set -e
          cat /tmp/p0a-red.log
          test "${status}" -ne 0
          grep -F 'unresolved import `crate::f10_tgamma_tangent`' /tmp/p0a-red.log

      - name: Publish durable RED receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt=docs/audit/artifacts/d081r1f1/p0a_primitives_red_receipt.json
          mkdir -p "$(dirname "${receipt}")"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          fixture = Path('/tmp/p0a-a.json')
          payload = {
              'schema': 'rabbit.d081r1f1.p0a_primitives_red_receipt.v1',
              'classification': 'PASS_EXPECTED_ABSENT_TGAMMA_PRIMITIVES_MODULE_RED',
              'trigger_head': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'oracle_sha256': hashlib.sha256(fixture.read_bytes()).hexdigest(),
              'vendor_artifact_id': 9932329475,
              'vendor_archive_sha256': '85bbaa8819e938baebb08a5db297300ffd9cacb5fed430a8ff84d5836830b65f',
              'expected_error': 'E0432 unresolved import crate::f10_tgamma_tangent',
              'claim_ceiling': 'compile RED and deterministic Python P0A oracle only; no Rust thermal primitive is implemented or admitted',
          }
          Path('docs/audit/artifacts/d081r1f1/p0a_primitives_red_receipt.json').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${receipt}"
          test "$(git diff --cached --name-only)" = "${receipt}"
          git commit -m 'test(d081r1f1): preserve P0A thermal-primitives RED receipt'
          git fetch origin research/d081r1f1-p0a-tgamma-primitives-20260904
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push origin HEAD:research/d081r1f1-p0a-tgamma-primitives-20260904
