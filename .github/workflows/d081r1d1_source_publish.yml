name: d081r1d1-source-publish

on:
  push:
    branches:
      - research/d081r1d1-foundations-20260903

permissions:
  contents: write

jobs:
  publish-source-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d1-foundations-20260903
          fetch-depth: 2

      - name: Apply the idempotent source-only repair
        shell: bash
        run: |
          set -euo pipefail
          result="$(python3 scripts/audit/d081r1d1_apply_metrology_repair.py)"
          printf '%s\n' "${result}"
          if [[ "${result}" == "ALREADY_APPLIED" ]]; then
            exit 0
          fi
          test "${result}" = "CHANGED"
          test "$(git diff --name-only)" = "native/rabbit_cpu/src/f10_action_foundations_tests.rs"
          git diff --check

      - name: Commit and push the Rust test path only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- native/rabbit_cpu/src/f10_action_foundations_tests.rs; then
            echo "source repair already present; no publication commit needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/rabbit_cpu/src/f10_action_foundations_tests.rs
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "native/rabbit_cpu/src/f10_action_foundations_tests.rs"
          git commit -m "test(d081r1d1): use mixed spectral roundoff metrology"
          git push origin HEAD:research/d081r1d1-foundations-20260903
