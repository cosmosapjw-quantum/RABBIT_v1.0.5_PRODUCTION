name: d081r1d1-green-rustfmt-helper

on:
  push:
    branches:
      - research/d081r1d1-foundations-20260903

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d1-foundations-20260903
          fetch-depth: 1

      - name: Apply exact Rust 1.94.1 formatting to GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          cd native/rabbit_cpu
          cargo +1.94.1 fmt --all
          cd ../..
          rm .github/workflows/d081r1d1_green_rustfmt_helper.yml
          git diff --check

      - name: Commit formatting-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(d081r1d1): format GREEN foundation implementation"
          git push origin HEAD:research/d081r1d1-foundations-20260903
