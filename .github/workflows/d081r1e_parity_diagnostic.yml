name: d081r1e-parity-diagnostic

on:
  push:
    branches:
      - research/d081r1e-retained-packed-rhs-20260903
    paths:
      - .github/workflows/d081r1e_parity_diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1e-retained-packed-rhs-20260903
          fetch-depth: 0

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          test "$(rustc +1.94.1 --version)" = "rustc 1.94.1 (e408947bf 2026-03-25)"

      - name: Recover exact offline vendor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vendor-outer /tmp/vendor-expanded
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9838506413/zip > /tmp/vendor.zip
          echo "391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a  /tmp/vendor.zip" | sha256sum -c -
          unzip -q /tmp/vendor.zip -d /tmp/vendor-outer
          vendor_dir="$(find /tmp/vendor-outer -type d -name vendor -print -quit)"
          if [[ -z "${vendor_dir}" ]]; then
            archive="$(find /tmp/vendor-outer -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' -o -name '*.zip' \) -print -quit)"
            case "${archive}" in
              *.tar.gz|*.tgz) tar -xzf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar.xz) tar -xJf "${archive}" -C /tmp/vendor-expanded ;;
              *.tar) tar -xf "${archive}" -C /tmp/vendor-expanded ;;
              *.zip) unzip -q "${archive}" -d /tmp/vendor-expanded ;;
              *) echo "no supported vendor archive" >&2; exit 1 ;;
            esac
            vendor_dir="$(find /tmp/vendor-expanded -type d -name vendor -print -quit)"
          fi
          test -n "${vendor_dir}"
          test "$(find "${vendor_dir}" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 174
          mkdir -p native/rabbit_cpu/.cargo
          printf '[source.crates-io]\nreplace-with="d081r0"\n[source.d081r0]\ndirectory="%s"\n[net]\noffline=true\n' "${vendor_dir}" > native/rabbit_cpu/.cargo/config.toml

      - name: Inject diagnostic-only Rust test
        shell: bash
        run: |
          set -euo pipefail
          cat > native/rabbit_cpu/src/f10_packed_rhs_diagnostic_tests.rs <<'RS'
          use crate::f10_action_grid::F10ActionGrid;
          use crate::f10_action_spectral::native_action;
          use crate::f10_packed_rhs::{F10PackedRhsConfig, evaluate_f10_packed_rhs};
          use serde_json::Value;

          const FIXTURE: &str = include_str!("../tests/fixtures/d081r1/retained_packed_rhs_case.json");

          fn bits(value: &Value) -> f64 {
              let encoded = value.as_str().expect("hex bits");
              f64::from_bits(u64::from_str_radix(encoded.trim_start_matches("0x"), 16).unwrap())
          }

          fn bit_array(value: &Value) -> Vec<f64> {
              value["bits"].as_array().unwrap().iter().map(bits).collect()
          }

          fn maximum_absolute(values: &[f64]) -> f64 {
              values.iter().map(|value| value.abs()).fold(f64::MIN_POSITIVE, f64::max)
          }

          fn report(label: &str, actual: &[f64], expected: &[f64], reference_scale: f64, relative_tolerance: f64) {
              assert_eq!(actual.len(), expected.len());
              let absolute_floor = 1_048_576.0 * f64::EPSILON * reference_scale.max(f64::MIN_POSITIVE);
              let mut worst_ratio = -1.0_f64;
              let mut worst_index = 0_usize;
              let mut worst_difference = 0.0_f64;
              let mut worst_allowed = 0.0_f64;
              for (index, (&observed, &reference)) in actual.iter().zip(expected).enumerate() {
                  let allowed = absolute_floor + relative_tolerance * observed.abs().max(reference.abs());
                  let difference = (observed - reference).abs();
                  let ratio = difference / allowed.max(f64::MIN_POSITIVE);
                  if ratio > worst_ratio {
                      worst_ratio = ratio;
                      worst_index = index;
                      worst_difference = difference;
                      worst_allowed = allowed;
                  }
              }
              println!("DIAG[{label}] worst_index={worst_index} actual={:.17e} expected={:.17e} difference={:.17e} allowed={:.17e} ratio={:.17e} absolute_floor={:.17e}", actual[worst_index], expected[worst_index], worst_difference, worst_allowed, worst_ratio, absolute_floor);
          }

          #[test]
          fn retained_action_parity_layer_diagnostic() {
              let value: Value = serde_json::from_str(FIXTURE).unwrap();
              let grid = F10ActionGrid::affine_legendre(60, 30.0).unwrap();
              let state = bit_array(&value["packed_state"]);
              let ln_a = bits(&value["ln_a_bits"]);
              let t_cm = bits(&value["temperature_cm_bits"]);
              let result = evaluate_f10_packed_rhs(&grid, ln_a, &state, F10PackedRhsConfig::default()).unwrap();
              let expected_modal = bit_array(&value["combined_action_modal"]);
              let expected_native = bit_array(&value["combined_action_native"]);
              let expected_spectral = bit_array(&value["spectral_rhs"]);
              let action_scale = maximum_absolute(&bit_array(&value["absolute_envelopes"]["combined_action_native"]));
              let spectral_scale = maximum_absolute(&bit_array(&value["absolute_envelopes"]["spectral_rhs"]));

              report("total_modal", &result.combined_action.modal_total, &expected_modal, maximum_absolute(&expected_modal), 5.0e-7);
              report("total_native", &result.combined_action.native_total, &expected_native, action_scale, 5.0e-7);
              report("spectral_rhs", &result.values[..180], &expected_spectral, spectral_scale, 5.0e-7);

              let actual_reconstructed = native_action(&grid, &result.combined_action.modal_total, 6, t_cm).unwrap();
              let expected_reconstructed = native_action(&grid, &expected_modal, 6, t_cm).unwrap();
              report("actual_native_reconstruction", &result.combined_action.native_total, &actual_reconstructed, maximum_absolute(&actual_reconstructed), 5.0e-14);
              report("expected_modal_to_fixture_native", &expected_reconstructed, &expected_native, action_scale, 5.0e-7);

              let index = 300_usize;
              println!("INDEX300 total_actual={:.17e} total_expected={:.17e} self_actual={:.17e} electron_actual={:.17e} reconstructed_expected={:.17e}",
                  result.combined_action.native_total[index],
                  expected_native[index],
                  result.combined_action.self_action.native[index],
                  result.combined_action.electron_action.native[index],
                  expected_reconstructed[index],
              );
              println!("DIAG scalars Tcm={:.17e} H={:.17e} rho_nu={:.17e} first_law={:.17e}",
                  result.diagnostics.temperature_cm_mev,
                  result.diagnostics.hubble_mev,
                  result.diagnostics.rho_neutrino_total,
                  result.diagnostics.first_law_residual,
              );
          }
          RS
          printf '\n#[cfg(test)]\nmod f10_packed_rhs_diagnostic_tests;\n' >> native/rabbit_cpu/src/lib.rs

      - name: Run retained parity diagnostic
        shell: bash
        working-directory: native/rabbit_cpu
        run: |
          set -euo pipefail
          cargo +1.94.1 test --locked --offline \
            f10_packed_rhs_diagnostic_tests::retained_action_parity_layer_diagnostic \
            -- --nocapture
