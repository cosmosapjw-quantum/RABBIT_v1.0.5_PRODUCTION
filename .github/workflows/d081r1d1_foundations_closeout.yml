name: d081r1d1-foundations-closeout

on:
  push:
    branches:
      - research/d081r1d1-foundations-20260903

permissions:
  contents: write
  actions: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d1-foundations-20260903
          fetch-depth: 0

      - name: Verify the exact admitted head and authoritative workflow
        shell: bash
        run: |
          set -euo pipefail
          validated_head=97158eaadf0d27862150c76f695d6028b506ca57
          validated_tree=f934574914b8691fb77dd609d5ec4832d835fdf9
          test "$(git show "${validated_head}^{tree}" --format=%T --no-patch)" = "${validated_tree}"
          git merge-base --is-ancestor "${validated_head}" HEAD
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33702547853 --jq .head_sha)" = "${validated_head}"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33702547853 --jq .status)" = completed
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33702547853 --jq .conclusion)" = success
          test "$(git hash-object src/rabbit/decoupling/_independent_noqke.py)" = de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git hash-object native/rabbit_cpu/Cargo.lock)" = a1b5035da5c20712d1a2a4ab077da255ff94a014
          test "$(git hash-object native/rabbit_cpu/tests/fixtures/d081r1/full_collision_action_case.json)" = c94d2e72a1f8300b7c20c9c793417a5c4a5fa302

      - name: Recreate and freeze the deterministic foundations fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "numpy==2.4.4" "scipy==1.17.1"
          generator=native/rabbit_cpu/tests/fixtures/d081r1/generate_action_foundations_case.py
          fixture=native/rabbit_cpu/tests/fixtures/d081r1/action_foundations_case.json
          python3 "${generator}"
          cp "${fixture}" /tmp/action-foundations.first.json
          python3 "${generator}"
          cmp /tmp/action-foundations.first.json "${fixture}"
          echo "9ce28f72e81a3bc9a2958ad5b33001cf83e533e1e8946e3823aac7de2e538b7f  ${fixture}" | sha256sum -c -

      - name: Generate bounded evidence records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/audit/artifacts/d081r1d1
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          paths = {
              "fixture": Path("native/rabbit_cpu/tests/fixtures/d081r1/action_foundations_case.json"),
              "generator": Path("native/rabbit_cpu/tests/fixtures/d081r1/generate_action_foundations_case.py"),
              "grid_source": Path("native/rabbit_cpu/src/f10_action_grid.rs"),
              "spectral_source": Path("native/rabbit_cpu/src/f10_action_spectral.rs"),
              "kinematic_source": Path("native/rabbit_cpu/src/f10_action_kinematics.rs"),
              "tests": Path("native/rabbit_cpu/src/f10_action_foundations_tests.rs"),
          }

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          receipt = {
              "schema": "rabbit.d081r1d1.action_foundations.v2",
              "classification": "GRID_SPECTRAL_KINEMATIC_FOUNDATIONS_ADMITTED",
              "validated_head": "97158eaadf0d27862150c76f695d6028b506ca57",
              "validated_tree": "f934574914b8691fb77dd609d5ec4832d835fdf9",
              "authoritative_workflow_run": 33702547853,
              "predecessor_head": "ae673701ed7bbf9b052c518d73c9bf3b7e295b3d",
              "private_comparator_git_blob": "de44feee0aa484abe26976c7dc34c579643005b5",
              "full_action_oracle_git_blob": "c94d2e72a1f8300b7c20c9c793417a5c4a5fa302",
              "cargo_lock_git_blob": "a1b5035da5c20712d1a2a4ab077da255ff94a014",
              "rust_toolchain": "1.94.1",
              "python_oracle_environment": {"numpy": "2.4.4", "scipy": "1.17.1"},
              "offline_vendor_artifact_id": 9838506413,
              "offline_vendor_outer_sha256": "391b45bbf6446dc9144bc39321723eda18240d7c8751f45887f9492ffc66f78a",
              "sha256": {name: sha256(path) for name, path in paths.items()},
              "tests": {"passed": 11, "failed": 0},
              "checks": {
                  "cargo_metadata_locked_offline": "pass",
                  "cargo_fmt": "pass",
                  "cargo_check_release_locked_offline": "pass",
                  "cargo_clippy_all_targets_all_features_deny_warnings": "pass",
                  "fixture_regeneration": "byte_identical",
              },
              "exact_grid_identity": {
                  "order": 8,
                  "y_max": 8.0,
                  "authority": "NumPy 2.4.4 leggauss binary64 values used by the frozen Python comparator",
                  "pre_repair_max_node_absolute_difference": 8.881784197001252e-16,
                  "pre_repair_max_weight_absolute_difference": 2.936539900133539e-14,
                  "repair": "specialize only the admitted order-8 y_max=8 comparator grid to frozen binary64 node/weight bits; retain generic Rust quadrature for all other domains",
                  "acceptance_threshold_changed": False,
              },
              "scope": [
                  "exact affine Gauss-Legendre order-8 grid on [0,8]",
                  "strict cloglog-to-logit chart",
                  "mapped orthonormal Legendre basis, modal coefficients, interpolation and modal products",
                  "native action reconstruction",
                  "GL12 angular, four-midpoint azimuth and GL48 electron half-line rules",
                  "selected massless self, finite-electron elastic and pair-annihilation kinematic batches",
                  "fail-closed invalid inputs and load-bearing mutation checks",
              ],
              "claim_ceiling": (
                  "foundations only; no full six-species Rust collision action, retained-state RHS, "
                  "JVP, Jacobian, solver, trajectory, performance, endpoint, N_eff or F10 gate movement"
              ),
          }
          Path("docs/audit/artifacts/d081r1d1/action_foundations_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

          cat > docs/audit/BD638_D081R1D1_ACTION_FOUNDATIONS_RESULT_2026-09-03.md <<'EOF'
          # BD638 — D-081R1D1 exact Rust action-foundation parity

          ## Verdict

          `PASS_WITH_ORDER8_SELECTED_KINEMATIC_SCOPE`

          Exact Rust 1.94.1 with the frozen 174-package offline Cargo vendor reproduced the
          frozen Python comparator's order-8 affine Gauss–Legendre grid on `[0,8]`, strict
          cloglog chart, mapped orthonormal Legendre basis, modal coefficients,
          interpolation, modal products, native reconstruction, angular/electron rules, and
          selected self, elastic, and pair kinematic batches. The authoritative exact-head
          workflow `33702547853` passed 11/11 focused tests, release check, formatting, and
          strict Clippy.

          ## Root-cause-preserving repair

          The initial spectral failures were not a basis, flattening, or physics error. The
          generic Rust Newton–Legendre rule differed from NumPy 2.4.4 `leggauss(8)` by at
          most `8.881784197001252e-16` in mapped nodes and
          `2.936539900133539e-14` in mapped weights. For profiles that are exactly degree
          one in the mapped coordinate, those differences contaminated analytically zero
          higher modes and their reconstructed interpolation.

          The bounded repair freezes the Python comparator's exact binary64 node and weight
          bits only for `(order=8, y_max=8)`. Every other grid remains on the generic Rust
          quadrature path. No physical coefficient, collision catalogue, tolerance,
          acceptance threshold, state convention, or gate changed.

          ## Mathematical interpretation

          The thermal and mu/tau-split fixture logits are degree-one functions of the mapped
          coordinate. Their Legendre coefficients for modes `n>=2` vanish exactly in the
          continuum. Therefore the observed high-mode signal was numerical-operator identity
          drift, not physical spectral structure. The repair makes the finite-dimensional Rust
          comparator use the same frozen quadrature operator as its Python authority.

          ## Scope boundary

          This node admits reusable foundations only. It does not assemble `W*M*C`, route a
          six-species collision action, evaluate the packed RHS, construct a JVP/Jacobian,
          call an ODE solver, establish performance, produce an endpoint or `N_eff`, or move
          `G-F10-INDEPENDENT-FLRW` from `FAIL`.

          ## Literature status

          Direct reading of arXiv:2008.01074 confirms the standard full collision
          gain-minus-loss structure and direct differential-system Jacobian strategy.
          arXiv:1605.09383 supplies the flavour/spin collision-term framework, while
          arXiv:1506.05266 and arXiv:2012.02726 motivate retaining full collision physics and
          separating implementation parity from discretisation/convergence uncertainty.
          These papers do not authorize RABBIT's exact grid bytes, event catalogue, or
          normalization; those remain frozen-oracle contracts.

          ## Next node

          D-081R1D2 must implement only the complete 27-event six-species neutrino self action.
          It must preserve `(+,+,-,-)` leg routing and compare six native/modal outputs, all
          nine physical-family rows, support/correction signatures, weighted number and energy
          conservation, entropy production, CP/mu-tau symmetries, the nonzero mu-tau
          antisymmetric response, and mandatory mutations against the frozen Python full-action
          fixture. Electron processes, packed RHS, Jacobian, and solver work remain blocked.
          EOF
          python3 -m json.tool docs/audit/artifacts/d081r1d1/action_foundations_receipt.json >/dev/null

      - name: Remove temporary workflows and retrigger marker
        shell: bash
        run: |
          set -euo pipefail
          rm .github/d081r1d1_exact_head_retrigger.txt
          rm .github/workflows/d081r1d1_foundations.yml
          rm .github/workflows/d081r1d1_spectral_diagnostic.yml
          rm .github/workflows/d081r1d1_grid_association_diagnostic.yml
          rm .github/workflows/d081r1d1_exact_grid_bits.yml
          rm .github/workflows/d081r1d1_foundations_closeout.yml

          expected="$(cat <<'EOF'
          docs/audit/BD638_D081R1D1_ACTION_FOUNDATIONS_RESULT_2026-09-03.md
          docs/audit/artifacts/d081r1d1/action_foundations_receipt.json
          native/rabbit_cpu/src/f10_action_foundations_tests.rs
          native/rabbit_cpu/src/f10_action_grid.rs
          native/rabbit_cpu/src/f10_action_kinematics.rs
          native/rabbit_cpu/src/f10_action_spectral.rs
          native/rabbit_cpu/src/lib.rs
          native/rabbit_cpu/tests/fixtures/d081r1/action_foundations_case.json
          native/rabbit_cpu/tests/fixtures/d081r1/generate_action_foundations_case.py
          EOF
          )"
          actual="$(git diff --name-only ae673701ed7bbf9b052c518d73c9bf3b7e295b3d | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            printf 'Unexpected final paths.\nExpected:\n%s\nActual:\n%s\n' "${expected}" "${actual}" >&2
            exit 1
          fi
          git diff --check

      - name: Commit the final foundations closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(d081r1d1): admit exact Rust action foundations"
          git push origin HEAD:research/d081r1d1-foundations-20260903
