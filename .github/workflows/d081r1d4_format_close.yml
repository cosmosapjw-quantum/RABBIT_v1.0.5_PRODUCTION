name: d081r1d4-format-close

on:
  push:
    branches:
      - research/d081r1d4-combined-action-20260903
    paths:
      - .github/workflows/d081r1d4_format_close.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d4-combined-action-20260903
          fetch-depth: 2

      - name: Apply exact Rust formatter and remove temporary patch workflows
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          (cd native/rabbit_cpu && cargo +1.94.1 fmt --all)
          rm -f .github/workflows/d081r1d4_test_error_semantics_patch.yml
          rm -f .github/workflows/d081r1d4_format_close.yml
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Commit bounded formatting repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(d081r1d4): apply exact Rust formatting"
          git push origin HEAD:research/d081r1d4-combined-action-20260903
