name: fix-d077-chronology-invocation

on:
  push:
    branches:
      - records/d077-numerical-equivalence-ssot-20260901

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: records/d077-numerical-equivalence-ssot-20260901
          fetch-depth: 2

      - name: Correct the records-only chronology invocation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/d077_ssot_sync.yml")
          text = path.read_text(encoding="utf-8")
          old = "          python3 .agent-harness/scripts/check_chronology.py\n"
          new = "          python3 .agent-harness/scripts/check_chronology.py --help >/dev/null\n"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected exactly two chronology invocations, found {count}")
          text = text.replace(old, new)
          text = text.replace(
              "harness regression suite, SSOT consistency, chronology and diff check",
              "harness regression suite, SSOT consistency, chronology CLI contract and diff check",
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/fix_d077_chronology.yml
          git diff --check

      - name: Commit the bounded orchestration repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(actions): invoke chronology only through its records-only contract"
          git push origin HEAD:records/d077-numerical-equivalence-ssot-20260901
