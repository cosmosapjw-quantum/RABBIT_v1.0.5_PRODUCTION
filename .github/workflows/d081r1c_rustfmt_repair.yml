name: d081r1c-rustfmt-repair

on:
  push:
    branches:
      - research/d081r1c-kernel-primitives-20260902

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1c-kernel-primitives-20260902
          fetch-depth: 0

      - name: Apply exact rustfmt only
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          cd native/rabbit_cpu
          cargo +1.94.1 fmt --all
          cd ../..
          rm .github/workflows/d081r1c_rustfmt_repair.yml
          changed="$(git diff --name-only | sort)"
          expected="$(cat <<'EOF'
          .github/workflows/d081r1c_rustfmt_repair.yml
          native/rabbit_cpu/src/f10_kernel_primitives.rs
          EOF
          )"
          if [[ "${changed}" != "${expected}" ]]; then
            printf 'Unexpected rustfmt paths. Expected:\n%s\nGot:\n%s\n' "${expected}" "${changed}" >&2
            exit 1
          fi
          git diff --check

      - name: Commit bounded formatting repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(d081r1c): apply exact Rust 1.94.1 formatting"
          git push origin HEAD:research/d081r1c-kernel-primitives-20260902
