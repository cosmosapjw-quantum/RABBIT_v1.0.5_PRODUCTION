name: d081r1d1-clippy-precision-repair

on:
  push:
    branches:
      - research/d081r1d1-foundations-20260903

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d1-foundations-20260903
          fetch-depth: 2

      - name: Apply the exact Clippy-prescribed binary64 spelling repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/rabbit_cpu/src/f10_action_foundations_tests.rs")
          text = path.read_text(encoding="utf-8")
          old = "-8.899_131_431_761_020e-16"
          new = "-8.899_131_431_761_02e-16"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one excessive-precision literal, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/d081r1d1_clippy_precision_repair.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/d081r1d1_clippy_precision_repair.yml\nnative/rabbit_cpu/src/f10_action_foundations_tests.rs'

      - name: Commit the bounded lint repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(d081r1d1): use canonical binary64 literal spelling"
          git push origin HEAD:research/d081r1d1-foundations-20260903
