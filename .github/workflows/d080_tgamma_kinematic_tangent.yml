name: d080-tgamma-kinematic-tangent

on:
  push:
    branches:
      - research/d080-tgamma-kinematic-tangent-20260902
    paths:
      - .github/workflows/d080_tgamma_kinematic_tangent.yml
      - scripts/audit/_d080_tgamma_primitives.py
      - scripts/audit/d080_tgamma_kinematic_probe.py
      - tests/test_d080_tgamma_kinematic_tangent.py

permissions:
  contents: write

jobs:
  tgamma-kinematics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify frozen predecessor identities
        run: |
          test "$(git rev-parse HEAD:src/rabbit/decoupling/_independent_noqke.py)" = \
            de44feee0aa484abe26976c7dc34c579643005b5
          test "$(git rev-parse HEAD:scripts/audit/_d079_collision_jvp.py)" = \
            591a64702c58a2de265fb88636f186e2d1b7e019
          test "$(git rev-parse HEAD:scripts/audit/_d079_rhs_jvp.py)" = \
            6bcff2bc5627c0af0ad4df61c908d09e62ffaba5

      - name: Install frozen research dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            numpy==2.5.2 scipy==1.18.1 matplotlib==3.11.1 pytest==9.1.1

      - name: Compile D-080 source and tests
        run: |
          python3 -m py_compile \
            scripts/audit/_d080_tgamma_primitives.py \
            scripts/audit/d080_tgamma_kinematic_probe.py \
            tests/test_d080_tgamma_kinematic_tangent.py

      - name: Run focused derivative suite
        run: python3 -m pytest -q tests/test_d080_tgamma_kinematic_tangent.py

      - name: Generate plot-driven receipt
        run: python3 scripts/audit/d080_tgamma_kinematic_probe.py --out-dir docs/audit/artifacts/d080a

      - name: Audit receipt and mutation kills
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("docs/audit/artifacts/d080a")
          receipt = json.loads((root / "research_receipt.json").read_text())
          print(json.dumps(receipt, indent=2, sort_keys=True))
          assert receipt["classification"] == "TGAMMA_KINEMATIC_TANGENT_ONLY"
          assert receipt["comparator_blob_sha"] == "de44feee0aa484abe26976c7dc34c579643005b5"
          assert receipt["best_kinematic_residual"] < 2.0e-6
          assert receipt["best_eos_residual"] < 2.0e-6
          assert receipt["all_centered_samples_same_branch"] is True
          mutations = receipt["mutation_residuals"]
          assert mutations["freeze-p2"] > 1.0e-3
          assert mutations["flip-e2-sign"] > 1.0e-3
          assert mutations["omit-weight-scale"] > 1.0e-3
          for name in (
              "kinematic_residual_ladder.png",
              "eos_residual_ladder.png",
              "support_margin.png",
              "mutation_kills.png",
              "probe_summary.md",
          ):
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, name
          PY

      - name: Upload plot bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d080a-tgamma-kinematic-artifacts
          path: docs/audit/artifacts/d080a
          if-no-files-found: error
          retention-days: 2

      - name: Commit deterministic evidence
        run: |
          set -euo pipefail
          branch=research/d080-tgamma-kinematic-tangent-20260902
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/artifacts/d080a
          expected="$(cat <<'EOF'
          docs/audit/artifacts/d080a/eos_residual_ladder.png
          docs/audit/artifacts/d080a/kinematic_residual_ladder.png
          docs/audit/artifacts/d080a/mutation_kills.png
          docs/audit/artifacts/d080a/probe_summary.md
          docs/audit/artifacts/d080a/research_receipt.json
          docs/audit/artifacts/d080a/support_margin.png
          EOF
          )"
          actual="$(git diff --cached --name-only | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected evidence paths.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "research(d080): record T-gamma kinematic tangent evidence"
          git push origin HEAD:"$branch"
