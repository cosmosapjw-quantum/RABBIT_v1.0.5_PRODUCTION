name: d081r1d3-rustfmt-repair

on:
  push:
    branches:
      - research/d081r1d3-electron-action-20260903
    paths:
      - .github/workflows/d081r1d3_rustfmt_repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d3-electron-action-20260903
          fetch-depth: 2

      - name: Apply bounded rustfmt-only repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c1f796c19282a6cccb26e754e630f5aef61a991f
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          (cd native/rabbit_cpu && cargo +1.94.1 fmt --all)
          rm .github/workflows/d081r1d3_rustfmt_repair.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/d081r1d3_rustfmt_repair.yml',
              'native/rabbit_cpu/src/f10_electron_action.rs',
              'native/rabbit_cpu/src/f10_electron_action_tests.rs',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          if not changed or not changed <= allowed:
              raise SystemExit(f'unexpected rustfmt changed paths: {sorted(changed)}')
          if 'native/rabbit_cpu/src/f10_electron_action.rs' not in changed:
              raise SystemExit('expected electron action source to be formatted')
          PY
          git diff --check

      - name: Commit and push rustfmt repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(d081r1d3): normalize electron action with Rust 1.94.1"
          git push origin HEAD:research/d081r1d3-electron-action-20260903
