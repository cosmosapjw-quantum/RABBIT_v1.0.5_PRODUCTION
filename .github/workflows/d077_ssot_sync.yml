name: d077-ssot-sync

on:
  push:
    branches:
      - records/d077-numerical-equivalence-ssot-20260901

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: records/d077-numerical-equivalence-ssot-20260901

      - name: Install harness dependency
        run: python3 -m pip install --disable-pip-version-check "pytest>=7.0"

      - name: Integrate D-077 authority surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          decision_id = "D-077"
          merge_commit = "03556bed931fc31704f4540c7f113a638985bc1e"
          authority_base = "f6e42c29f3186926b65544d9147e9b6eab248b4e"

          subprocess.run(
              ["git", "merge-base", "--is-ancestor", merge_commit, "HEAD"],
              check=True,
          )

          frozen_path = Path(".agent-harness/context/FROZEN_DECISIONS.md")
          frozen = frozen_path.read_text(encoding="utf-8")
          if f"| {decision_id} |" in frozen:
              raise SystemExit(f"{decision_id} already exists in {frozen_path}")
          frozen_row = """| D-077 | **Authorize a prospectively sealed numerical-equivalence lane for the D-071 independent-FLRW closure while retaining the old instrument/current-measurement disposition and every historical byte.** Admissible candidates are an independently derived analytic Jacobian, an AD Jacobian of the private comparator RHS with derivative provenance, a matrix-free JVP/Newton-Krylov path using the identical RHS, or a hybrid analytic/AD block Jacobian whose omissions are declared and bounded before output. A finite-difference-factor reset or cap is diagnostic only. | Owner authorization `docs/audit/OWNER_NUMERICAL_EQUIVALENCE_LANE_2026-09-01.md`, merged by PR #4 at `03556bed931fc31704f4540c7f113a638985bc1e`; the authorization freezes identical physical RHS, state, grid, domain, tolerances, event, endpoint, observables, failure semantics and wall budget, and requires pre-output identity, equation-to-derivative mapping, local derivative and Newton checks, a stalled-phase discriminator, frozen endpoint predicates, mutation kills and post-report adjudication. | Records and method-admissibility only. No runtime, physics, solver, derivative implementation, numerical output, gate grade, F-11 or Type-I, QKE, inference, public-production or publication authority changes. | Reopen consideration requires every amended registry condition. Any physical-contract change leaves this equivalence lane. Authorization alone is design status only and cannot move the gate. |"""
          frozen_path.write_text(frozen.rstrip("\n") + "\n" + frozen_row + "\n", encoding="utf-8")

          decision_path = Path("docs/harness/DECISION_LOG.md")
          decision_lines = decision_path.read_text(encoding="utf-8").splitlines()
          if any("Record D-077" in line for line in decision_lines):
              raise SystemExit("D-077 already exists in DECISION_LOG.md")
          separator = next(i for i, line in enumerate(decision_lines) if line.startswith("|---"))
          decision_row = """| 2026-09-01 | Record D-077: authorize a sealed numerical-equivalence lane for the D-071 independent trajectory programme while retaining the old instrument and current-measurement closure and all historical evidence. | The owner merged PR #4 at `03556bed931fc31704f4540c7f113a638985bc1e`. A numerical representation may now change only through an independently derived analytic Jacobian, private-RHS AD Jacobian with provenance, matrix-free JVP or Newton-Krylov path, or a prospectively bounded analytic and AD hybrid, while the physical problem and acceptance contract remain identical. | Rejected: treating a finite-difference factor reset or cap as a qualifying result; hardware-only or larger-budget rescue; tolerance or band widening; clipping, projection or repair; physical, grid, event or endpoint changes; production derivative reuse; combining this records decision with implementation or output. | The registry grade is unchanged. The next admissible action is a separate pre-output contract change followed by the stalled-phase discriminator; only a later evidence package and adjudication may request reconsideration. |"""
          decision_lines.insert(separator + 1, decision_row)
          decision_path.write_text("\n".join(decision_lines) + "\n", encoding="utf-8")

          gate_path = Path(".agent-harness/context/GATE_REGISTRY.json")
          registry = json.loads(gate_path.read_text(encoding="utf-8"))
          matches = [g for g in registry["gates"] if g.get("gate_id") == "G-F10-INDEPENDENT-FLRW"]
          if len(matches) != 1:
              raise SystemExit(f"expected one independent-FLRW gate, found {len(matches)}")
          gate = matches[0]
          if gate.get("status") != "fail":
              raise SystemExit("authorization must not move the independent-FLRW gate")
          disposition = gate.get("fail_disposition")
          if not isinstance(disposition, dict) or disposition.get("decision") != "D-071":
              raise SystemExit("unexpected pre-D-077 fail disposition")
          disposition["decision"] = "D-071/D-077"
          disposition["reopen_requires_all_of"] = [
              "the private-comparator physical RHS, collision catalogue, constants, units, state layout, grids, domain, tolerances, event, endpoint, observables, accepted-state and failure semantics, and wall budget remain identical",
              "one admissible numerical-equivalence method is selected: an independently derived analytic Jacobian, an AD Jacobian of the private comparator RHS with derivative provenance, a matrix-free JVP/Newton-Krylov path using the identical RHS, or a prospectively bounded analytic/AD block hybrid",
              "a source, tree, environment, dependency, command and equation-to-derivative contract is prospectively sealed before any qualifying output byte",
              "preregistered directional-derivative, Jacobian or JVP, local-Newton, linear-residual, conservation, exchange and symmetry tests pass at equilibrium, asymmetric, stalled collision-epoch, transition and late-time states",
              "a bounded discriminator covers the stalled collision-dominated phase and projects end-to-end completion inside the existing wall budget with a prospectively declared margin",
              "the frozen trajectory-prefix, checkpoint, spectral-moment, tail, conservation, exchange, event, endpoint and holdout predicates pass with no output-led refitting",
              "designated collision-sign, normalization, multiplicity, state-index, omitted-block, stale-Jacobian, derivative-scaling and event mutations are killed",
              "a complete evidence package and adjudication are authored only after the complete report exists; authorization alone does not move the gate",
          ]
          disposition["explicitly_not_reopen_conditions"] = [
              "a finite-difference factor reset or cap by itself; it is a diagnostic causal control only",
              "generic optimization or output-led threshold selection",
              "tolerance widening, clipping, projection, state repair, hidden floors or failed-state suppression",
              "changes to grids, domain, collision catalogue, physical coefficients, state meaning, event, endpoint, observables or failure semantics",
              "reuse of production Rust or frozen JAX derivative code inside the independent comparator",
              "faster hardware or more cores",
              "a larger wall budget",
              "F-11 or Type-I, QKE, inference, public-runtime, production or publication claims",
          ]
          gate["status_basis_legacy"] = (
              "D-071 closes the old instrument on its current measurement; "
              "D-077 authorizes only a prospectively sealed numerical-equivalence lane; no grade movement"
          )
          gate_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          owner_record = Path("docs/audit/OWNER_NUMERICAL_EQUIVALENCE_LANE_2026-09-01.md")
          owner_text = owner_record.read_text(encoding="utf-8") if owner_record.is_file() else ""
          if authority_base not in owner_text or "Tracking issue: #3" not in owner_text:
              raise SystemExit("merged owner authorization record is absent or does not bind the expected authority base")
          PY

      - name: Build generated authority projections
        run: |
          set -euo pipefail
          python3 .agent-harness/scripts/build_status_board.py
          python3 .agent-harness/scripts/build_context_pack.py

      - name: Preliminary formal verification
        shell: bash
        run: |
          set -euo pipefail
          python3 .agent-harness/scripts/validate_harness.py
          python3 -m pytest -q .agent-harness/tests
          python3 .agent-harness/scripts/check_ssot_consistency.py
          python3 .agent-harness/scripts/check_chronology.py
          git diff --check

      - name: Record successful preliminary validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/harness/VALIDATION_LEDGER.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          if any("D-077 records-only SSOT synchronization" in line for line in lines):
              raise SystemExit("D-077 validation row already exists")
          separator = next(i for i, line in enumerate(lines) if line.startswith("|---"))
          row = """| 2026-09-01 | D-077 records-only SSOT synchronization: generated-board and context builders, aggregate validator, harness regression suite, SSOT consistency, chronology, generated-artifact comparison and diff check | **Every listed command exited zero in GitHub Actions before the synchronization commit was pushed.** | `docs/audit/OWNER_NUMERICAL_EQUIVALENCE_LANE_2026-09-01.md`; `.agent-harness/context/FROZEN_DECISIONS.md`; `.agent-harness/context/GATE_REGISTRY.json`; generated board and context pack | No executable scientific path changed. The old-instrument measurement and grade are retained; only method admissibility and its pre-output contract are synchronized. |"""
          lines.insert(separator + 1, row)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit synchronized records locally and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^)"
          rm .github/workflows/d077_ssot_sync.yml

          expected="$(cat <<'EOF'
          .agent-harness/context/CONTEXT_INDEX.json
          .agent-harness/context/FROZEN_DECISIONS.md
          .agent-harness/context/GATE_REGISTRY.json
          .agent-harness/generated/CONTEXT_PACK.md
          .agent-harness/generated/STATUS_BOARD.md
          docs/harness/DECISION_LOG.md
          docs/harness/VALIDATION_LEDGER.md
          EOF
          )"
          actual="$(git diff --name-only "$base" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected final changed paths.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

          git diff --check "$base"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "records(d077): integrate numerical-equivalence authority"

      - name: Final exact-tree verification and push
        shell: bash
        run: |
          set -euo pipefail
          python3 .agent-harness/scripts/validate_harness.py
          python3 -m pytest -q .agent-harness/tests
          python3 .agent-harness/scripts/check_ssot_consistency.py
          python3 .agent-harness/scripts/check_chronology.py
          python3 .agent-harness/scripts/build_status_board.py
          python3 .agent-harness/scripts/build_context_pack.py
          git diff --exit-code -- .agent-harness/generated/STATUS_BOARD.md
          git diff --exit-code -- ':!.agent-harness/generated/CONTEXT_PACK.md' ':!.agent-harness/context/CONTEXT_INDEX.json'
          git show HEAD:.agent-harness/generated/CONTEXT_PACK.md | diff <(sed '4d' -) <(sed '4d' .agent-harness/generated/CONTEXT_PACK.md)
          git diff --check
          git checkout -- .agent-harness/context/CONTEXT_INDEX.json .agent-harness/generated/CONTEXT_PACK.md
          test -z "$(git status --porcelain)"
          git push origin HEAD:records/d077-numerical-equivalence-ssot-20260901
