name: d081r1d1-metrology-repair

on:
  push:
    branches:
      - research/d081r1d1-foundations-20260903

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d1-foundations-20260903
          fetch-depth: 2

      - name: Apply the bounded spectral-metrology repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tests_path = Path("native/rabbit_cpu/src/f10_action_foundations_tests.rs")
          text = tests_path.read_text(encoding="utf-8")
          old_helper = '''fn assert_slice_close(actual: &[f64], expected: &[f64], tolerance: f64) {
              assert_eq!(actual.len(), expected.len());
              let maximum = actual
                  .iter()
                  .zip(expected)
                  .map(|(&left, &right)| scaled_residual(left, right))
                  .fold(0.0_f64, f64::max);
              assert!(
                  maximum <= tolerance,
                  "maximum scaled residual {maximum:.17e} exceeds {tolerance:.17e}"
              );
          }
          '''
          new_helper = '''fn assert_slice_close(actual: &[f64], expected: &[f64], tolerance: f64) {
              assert_eq!(actual.len(), expected.len());
              let block_scale = actual
                  .iter()
                  .chain(expected)
                  .map(|value| value.abs())
                  .fold(f64::MIN_POSITIVE, f64::max);
              // The order-eight modal contractions contain exact or near-zero coefficients.
              // Preserve the relative gate away from zero and admit only a conservative
              // floating-association floor for those cancellation-dominated entries.
              let absolute_floor = 32.0 * f64::EPSILON * block_scale;
              let maximum = actual
                  .iter()
                  .zip(expected)
                  .map(|(&left, &right)| {
                      let absolute = (left - right).abs();
                      if absolute <= absolute_floor {
                          0.0
                      } else {
                          scaled_residual(left, right)
                      }
                  })
                  .fold(0.0_f64, f64::max);
              assert!(
                  maximum <= tolerance,
                  "maximum scaled residual {maximum:.17e} exceeds {tolerance:.17e}; \
                   near-zero absolute floor is {absolute_floor:.17e}"
              );
          }
          '''
          if text.count(old_helper) != 1:
              raise SystemExit("expected exactly one original assert_slice_close helper")
          text = text.replace(old_helper, new_helper)

          marker = '''    #[test]
              fn native_action_matches_python() {
          '''
          new_test = '''    #[test]
              fn mixed_slice_metric_accepts_roundoff_at_zero_and_rejects_material_mutation() {
                  let roundoff_actual = [-8.899_131_431_761_020e-16, 11.313_708_498_984_761];
                  let roundoff_expected = [8.881_784_197_001_252e-16, 11.313_708_498_984_763];
                  assert_slice_close(&roundoff_actual, &roundoff_expected, 2.0e-12);

                  let mutation = std::panic::catch_unwind(|| {
                      assert_slice_close(&[0.0, 1.0], &[0.0, 1.0 + 1.0e-8], 2.0e-12);
                  });
                  assert!(mutation.is_err());
              }

              #[test]
              fn native_action_matches_python() {
          '''
          if text.count(marker) != 1:
              raise SystemExit("expected exactly one native_action test marker")
          text = text.replace(marker, new_test)
          tests_path.write_text(text, encoding="utf-8")

          workflow_path = Path(".github/workflows/d081r1d1_foundations.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          replacements = {
              'test result: ok. 11 passed; 0 failed': 'test result: ok. 12 passed; 0 failed',
              '"tests": {"passed": 11, "failed": 0}': '"tests": {"passed": 12, "failed": 0}',
              'Eleven focused tests passed under release check and strict Clippy.':
                  'Twelve focused tests passed under release check and strict Clippy.',
          }
          for old, new in replacements.items():
              if workflow.count(old) != 1:
                  raise SystemExit(f"expected exactly one workflow occurrence: {old}")
              workflow = workflow.replace(old, new)

          receipt_anchor = '''              "tests": {"passed": 12, "failed": 0},
          '''
          receipt_insert = '''              "tests": {"passed": 12, "failed": 0},
              "spectral_metrology": {
                  "relative_gate_away_from_zero": "unchanged",
                  "near_zero_absolute_floor": "32 * f64::EPSILON * block_max_abs",
                  "diagnostic_workflow_run": 33698931293,
                  "maximum_basis_absolute_difference": 0.0,
                  "maximum_modal_coefficient_absolute_difference": 2.4841240175987878e-15,
                  "maximum_interpolation_absolute_difference": 3.552713678800501e-15,
                  "material_mutation_scale": 1.0e-8,
                  "material_mutation_rejected": True,
              },
          '''
          if workflow.count(receipt_anchor) != 1:
              raise SystemExit("expected exactly one receipt test-count anchor")
          workflow = workflow.replace(receipt_anchor, receipt_insert)

          doc_anchor = '''          ## Scope boundary
          '''
          doc_insert = '''          ## Spectral metrology

          The initial GREEN candidate failed because a pure elementwise relative metric
          divided `1e-15`-scale floating-association differences by coefficients whose
          exact scale is zero. A dedicated diagnostic found the mapped basis bitwise
          identical, maximum modal-coefficient absolute difference
          `2.4841240175987878e-15`, and maximum interpolation absolute difference
          `3.552713678800501e-15`. The relative gate is unchanged away from zero; only a
          `32*epsilon*block_max_abs` roundoff floor is used for cancellation-dominated
          entries. A `1e-8` material mutation remains rejected.

          ## Scope boundary
          '''
          if workflow.count(doc_anchor) != 1:
              raise SystemExit("expected exactly one result-document scope anchor")
          workflow = workflow.replace(doc_anchor, doc_insert)
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

          rm .github/workflows/d081r1d1_spectral_diagnostic.yml
          rm .github/workflows/d081r1d1_metrology_repair.yml
          git diff --check

      - name: Commit the metrology repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(d081r1d1): use mixed spectral roundoff metrology"
          git push origin HEAD:research/d081r1d1-foundations-20260903
