name: d081r1d1-metrology-repair

on:
  push:
    branches:
      - research/d081r1d1-foundations-20260903

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/d081r1d1-foundations-20260903
          fetch-depth: 2

      - name: Apply only the bounded Rust-test metrology repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/rabbit_cpu/src/f10_action_foundations_tests.rs")
          text = path.read_text(encoding="utf-8")
          original = text

          old_helper = '''fn assert_slice_close(actual: &[f64], expected: &[f64], tolerance: f64) {
    assert_eq!(actual.len(), expected.len());
    let maximum = actual
        .iter()
        .zip(expected)
        .map(|(&left, &right)| scaled_residual(left, right))
        .fold(0.0_f64, f64::max);
    assert!(
        maximum <= tolerance,
        "maximum scaled residual {maximum:.17e} exceeds {tolerance:.17e}"
    );
}
'''
          new_helper = '''fn assert_slice_close(actual: &[f64], expected: &[f64], tolerance: f64) {
    assert_eq!(actual.len(), expected.len());
    let block_scale = actual
        .iter()
        .chain(expected)
        .map(|value| value.abs())
        .fold(f64::MIN_POSITIVE, f64::max);
    // Keep the relative gate away from zero, while admitting only the
    // measured order-eight dot-product association floor near exact zero.
    let absolute_floor = 32.0 * f64::EPSILON * block_scale;
    let maximum = actual
        .iter()
        .zip(expected)
        .map(|(&left, &right)| {
            let absolute = (left - right).abs();
            if absolute <= absolute_floor {
                0.0
            } else {
                scaled_residual(left, right)
            }
        })
        .fold(0.0_f64, f64::max);
    assert!(
        maximum <= tolerance,
        "maximum scaled residual {maximum:.17e} exceeds {tolerance:.17e}; \
         near-zero absolute floor is {absolute_floor:.17e}"
    );
}
'''

          if "near-zero absolute floor is" not in text:
              if text.count(old_helper) != 1:
                  raise SystemExit("unable to locate the original slice metric exactly once")
              text = text.replace(old_helper, new_helper)

          marker = '''    fn foundations_fail_closed_and_mutations_are_detected() {
        assert!(F10ActionGrid::affine_legendre(7, 8.0).is_err());
'''
          replacement = '''    fn foundations_fail_closed_and_mutations_are_detected() {
        let roundoff_actual = [-8.899_131_431_761_020e-16, 11.313_708_498_984_761];
        let roundoff_expected = [8.881_784_197_001_252e-16, 11.313_708_498_984_763];
        assert_slice_close(&roundoff_actual, &roundoff_expected, 2.0e-12);

        let material_mutation = std::panic::catch_unwind(|| {
            assert_slice_close(&[0.0, 1.0], &[0.0, 1.0 + 1.0e-8], 2.0e-12);
        });
        assert!(material_mutation.is_err());

        assert!(F10ActionGrid::affine_legendre(7, 8.0).is_err());
'''
          if "let roundoff_actual" not in text:
              if text.count(marker) != 1:
                  raise SystemExit("unable to locate the existing mutation test exactly once")
              text = text.replace(marker, replacement)

          if text == original:
              Path("/tmp/d081r1d1-no-change").write_text("already applied\n")
          else:
              path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Commit and push only the non-workflow Rust test change
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/d081r1d1-no-change ]]; then
            echo "bounded source repair is already present"
            exit 0
          fi
          test "$(git diff --name-only)" = "native/rabbit_cpu/src/f10_action_foundations_tests.rs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/rabbit_cpu/src/f10_action_foundations_tests.rs
          git diff --cached --check
          git commit -m "test(d081r1d1): use mixed spectral roundoff metrology"
          git push origin HEAD:research/d081r1d1-foundations-20260903
